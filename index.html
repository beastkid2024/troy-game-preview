      '<div class="wm-actions"><button class="btn small" onclick="Game.tab(\'city\')">Manage City</button></div>';
  } else if(id.startsWith('op:')){
    const o=(S.outposts||[]).find(o=>'op:'+o.id===id);
    if(!o) return '';
    html='<h3>\u2691 '+esc(o.name)+'</h3>'+
      '<div class="small">Your territory · X:'+o.wx+' Y:'+o.wy+'</div>'+
      '<div class="small" style="margin:4px 0">Each outpost: <b>+3% production</b> · <b>\u00d71.25 gathering</b> inside your borders.</div>'+
      '<div class="wm-actions"><button class="btn small ghost" onclick="Game.removeOutpost(\''+id+'\')">Abandon (refund 60 wood/stone)</button>'+
      '<button class="btn ghost small" onclick="Game.wmCloseSheet()">Close</button></div>';
  } else if(id.startsWith('rally:')){
    const r=(S.rallies||[]).find(r=>'rally:'+r.id===id);
    if(!r) return '';
    const n=NODE_BY_ID[r.nodeId];
    html='<h3>\u2691 War Standard</h3>'+
      '<div class="small">Rally on <b>'+esc(n?n.name:'')+'</b> (X:'+(n?n.wx:'')+' Y:'+(n?n.wy:'')+')</div>'+
      '<div class="small" style="margin:4px 0">Attacks here gain <b>+15%</b> · '+fmtT(Math.max(0,(r.endsAt-nowMs())/1000))+' remaining</div>'+
      '<div class="wm-actions"><button class="btn small" onclick="Game.openComposer(\''+r.nodeId+'\')">March to Rally</button>'+
      '<button class="btn small ghost" onclick="Game.cancelRally(\''+id+'\')">Stand Down</button></div>';
  } else if(id.startsWith('ar:')){
    const r=((S.world&&S.world.rallies)||[]).find(r=>'ar:'+r.id===id);
    html='<h3>\u2691 ['+(r?r.tag:'')+'] Rally</h3>'+
      '<div class="small">An alliance war host is mustering. Their standard flies — then they march.</div>'+
      '<div class="wm-actions"><button class="btn ghost small" onclick="Game.wmCloseSheet()">Close</button></div>';
  } else {
    const n=NODE_BY_ID[id]; if(!n) return '';
    const rec=S.nodes[id]||{};
    const cleared=!!rec.cleared;
    const march=S.marches.find(x=>x.nodeId===id);
    let title=n.name, sub='';
    if(n.kind==='gather'){
      sub='Resource site · '+RES_NAME[n.res];
    } else if(n.kind==='ak'){
      const k=S.world.kingdoms.find(k=>k.id===id);
      sub='Rival kingdom · Level '+n.lvl+' · Power '+fmtN(k?k.power:0)+(n.tag?' · Alliance ['+n.tag+']':'');
    } else {
      sub=(n.kind==='camp'?'Barbarian camp':n.kind==='ruin'?'Ruin':n.kind==='boss'?'FINAL BATTLE':'City')+(n.tier?' · Threat tier '+n.tier+' of 5':'');
    }
    let gstr='';
    if(n.kind!=='gather'){
      const g=n.garrison;
      gstr='<div class="small" style="margin:4px 0"><b>Garrison:</b> '+
        (rec.scouted?esc(TROOP_ORDER.filter(t=>g[t]>0).map(t=>g[t]+' '+TROOPS[t].name).join(', ')):'<i>Unknown</i> — send scouts to reveal.')+'</div>';
    }
    let btns='';
    if(n.kind==='gather'&&!cleared){
      // three-stat node card, always scannable: Reserves / Gatherer / Owner + one action
      const resName=RES_NAME[n.res]||n.res;
      const gstat=march
        ? (march.phase==='out'?'Warband marching ('+fmtT(Math.max(0,(march.arriveAt-nowMs())/1000))+')'
           :march.phase==='gather'?'Your warband — on site':'Warband returning')
        : '—';
      const owner=inPlayerTerritory(n.wx,n.wy)?'Your territory':'Unclaimed wilds';
      const lvlTxt=n.lvl?('Level '+n.lvl+' '):'';
      let action='';
      if(march&&march.phase==='gather'){
        const total=GATHER_TIME*gatherTimeMult(march.hero)*1000;
        const left=Math.max(0,march.gatherAt-nowMs());
        const pct=Math.min(100,Math.round(100*(1-left/total)));
        action='<div class="small" style="padding:8px 12px 0">Gathering '+esc(resName)+'…</div>'+
          '<div class="xpbar" style="margin:6px 12px 0"><div style="width:'+pct+'%"></div></div>'+
          '<div class="small" style="padding:4px 12px 10px">'+pct+'% · '+fmtT(left/1000)+' left</div>';
      } else if(march){
        action='<div class="small" style="padding:10px 12px">March en route — '+(march.phase==='out'?'arrives':'returning')+'.</div>';
      } else {
        action='<div style="padding:0 12px"><button class="btn big-gather" onclick="Game.openComposer(\''+id+'\')">GATHER</button></div>';
      }
      btns='<div class="nodecard" style="flex:1 1 100%">'+
        '<div class="nodecard-head"><span class="lvl">'+esc(lvlTxt+resName+' Deposit')+'</span>'+esc(title)+'</div>'+
        '<div class="nstat"><span>Reserves</span><b>Bountiful · endless</b></div>'+
        '<div class="nstat"><span>Gatherer</span><b>'+esc(gstat)+'</b></div>'+
        '<div class="nstat" style="border-bottom:none"><span>Owner</span><b>'+esc(owner)+'</b></div>'+
        action+'</div>';
    } else if(march){
      btns='<div class="small">March en route — '+(march.phase==='out'?'arrives':'returning')+'.</div>';
    } else if(cleared){
      btns='<div class="small" style="color:#9ab86a">Conquered.</div>';
    } else {
      const scoutBtn=rec.scouted?'':
        (rec.scoutDoneAt?'<div class="small">Scouts en route…</div>'
        :'<button class="btn small" '+(S.res.gold<25?'disabled':'')+' onclick="Game.sendScout(\''+id+'\')">Scout (25 gold)</button>');
      const ral=rallyActiveFor(id);
      const rallyBtn=march?'':(ral
        ?'<div class="small" style="color:#e8c86a">\u2691 Rally active — '+fmtT(Math.max(0,(ral.endsAt-nowMs())/1000))+' left · +15% attack</div>'
        :'<button class="btn small" '+(S.res.gold<50?'disabled':'')+' onclick="Game.plantRally(\''+id+'\')">\u2691 Rally (50 gold)</button>');
      btns=scoutBtn+'<button class="btn red" onclick="Game.openComposer(\''+id+'\')">Attack</button>'+rallyBtn;
    }
    html=(n.kind==='gather'
        ? '<div class="wm-actions">'+btns+'<button class="btn ghost small" onclick="Game.wmCloseSheet()">Close</button></div>'
        : '<h3>'+esc(title)+'</h3><div class="small">'+esc(sub)+'</div>'+gstr+
          '<div class="wm-actions">'+btns+'<button class="btn ghost small" onclick="Game.wmCloseSheet()">Close</button></div>');
  }
  return html;
}
/* Bottom-sheet panel for the tapped entity. Buttons wire to existing
   Game functions: openComposer (march/gather), sendScout (25 gold). */
function selectWorldEntity(id){
  WMAP.sel=id;
  const el=$('#wm-sheet');
  if(!id){ el.classList.remove('open'); el.innerHTML=''; drawWorld(); return; }
  const html=sheetHTML(id);
  if(!html){ el.classList.remove('open'); return; }
  el.innerHTML=html; el.classList.add('open');
  // keep the freshly opened sheet fully visible above the fixed tab bar
  requestAnimationFrame(()=>{ const v=$('#views'); if(v) v.scrollTop=v.scrollHeight; });
  drawWorld();
}

  let m=gatherYieldMult();
  if(node&&node.wx!==undefined&&inPlayerTerritory(node.wx,node.wy)) m*=1.25;
  return m;
}

function save(){
  if(!S) return;
  S.lastSeen = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
  const el = document.getElementById('saveind');
  if(el){
    const t = new Date(S.lastSeen);
    let h = t.getHours(), ap = h>=12?'PM':'AM';
    h = h%12 || 12;
    el.textContent = '\u2713 Saved ' + h + ':' + String(t.getMinutes()).padStart(2,'0') + ' ' + ap;
  }
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || s.v!==1) return null;
    // migrate old single-hero saves BEFORE the generic fill (the fill would
    // otherwise plant a fresh heroes map and hide the legacy xp)
    let legacyHeroXp = null;
    if(s.hero && s.hero.xp!==undefined && !s.heroes) legacyHeroXp = s.hero.xp||0;
    // forward-compat: fill any missing fields
    const d = defaultState();
    for(const k of Object.keys(d)) if(s[k]===undefined) s[k]=d[k];
    if(legacyHeroXp!==null) s.heroes = {theron:{xp:legacyHeroXp}};
    if(!s.player) s.player = {level:1, xp:0};
    if(!s.heroes) s.heroes = {theron:{xp:0}};
    if(!s.hero || typeof s.hero!=='object') s.hero = {active:'theron', away:false, unlocked:['theron']};
    else {
      if(!s.hero.active) s.hero.active='theron';
      if(!Array.isArray(s.hero.unlocked)) s.hero.unlocked=['theron'];
      if(typeof s.hero.away!=='boolean') s.hero.away=false;
      if(!s.heroes[s.hero.active]) s.heroes[s.hero.active]={xp:0};
    }
    if(!s.relics) s.relics = {};
    if(!s.achv) s.achv = {};
    if(typeof s.title!=='string') s.title='';
    if(typeof s.skin!=='string'||!SKINS[s.skin]) s.skin='bronze';
    if(!Array.isArray(s.chronicle)) s.chronicle=[];
    if(!Array.isArray(s.daysSeen)) s.daysSeen=[];
    if(!s.stats) s.stats={trained:0,battles:0,wins:0,gathers:0,raidsRepelled:0,built:0};
    if(s.stats.built===undefined) s.stats.built = Object.values(s.bld||{}).reduce((a,b)=>a+(b||0),0);
    if(!s.records||typeof s.records!=='object') s.records={maxPower:0,bestDayWins:0,winsToday:{day:'',n:0},fastestSkaros:0,bestGather:0,bestStreak:0};
    if(!s.records.winsToday||typeof s.records.winsToday!=='object') s.records.winsToday={day:'',n:0};
    // ---- feature-set migrations (v1->v1+feature set) ----
    if(s.seenWelcome && !s.seenPrologue) s.seenPrologue=true;   // old saves skip the prologue cinematic
    if(s.glory===undefined) s.glory=0;
    if(!Array.isArray(s.outposts)) s.outposts=[];
    if(!Array.isArray(s.rallies)) s.rallies=[];
    if(!s.glory){ // backfill Glory for existing saves from their legend so far
      const q=Object.keys(s.quests||{}).length;
      s.glory=(s.stats.wins||0)*15+q*25+(s.stats.raidsRepelled||0)*15+(s.stats.ruinsFound||0)*10;
    }
    return s;
  }catch(e){ return null; }
}

/* ---------------- helpers ---------------- */
const $ = sel=>document.querySelector(sel);
const nowMs = ()=>Date.now();
function fmtT(sec){
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return m+':'+String(s).padStart(2,'0');
}
function fmtN(n){ return Math.floor(n).toLocaleString('en-US'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function heroLevel(id){
  id = id || (S.hero&&S.hero.active) || 'theron';
  const h = (S.heroes&&S.heroes[id]) || {xp:0};
  let lvl=1, xp=h.xp;
  while(lvl<HERO_MAX_LEVEL && xp>=heroXpNeed(lvl)){ xp-=heroXpNeed(lvl); lvl++; }
  return lvl;
}
function heroHome(){ return !S.hero.away; }
function activeHero(){ return (S.hero&&S.hero.active)||'theron'; }
/* XP goes to the active hero only. */
function gainHeroXP(n){
  const a = activeHero();
  if(!S.heroes[a]) S.heroes[a]={xp:0};
  S.heroes[a].xp += n;
}
function selectHero(id){
  if(!HEROES[id] || !S.hero.unlocked.includes(id)) return;
  if(id===S.hero.active) return;
  if(S.hero.away){ toast('Your hero is on a march — wait for their return to change command.'); return; }
  S.hero.active=id;
  toast(HEROES[id].name+' '+HEROES[id].title+' takes command of Troy.');
  save(); render();
}
/* Deed-based unlocks: Kallias (tier-3 camp), Sostratos (5 gathers), Pyrrhos (player Lv 6). */
function checkHeroUnlocks(){
  const un=id=>{
    if(!S.hero.unlocked.includes(id)){
      S.hero.unlocked.push(id);
      if(!S.heroes[id]) S.heroes[id]={xp:0};
      chronicle(HEROES[id].name+' '+HEROES[id].title+' has joined Troy.');
      toast('\u2694 '+HEROES[id].name+' '+HEROES[id].title+' has joined Troy! Open the Hero tab.');
      save();
    }
  };
  if(S.nodes.camp3 && S.nodes.camp3.cleared) un('kallias');
  if(S.stats.gathers>=5) un('sostratos');
  if(S.player.level>=6) un('pyrrhos');
}
function troopCount(t){ return Math.floor(S.troops[t]||0); }
function armyTotal(troopsObj){
  const o = troopsObj||S.troops;
  return TROOP_ORDER.reduce((s,t)=>s+Math.floor(o[t]||0),0);
}

/* ---------------- player level ---------------- */
function addPlayerXP(n){
  if(S.player.level>=PLAYER_MAX_LEVEL){ S.player.xp=0; return; }
  S.player.xp += n;
  while(S.player.level<PLAYER_MAX_LEVEL && S.player.xp>=playerXpNeed(S.player.level)){
    S.player.xp -= playerXpNeed(S.player.level);
    S.player.level++;
    toast('❖ Player level up! You are now Lv '+S.player.level+' (+2% production, +2% attack)');
  }
  if(S.player.level>=PLAYER_MAX_LEVEL) S.player.xp=0;
}

/* ---------------- economy ---------------- */
function storageCap(){ return 2000 + 1000*(S.bld.palace||1); }
function prodRates(){ // per hour, before player bonus
  const tm=territoryProdMult(); // outposts buff all production
  return {
    food: 60*(S.bld.farm||0)*(hasRelic('sickle')?1.15:1)*(S.patron==='demeter'?1.1:1)*tm,
    wood: 60*(S.bld.lumber||0)*tm,
    stone:60*(S.bld.quarry||0)*tm,
    gold: 40*(S.bld.palace||0)*tm
  };
}
function grantRes(res, silent){
  const cap = storageCap();
  for(const k of RES){
    if(res[k]) S.res[k] = Math.min(cap, S.res[k]+res[k]);
  }
  if(!silent) save();
}
function produce(dtSec){
  const rates = prodRates(), mult = playerProdMult(), cap = storageCap();
  for(const k of RES){
    S.res[k] = Math.min(cap, S.res[k] + rates[k]*mult*dtSec/3600);
  }
}
function buildCost(key, toLevel){
  const base = BUILDINGS[key].base, out = {};
  const f = Math.pow(COST_SCALE, toLevel-1);
  for(const k in base) out[k] = Math.ceil(base[k]*f);
  return out;
}
function canAfford(cost){
  for(const k in cost) if(S.res[k] < cost[k]) return false;
  return true;
}
function pay(cost){
  for(const k in cost) S.res[k] -= cost[k];
}
function costText(cost){
  return Object.keys(cost).map(k=>resImg(k,18)+' '+fmtN(cost[k])).join(' &nbsp; ');
}

/* ---------------- building ---------------- */
function startBuild(key){
  if(S.build){ toast('Builders are already busy.'); return; }
  const lvl = S.bld[key]||0;
  if(lvl>=5){ toast('Already at max level.'); return; }
  const toLevel = lvl+1;
  const cost = buildCost(key, toLevel);
  if(!canAfford(cost)){ toast('Not enough resources.'); return; }
  pay(cost);
  const dur = buildTimeSecs(toLevel);
  S.build = {key:key, toLevel:toLevel, doneAt:nowMs()+dur*1000, dur:dur};
  toast(BUILDINGS[key].name+' → Lv '+toLevel+' started.'+(activeEvent()==='build'?' (Speed-Build Day: half time!)':''));
  save(); render();
}
function completeBuild(){
  const b = S.build;
  S.bld[b.key] = b.toLevel;
  S.build = null;
  S.stats.built++;
  addPlayerXP(XP_BUILD);
  toast(BUILDINGS[b.key].name+' reached level '+b.toLevel+'! (+'+XP_BUILD+' XP)');
  checkQuests();
  save();
}

/* ---------------- training ---------------- */
function trainTime(type){
  const lvl = S.bld.barracks||1;
  return TROOPS[type].time * (1 - 0.08*(lvl-1)); // higher barracks = faster
}
function queueTrain(type, count){
  if((S.bld.barracks||0) < TROOPS[type].need){ toast('Requires Barracks Lv '+TROOPS[type].need+'.'); return; }
  count = Math.max(1, Math.min(50, Math.floor(count)||1));
  const cost = {};
  for(const k in TROOPS[type].cost) cost[k] = TROOPS[type].cost[k]*count;
  if(!canAfford(cost)){ toast('Not enough resources to train '+count+'.'); return; }
  pay(cost);
  const ut = trainTime(type);
  const first = S.tqueue.length===0;
  S.tqueue.push({type:type, left:count, unitTime:ut, unitDoneAt:nowMs()+(first?ut*1000:0)});
  // fix chaining: each batch starts when previous ends
  let t = nowMs();
  for(const b of S.tqueue){
    if(b.left>0 && b.unitDoneAt < t) b.unitDoneAt = t + b.unitTime*1000;
    t = b.unitDoneAt + (b.left-1)*b.unitTime*1000;
  }
  toast('Training '+count+' '+TROOPS[type].name+(count>1?'s':'')+'.');
  save(); render();
}
function tickTraining(){
  let changed = false;
  while(S.tqueue.length>0){
    const b = S.tqueue[0];
    if(nowMs() < b.unitDoneAt) break;
    b.left--; b.unitDoneAt += b.unitTime*1000;
    S.troops[b.type] = (S.troops[b.type]||0)+1;
    S.stats.trained++;
    addPlayerXP(XP_TRAIN);
    changed = true;
    if(b.left<=0) S.tqueue.shift();
    if(S.tqueue.length>0 && S.tqueue[0].unitDoneAt < nowMs()){
      // next batch starts now if its timer was never anchored
      S.tqueue[0].unitDoneAt = Math.max(S.tqueue[0].unitDoneAt, nowMs());
    }
  }
  if(changed){ checkQuests(); save(); }
  return changed;
}
function queueEta(){
  let t = 0;
  for(const b of S.tqueue) t += b.left*b.unitTime;
  return t;
}

/* ---------------- battles ----------------
   Auto-resolved in rounds. Each round both sides deal damage simultaneously
   from surviving units; damage is mitigated by the target's total DEF.
   Counter matchups grant 1.5x attack. Player side gets +2%/player-level
   attack, plus hero bonuses (War Horn) and loss reduction (Shield Wall). */
function simBattle(atk, atkHeroLvl, def, defHeroLvl, opts){
  opts = opts||{};
  const atkHero = opts.atkHero||null, defHero = opts.defHero||null;
  const A={}, D={};
  for(const t of TROOP_ORDER){ A[t]=Math.max(0,Math.floor((atk[t]||0))); D[t]=Math.max(0,Math.floor((def[t]||0))); }
  const sum = o=>TROOP_ORDER.reduce((s,t)=>s+o[t],0);
  const hpOf = o=>TROOP_ORDER.reduce((s,t)=>s+o[t]*TROOPS[t].hp,0);
  const majority = o=>{ let m=TROOP_ORDER[0]; for(const t of TROOP_ORDER) if(o[t]>o[m]) m=t; return m; };
  const mA = majority(A), mD = majority(D);
  const mult = (t, vsMaj)=> (TROOPS[t].strongVs===vsMaj) ? 1.5 : 1;
  const cavAtkMult = atkHero==='pyrrhos' ? 1.2 : 1;   // Pyrrhos: Red Charge
  const atkMult = (atkHeroLvl>0 ? playerAtkMult() : 1) * (atkHeroLvl>0 ? patronAtkMult() : 1) * (atkHero==='theron'&&atkHeroLvl>=4 ? 1.15 : 1) * (opts.atkDmgMult||1) * (hasRelic('whetstone')?1.08:1);
  const defMult = (defHeroLvl>0 ? playerAtkMult() : 1) * (defHero==='theron'&&defHeroLvl>=4 ? 1.15 : 1) * (opts.defAtkMult||1);
  const atkLossRed = (atkHero==='theron'&&atkHeroLvl>=2) ? 0.85 : 1;
  const defLossRed = (defHero==='theron'&&defHeroLvl>=2) ? 0.85 : 1;
  const A0={...A}, D0={...D};
  // Replay frames: raw float snapshots (round 0 = initial, then after each round).
  // Kept unrounded so Math.floor() of the final frame matches atkLeft/defLeft exactly.
  const snap=()=>({a:{spearman:A.spearman,archer:A.archer,cavalry:A.cavalry},
                   d:{spearman:D.spearman,archer:D.archer,cavalry:D.cavalry},
                   hpA:hpOf(A),hpD:hpOf(D)});
  const frames=[snap()];
  let rounds=0;
  while(rounds<50){
    if(sum(A)<=0 || sum(D)<=0) break;
    const pA = TROOP_ORDER.reduce((s,t)=>s+A[t]*TROOPS[t].atk*(t==='cavalry'?cavAtkMult:1)*mult(t,mD),0)*atkMult;
    const pD = TROOP_ORDER.reduce((s,t)=>s+D[t]*TROOPS[t].atk*mult(t,mA),0)*defMult;
    const dA = TROOP_ORDER.reduce((s,t)=>s+A[t]*TROOPS[t].def,0);
    const dD = TROOP_ORDER.reduce((s,t)=>s+D[t]*TROOPS[t].def,0);
    const mitA = 1-Math.min(0.6, dA/(dA+500));
    const mitD = 1-Math.min(0.6, dD/(dD+500));
    const hA = hpOf(A), hD = hpOf(D);
    const fA = hA>0 ? Math.max(0, 1-(pD*mitA*atkLossRed)/hA) : 0;
    const fD = hD>0 ? Math.max(0, 1-(pA*mitD*defLossRed*(opts.defDmgMult||1))/hD) : 0;
    for(const t of TROOP_ORDER){ A[t]*=fA; D[t]*=fD; }
    frames.push(snap());
    rounds++;
  }
  const hpAFrac = hpOf(A0)>0 ? hpOf(A)/hpOf(A0) : 0;
  const hpDFrac = hpOf(D0)>0 ? hpOf(D)/hpOf(D0) : 0;
  const win = (sum(A)>0 && sum(D)<=0) || (sum(A)>0 && sum(D)>0 && hpAFrac>=hpDFrac) ? 'atk'
            : (sum(D)>0 && sum(A)<=0) || hpDFrac>hpAFrac ? 'def' : 'atk';
  const losses = (o0,o1)=>{ const r={}; for(const t of TROOP_ORDER) r[t]=Math.max(0,Math.floor(o0[t]-o1[t])); return r; };
  // Survivors are floored first, then losses are computed from the floored
  // survivors — so "lost + survivors" always equals the troops sent. (Fixes an
  // off-by-one where the report and the returned army disagreed.)
  const atkLeftF={spearman:Math.floor(A.spearman), archer:Math.floor(A.archer), cavalry:Math.floor(A.cavalry)};
  const defLeftF={spearman:Math.floor(D.spearman), archer:Math.floor(D.archer), cavalry:Math.floor(D.cavalry)};
  const atkLost = losses(A0,atkLeftF), defLost = losses(D0,defLeftF);
  const killed = TROOP_ORDER.reduce((s,t)=>s+defLost[t],0);
  return {win:win, rounds:rounds, atkLost:atkLost, defLost:defLost,
          atkLeft:atkLeftF, defLeft:defLeftF,
          xp: 12*killed, replay:frames};
}

/* ---------------- marches ---------------- */
function activeMarches(){ return S.marches.length; }

function sendMarch(nodeId, troops, heroId){
  const node = NODE_BY_ID[nodeId];
  if(!node) return;
  if(S.marches.length>=2){ toast('Only 2 marches at once in this version.'); return; }
  const total = TROOP_ORDER.reduce((s,t)=>s+(troops[t]||0),0);
  if(total<=0){ toast('Select at least one troop.'); return; }
  for(const t of TROOP_ORDER){
    if((troops[t]||0) > troopCount(t)){ toast('Not enough '+TROOPS[t].name+'s.'); return; }
  }
  if(heroId && !heroHome()){ toast(HEROES[heroId].name+' is already on a march.'); return; }
  if(heroId && !S.hero.unlocked.includes(heroId)){ toast('That hero has not joined Troy yet.'); return; }
  if(node.kind!=='gather' && S.nodes[nodeId] && S.nodes[nodeId].cleared){ toast('Already conquered.'); return; }
  // commit troops
  for(const t of TROOP_ORDER) S.troops[t] -= (troops[t]||0);
  if(heroId) S.hero.away = true;
  let secs = node.march;
  if(heroId) secs = Math.round(secs * heroMarchMult(heroId, heroLevel(heroId)));
  const t = nowMs();
  S.marches.push({id:S.marchSeq++, nodeId:nodeId,
    troops:{spearman:troops.spearman||0, archer:troops.archer||0, cavalry:troops.cavalry||0},
    hero:heroId||null, phase:'out', arriveAt:t+secs*1000, gatherAt:0, returnAt:0, marchSecs:secs});
  closeModal();
  toast('Marching to '+node.name+' ('+fmtT(secs)+').');
  if(rallyActiveFor(nodeId)) setTimeout(()=>toast('\u2691 Rally fervor! +15% attack on this assault.'), 600);
  save(); render();
}

/* ================= Feature set: prologue, territory, rallies, living world ================= */
/* addGlory() and patronAtkMult() live beside gatherYieldMult(). */

/* ---- Territory ---- */
function territoryProdMult(){ return 1 + Math.min(0.15, 0.03*((S.outposts||[]).length)); }
function inPlayerTerritory(wx,wy){
  for(const o of (S.outposts||[])){ const dx=o.wx-wx, dy=o.wy-wy; if(dx*dx+dy*dy<o.r*o.r) return true; }
  return false;
}
function seedTerritory(W){
  W.territory={};
  const rnd=mulberry32(WORLD_SEED+99);
  for(const tag of AK_TAGS){
    const ks=W.kingdoms.filter(k=>k.tag===tag).slice(0,8);
    W.territory[tag]=ks.map(k=>({wx:k.wx,wy:k.wy,r:Math.round(340+rnd()*160)}));
  }
}
function tickTerritory(){
  const W=S.world; if(!W||!W.territory) return;
  // every alliance expands: new claims + existing claims swell
  for(const tag of AK_TAGS){
    const claims=W.territory[tag]||(W.territory[tag]=[]);
    if(claims.length<26 && Math.random()<0.55 && claims.length){
      const c0=claims[(Math.random()*claims.length)|0];
      const a=Math.random()*Math.PI*2, d=c0.r*(0.6+Math.random()*0.5);
      claims.push({wx:Math.round(Math.max(200,Math.min(WORLD-200,c0.wx+Math.cos(a)*d))),
                   wy:Math.round(Math.max(200,Math.min(WORLD-200,c0.wy+Math.sin(a)*d))),
                   r:Math.round(300+Math.random()*180)});
    }
    for(const c of claims) if(c.r<650 && Math.random()<0.3) c.r+=3;
  }
  // border friction: rival claims that overlap can clash; the loser cedes ground
  const all=[];
  for(const tag of AK_TAGS) for(const c of (W.territory[tag]||[])) all.push({tag:tag,c:c});
  for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++){
    const A=all[i], B=all[j]; if(A.tag===B.tag) continue;
    const dx=A.c.wx-B.c.wx, dy=A.c.wy-B.c.wy, rr=A.c.r+B.c.r;
    if(dx*dx+dy*dy < rr*rr*0.8 && Math.random()<0.02){
      const mx=(A.c.wx+B.c.wx)/2, my=(A.c.wy+B.c.wy)/2;
      pulseAt(mx,my);
      const ka=W.kingdoms.find(k=>k.tag===A.tag), kb=W.kingdoms.find(k=>k.tag===B.tag);
      const na=ka?ka.name:'warband', nb=kb?kb.name:'warband';
      if(Math.random()<0.5){
        B.c.r=Math.max(180,B.c.r-90);
        pushFeed('['+A.tag+'] '+na+' drove back ['+B.tag+'] '+nb+' on the frontier');
        if(B.c.r<=180){ const arr=W.territory[B.tag]; arr.splice(arr.indexOf(B.c),1); }
      } else {
        A.c.r=Math.max(180,A.c.r-90);
        pushFeed('['+B.tag+'] '+nb+' drove back ['+A.tag+'] '+na+' on the frontier');
        if(A.c.r<=180){ const arr=W.territory[A.tag]; arr.splice(arr.indexOf(A.c),1); }
      }
    }
  }
  // friction with the player's own borders (rare warning, never silent damage)
  for(const o of (S.outposts||[])){
    for(const tag of AK_TAGS){
      for(const c of (W.territory[tag]||[])){
        const dx=o.wx-c.wx, dy=o.wy-c.wy, rr=o.r+c.r;
        if(dx*dx+dy*dy < rr*rr*0.7 && Math.random()<0.06){
          pushFeed('\u26a0 ['+tag+'] warbands probe the border of '+esc(o.name)+'.');
          break;
        }
      }
    }
  }
}
function drawTerritory(c){
  const W=S.world; if(!W||!W.territory) return;
  // subtle tinted fills first (overlapping claims of one alliance read as one land)
  for(const tag of AK_TAGS){
    const col=TAG_COLORS[tag]||'#c9a227';
    c.fillStyle=col;
    for(const cl of (W.territory[tag]||[])){
      const p=w2s(cl.wx,cl.wy), r=cl.r*WMAP.cam.z;
      if(r<2) continue;
      c.globalAlpha=0.16; c.beginPath(); c.arc(p.x,p.y,r,0,7); c.fill();
    }
  }
  // clean edge lines second, so no band ever covers a fill
  for(const tag of AK_TAGS){
    const col=TAG_COLORS[tag]||'#c9a227';
    c.strokeStyle=col; c.lineWidth=1.5;
    for(const cl of (W.territory[tag]||[])){
      const p=w2s(cl.wx,cl.wy), r=cl.r*WMAP.cam.z;
      if(r<2) continue;
      c.globalAlpha=0.65; c.beginPath(); c.arc(p.x,p.y,r,0,7); c.stroke();
    }
  }
  c.globalAlpha=1;
  // player's own territory: gold tint + brighter edge
  for(const o of (S.outposts||[])){
    const p=w2s(o.wx,o.wy), r=o.r*WMAP.cam.z;
    if(r<2) continue;
    c.globalAlpha=0.13; c.fillStyle='#c9a227';
    c.beginPath(); c.arc(p.x,p.y,r,0,7); c.fill();
    c.globalAlpha=0.65; c.strokeStyle='#e8c86a'; c.lineWidth=2;
    c.beginPath(); c.arc(p.x,p.y,r,0,7); c.stroke();
  }
  c.globalAlpha=1;
}
function drawOutposts(c){
  for(const o of (S.outposts||[])){
    const p=w2s(o.wx,o.wy);
    // palisade + banner pole + gold pennant
    c.strokeStyle='#7a5a2a'; c.lineWidth=3;
    c.beginPath(); c.moveTo(p.x-11,p.y+12); c.lineTo(p.x-11,p.y+2); c.moveTo(p.x+11,p.y+12); c.lineTo(p.x+11,p.y+2); c.stroke();
    c.strokeStyle='#3a2410'; c.lineWidth=4;
    c.beginPath(); c.moveTo(p.x,p.y+12); c.lineTo(p.x,p.y-34); c.stroke();
    c.fillStyle='#e8c86a';
    c.beginPath(); c.moveTo(p.x,p.y-34); c.lineTo(p.x+20,p.y-34); c.lineTo(p.x+13,p.y-27); c.lineTo(p.x+20,p.y-20); c.lineTo(p.x,p.y-20); c.closePath(); c.fill();
    drawPlaque(c,p.x,p.y-44,esc(o.name),{fs:10});
    WMAP.drawn.push({id:'op:'+o.id,sx:p.x,sy:p.y});
  }
}

/* ---- Rally beacons / war standards ---- */
function rallyActiveFor(nodeId){ const now=nowMs(); return (S.rallies||[]).find(r=>r.nodeId===nodeId && r.endsAt>now)||null; }
function tickRallies(){
  if(!S.rallies||!S.rallies.length) return;
  const before=S.rallies.length, now=nowMs();
  S.rallies=S.rallies.filter(r=>r.endsAt>now);
  if(S.rallies.length!==before){ toast('The war standard is lowered — the rally has ended.'); save(); }
}
function plantRally(nodeId){
  const node=NODE_BY_ID[nodeId]; if(!node) return;
  if(rallyActiveFor(nodeId)){ toast('A rally is already mustered here.'); return; }
  if(S.rallies.some(r=>r.endsAt>nowMs())){ toast('Only one war standard can fly at a time.'); return; }
  if(S.res.gold<50){ toast('Not enough gold (50).'); return; }
  S.res.gold-=50;
  const r={id:'r'+nowMs(), nodeId:nodeId, endsAt:nowMs()+90000};
  S.rallies.push(r);
  pushFeed('You raised a war standard — rally on <b>'+esc(node.name)+'</b>! (+15% attack for 90s)');
  pulseAt(node.wx,node.wy);
  save(); selectWorldEntity(nodeId); drawWorld();
  showBanner('⚑ RALLY LAUNCHED', 'The war standard flies over '+node.name+' — +15% attack for 90s');
  toast('\u2691 Rally planted on '+esc(node.name)+' — attacks there gain +15% for 90s.');
}
function cancelRally(rid){
  S.rallies=(S.rallies||[]).filter(r=>'rally:'+r.id!==rid);
  save(); selectWorldEntity(null); drawWorld();
}
function drawWarStandard(c,x,y,color,label){
  const t=nowMs()/300;
  c.globalAlpha=0.55; c.strokeStyle=color; c.lineWidth=2;
  c.beginPath(); c.arc(x,y,26+6*Math.sin(t),0,7); c.stroke();
  c.globalAlpha=1;
  c.strokeStyle='#5a3a1a'; c.lineWidth=5;
  c.beginPath(); c.moveTo(x,y+12); c.lineTo(x,y-48); c.stroke();
  c.lineWidth=3; c.beginPath(); c.moveTo(x,y-48); c.lineTo(x+26,y-48); c.stroke();
  c.fillStyle=color;
  c.beginPath(); c.moveTo(x,y-48); c.lineTo(x+26,y-48); c.lineTo(x+26,y-34); c.lineTo(x+18,y-41); c.lineTo(x+10,y-34); c.lineTo(x,y-34); c.closePath(); c.fill();
  c.fillStyle='#f0d98a'; c.beginPath(); c.arc(x,y-52,5,0,7); c.fill();
  if(label) drawPlaque(c,x,y-66,label,{fs:10});
}
function drawRallies(c,now){
  for(const r of (S.rallies||[])){
    const n=NODE_BY_ID[r.nodeId]; if(!n) continue;
    const p=w2s(n.wx,n.wy);
    drawWarStandard(c,p.x,p.y,'#e8c86a',fmtT(Math.max(0,(r.endsAt-now)/1000))+' \u00b7 X:'+n.wx+' Y:'+n.wy);
    WMAP.drawn.push({id:'rally:'+r.id,sx:p.x,sy:p.y});
  }
  const W=S.world;
  for(const r of ((W&&W.rallies)||[])){
    const p=w2s(r.wx,r.wy);
    drawWarStandard(c,p.x,p.y,TAG_COLORS[r.tag]||'#c9a227','['+r.tag+'] rally');
    WMAP.drawn.push({id:'ar:'+r.id,sx:p.x,sy:p.y});
  }
}
function tickAIRallies(){
  const W=S.world; if(!W) return; const now=nowMs();
  W.rallies=W.rallies||[];
  const done=W.rallies.filter(r=>r.endsAt<=now);
  W.rallies=W.rallies.filter(r=>r.endsAt>now);
  for(const r of done) launchAISiege(r);
  if(W.rallies.length<2 && Math.random()<0.18){
    const tag=AK_TAGS[(Math.random()*AK_TAGS.length)|0];
    const pool=W.kingdoms.filter(k=>k.tag!==tag && !(S.nodes[k.id]&&S.nodes[k.id].cleared));
    if(!pool.length) return;
    const tgt=pool[(Math.random()*pool.length)|0];
    const atk=W.kingdoms.find(k=>k.tag===tag);
    W.rallies.push({id:'ar'+now+((Math.random()*999)|0), tag:tag, wx:tgt.wx, wy:tgt.wy, targetId:tgt.id, endsAt:now+90000});
    pushFeed('['+tag+'] '+(atk?atk.name:'war host')+' sounds the war horn — rally on ['+tgt.tag+'] '+tgt.name+'! (X:'+tgt.wx+' Y:'+tgt.wy+')');
    pulseAt(tgt.wx,tgt.wy);
  }
}
function launchAISiege(r){
  const W=S.world; if(!W) return; const now=nowMs();
  W.sieges=W.sieges||{};
  W.sieges[r.targetId]={until:now+120000, tag:r.tag, t0:now};
  const k=W.kingdoms.find(k=>k.id===r.targetId);
  const kn=k?'['+k.tag+'] '+k.name:'the target';
  if(Math.random()<0.4){
    const rec=S.nodes[r.targetId]||{}; rec.cleared=true; rec.clearedAt=now; S.nodes[r.targetId]=rec;
    pushFeed('['+r.tag+'] war host storms '+kn+' — the city burns!');
    chronicle('A ['+r.tag+'] war host burned '+kn+' to the ground.');
  } else {
    pushFeed(kn+' holds against the ['+r.tag+'] war host!');
  }
  pulseAt(r.wx,r.wy);
}
function tickSieges(){
  const W=S.world; if(!W||!W.sieges) return; const now=nowMs();
  for(const id of Object.keys(W.sieges)) if(W.sieges[id].until<=now) delete W.sieges[id];
}

/* ---- Living world: movement intentions, pulses, siege fire ---- */
function tickIntentions(){
  const W=S.world; if(!W) return; const now=nowMs();
  W.intentions=(W.intentions||[]).filter(i=>i.endsAt>now);
  if(W.intentions.length<3 && Math.random()<0.2 && W.kingdoms.length>1){
    const a=W.kingdoms[(Math.random()*W.kingdoms.length)|0];
    const b=W.kingdoms[(Math.random()*W.kingdoms.length)|0];
    if(a&&b&&a!==b){
      const hostile=a.tag!==b.tag;
      W.intentions.push({ax:a.wx,ay:a.wy,bx:b.wx,by:b.wy,endsAt:now+60000,
        col:hostile?'200,70,50':'240,217,138'});
    }
  }
}
function drawIntentions(c,now){
  const W=S.world; if(!W||!W.intentions) return;
  c.lineWidth=2; c.setLineDash([7,7]);
  for(const i of W.intentions){
    const fade=Math.max(0,Math.min(1,(i.endsAt-now)/15000));
    if(fade<=0) continue;
    const a=w2s(i.ax,i.ay), b=w2s(i.bx,i.by);
    c.globalAlpha=0.5*fade; c.strokeStyle='rgb('+i.col+')';
    c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke();
    c.globalAlpha=0.85*fade; c.fillStyle='rgb('+i.col+')';
    c.save(); c.translate(b.x,b.y); c.rotate(Math.PI/4); c.fillRect(-5,-5,10,10); c.restore();
  }
  c.setLineDash([]); c.globalAlpha=1;
}
function pulseAt(wx,wy){
  const W=S.world; if(!W) return;
  W.pulses=W.pulses||[];
  W.pulses.push({wx:wx,wy:wy,t0:nowMs()});
  if(W.pulses.length>14) W.pulses.shift();
}
function drawPulses(c,now){
  const W=S.world; if(!W||!W.pulses) return;
  W.pulses=W.pulses.filter(p=>now-p.t0<3000);
  for(const p of W.pulses){
    const age=(now-p.t0)/3000, pt=w2s(p.wx,p.wy);
    c.globalAlpha=Math.max(0,0.8*(1-age)); c.strokeStyle='#f0d98a'; c.lineWidth=3;
    c.beginPath(); c.arc(pt.x,pt.y,18+age*70,0,7); c.stroke();
  }
  c.globalAlpha=1;
}
/* Siege damage progression: 1 = smoke, 2 = smoke + fire, 3 = burning (flames + embers) */
function drawSiegeFire(c,x,y,s,level,now){
  const t=now/300;
  c.fillStyle='rgba(90,90,90,0.45)';
  for(let i=0;i<3;i++){
    const yy=y-s*1.6-((t*14+i*22)%66), xx=x+Math.sin(t+i*2)*8;
    c.beginPath(); c.arc(xx,yy,7+i*3,0,7); c.fill();
  }
  if(level>=2){
    for(let i=0;i<3;i++){
      const fx=x+(i-1)*s*0.5, fy=y-s*0.6, fl=10+Math.sin(t*2+i)*4;
      c.fillStyle=i%2?'#e07a2a':'#f0b93a';
      c.beginPath(); c.moveTo(fx-7,fy); c.quadraticCurveTo(fx,fy-fl*1.6,fx+7,fy); c.closePath(); c.fill();
      c.fillStyle='#fff3c9'; c.beginPath(); c.arc(fx,fy-fl*0.5,3,0,7); c.fill();
    }
  }
  if(level>=3){
    c.fillStyle='#ffd97a';
    for(let i=0;i<4;i++){
      const ex=x+Math.sin(t*1.7+i*1.9)*s*0.7, ey=y-s*0.8-((t*30+i*26)%90);
      c.globalAlpha=0.85; c.beginPath(); c.arc(ex,ey,2.6,0,7); c.fill();
    }
    c.globalAlpha=1;
  }
}

/* ---- Chronicle-style battle reports ---- */
function decisiveRound(r){
  const f=r.replay||[]; if(f.length<2) return 1;
  let bi=1, bd=-1;
  for(let i=1;i<f.length;i++){ const d=f[i-1].hpD-f[i].hpD; if(d>bd){ bd=d; bi=i; } }
  return bi;
}
function troopList(t){
  const parts=TROOP_ORDER.filter(k=>t&&t[k]>0).map(k=>fmtN(t[k])+' '+TROOPS[k].name);
  return parts.length?parts.join(', '):'none';
}
function chronicleBattleHTML(o){

  // Trophy card: duel header with power deltas, slain/fallen/remaining grid,
  // wax victor stamp, renown headline. Built to be screenshotted.
  const r=o.report;

  const ourPow=armyPower(o.committed||{}), foePow=armyPower((NODE_BY_ID[o.nodeId]||{garrison:{}}).garrison||{});
  // fallback: reconstruct initial enemy forces from survivors + losses (exact)
  const foeInitPow=foePow>0?foePow:armyPower(Object.fromEntries(TROOP_ORDER.map(t=>[t,(r.defLeft[t]||0)+(r.defLost[t]||0)])));

function resolveAttackMarch(m, silent){
  const node = NODE_BY_ID[m.nodeId];
  if(m.hero===true) m.hero='theron';   // normalize ancient saves
  const heroId = m.hero||null;
  const heroLvl = heroId ? heroLevel(heroId) : 0;
  const r = simBattle(m.troops, heroLvl, node.garrison, 0, {defAtkMult:node.wallMult||1, atkHero:heroId, atkDmgMult:rallyActiveFor(m.nodeId)?1.15:1});
  S.stats.battles++;
  const won = r.win==='atk';
  const kills = TROOP_ORDER.reduce((s,t)=>s+r.defLost[t],0);
  const rally = rallyActiveFor(m.nodeId);
  let lootGranted = {};
  const heroXpGain = heroId ? (won ? r.xp : Math.floor(r.xp/3)) : 0;
  if(heroId) gainHeroXP(heroXpGain);
  let relicFound = null;
  if(won){
    S.stats.wins++;
    recordBattleWin();
    lootGranted = {...(node.loot||{})};
    grantRes(lootGranted, true);
    const rec = S.nodes[m.nodeId]||{};
    rec.cleared = true; rec.clearedAt = nowMs(); S.nodes[m.nodeId] = rec;
    addPlayerXP(XP_BATTLE_WIN);
    // relics: first clear of a ruin grants its unique relic
    if(node.kind==='ruin'){
      const rid = RUIN_RELIC[m.nodeId];
      if(rid && !hasRelic(rid)){
        S.relics[rid]=true; relicFound = rid;
        chronicle('Relic recovered: '+RELICS[rid].name+'.');
        setTimeout(()=>{ showBanner('🏺 RELIC RECOVERED', RELICS[rid].name+' — '+RELICS[rid].desc);
          toast('\uD83C\uDFFA Relic found: <b>'+RELICS[rid].name+'</b> — '+RELICS[rid].desc); }, 1200);
      }
    }
    if(node.kind==='boss'){
      S.victory = true;
      // Swiftest Vengeance: fewest calendar days from founding to Skaros' fall
      ensureRecords();
      const days=(S.daysSeen||[]).length||1;
      if(!S.records.fastestSkaros||days<S.records.fastestSkaros) S.records.fastestSkaros=days;
      chronicle('Skaros the Render lies broken before the Bronze Gate!');
      setTimeout(()=>showBanner('⚔ SKAROS HAS FALLEN', 'Troy stands unchallenged — the age of the Bronze City begins'), 2500);
    }
  }
  // survivors return home
  m.phase='back'; m.returnAt = nowMs()+m.marchSecs*1000;
  m.survivors = r.atkLeft;
  // battle scars: failed assaults leave smoke/fire on the map; cleared foes burn out
  { const sc=S.nodes[m.nodeId]||{}; if(!sc.cleared) sc.dmg=Math.min(3,(sc.dmg||0)+1); S.nodes[m.nodeId]=sc; }
  // hero moments + Glory
  let heroMoment=null;
  if(won && heroId && Math.random()<0.35){ heroMoment=heroMomentText(heroId, node.name); chronicle(heroMoment); }
  const gloryGain = won ? 10+kills+(heroMoment?25:0)+(rally?5:0) : Math.floor(kills/2);
  addGlory(gloryGain);
  m.result = {won:won, report:r, nodeId:m.nodeId, nodeName:node.name, loot:lootGranted, heroXp:heroXpGain,
    troopsSent:{...m.troops}, glory:gloryGain, heroMoment:heroMoment,
    heroName:heroId?HEROES[heroId].name:null, rally:!!rally, xp:XP_BATTLE_WIN, relic:relicFound,
    dmgRed:(heroId==='theron'&&heroLvl>=2)?0.85:1, heroId:heroId};
  chronicle((won?'Victory at ':'Defeat at ')+node.name+(won?'.':' — the bards will not sing of this day.'));
  checkQuests();
  return m.result;
}

function tickMarches(silent){
  let changed=false, reports=[];
  for(const m of S.marches){
    if(m.hero===true) m.hero='theron';   // normalize ancient saves
    const node = NODE_BY_ID[m.nodeId];
    if(m.phase==='out' && nowMs()>=m.arriveAt){
      if(node.kind==='gather'){
        m.phase='gather'; m.gatherAt = nowMs()+GATHER_TIME*gatherTimeMult(m.hero)*1000;
        if(!silent) toast('\u26fa Gatherers arrived at '+esc(node.name)+' — collecting '+RES_NAME[node.res]+'\u2026');
      } else {
        const res = resolveAttackMarch(m, silent);
        reports.push(res);
      }
      changed=true;
    } else if(m.phase==='gather' && nowMs()>=m.gatherAt){
      const n = armyTotal(m.troops);
      m.cargo = {}; m.cargo[node.res] = Math.round(n*GATHER_YIELD*gatherSiteMult(node));
      ensureRecords();
      if(m.cargo[node.res]>S.records.bestGather) S.records.bestGather=m.cargo[node.res];
      S.stats.gathers++;
      addPlayerXP(XP_GATHER);
      m.phase='back'; m.returnAt = nowMs()+m.marchSecs*1000;
      changed=true;
    } else if(m.phase==='back' && nowMs()>=m.returnAt){
      // deliver survivors + cargo
      const sv = m.survivors||m.troops;
      for(const t of TROOP_ORDER) S.troops[t]=(S.troops[t]||0)+Math.floor(sv[t]||0);
      if(m.cargo) grantRes(m.cargo, true);
      if(m.hero) S.hero.away=false;
      m.done=true; changed=true;
      // battle reports were already shown at resolve time; only toast gather returns here
      if(m.cargo && !silent) toast('Gatherers returned: +'+fmtN(m.cargo[node.res])+' '+RES_NAME[node.res]+' (+'+XP_GATHER+' XP)');
      checkQuests();
    }
  }
  const before = S.marches.length;
  S.marches = S.marches.filter(m=>!m.done);
  if(S.marches.length!==before) changed=true;
  if(changed) save();
  return reports;
}

/* gathering speed: Sostratos' Full Wagons finishes trips 25% faster */
function gatherTimeMult(heroId){ return heroId==='sostratos' ? 0.75 : 1; }

/* ---------------- scouting ----------------
   Garrison intel is hidden until scouts reveal it. 25 gold, 60 seconds. */
function sendScout(id){
  const n = NODE_BY_ID[id];
  if(!n || n.kind==='gather') return;
  const rec = S.nodes[id]||{};
  if(rec.scouted){ toast('Already scouted.'); return; }
  if(rec.scoutDoneAt){ toast('Scouts are already en route.'); return; }
  if(S.nodes[id]&&S.nodes[id].cleared){ toast('Already conquered — nothing to scout.'); return; }
  if(S.res.gold<25){ toast('Not enough gold (25 needed for scouts).'); return; }
  S.res.gold -= 25;
  rec.scoutDoneAt = nowMs()+60*1000;
  S.nodes[id] = rec;
  toast('\uD83D\uDD75 Scouts dispatched to '+n.name+' — report in 60 seconds.');
  save(); openNode(id);
}
function tickScouts(){
  const now=nowMs(); let changed=false;
  for(const id in S.nodes){
    const r=S.nodes[id];
    if(r && r.scoutDoneAt && !r.scouted && now>=r.scoutDoneAt){
      r.scouted=true; delete r.scoutDoneAt; changed=true;
      const n=NODE_BY_ID[id];
      const gstr=TROOP_ORDER.filter(t=>n.garrison[t]>0).map(t=>n.garrison[t]+' '+TROOPS[t].name).join(', ');
      toast('\uD83D\uDD75 Scouts report from '+n.name+': '+gstr+'.');
    }
  }
  if(changed) save();
}

/* ---------------- raids (defend the city) ---------------- */
function armyPower(troopsObj){
  const o = troopsObj||S.troops;
  return TROOP_ORDER.reduce((s,t)=>s+Math.floor(o[t]||0)*(TROOPS[t].atk+TROOPS[t].def),0);
}
// First warband strikes ~10 min after raids unlock; afterwards every 20-40 min
// (randomized). A 2-minute warning precedes each raid so the player can garrison troops.
function scheduleNextRaid(fromMs, first){
  const mins = first ? 10 : 20 + Math.random()*20;
  S.nextRaidAt = fromMs + mins*60*1000;
  S.raidWarnAt = S.nextRaidAt - 2*60*1000;
  S.raidWarned = false;
}

/* Weekly events scheduler: the Warlord Incursion strikes once each Wednesday.
   Schedules a single flagged raid ~5 min out (3-min heads-up warning). */
function tickEvents(){
  const shielded = S.shieldUntil && nowMs()<S.shieldUntil;
  if(activeEvent()==='incursion' && S.raidsOn && !shielded){
    const today = dayString(new Date());
    if(S.incursionDay!==today){
      S.incursionDay = today;
      S.incursionNext = true;
      const t = nowMs();
      S.nextRaidAt = t + 5*60*1000;
      S.raidWarnAt = t + 3*60*1000;
      S.raidWarned = false;
      save();
    }
  }
}

// Walls contribute militia: folded into the spearman count at 0.75 power each.
function raidDefenseWithMilitia(){
  // returns {def, note} — militia folded into spearman count at 0.75 power each
  const m = (S.bld.walls||0)*10;
  return {spearman:troopCount('spearman')+Math.round(m*0.75), archer:troopCount('archer'), cavalry:troopCount('cavalry'), militia:m};
}
function tickRaid(silent){
  if(!S.raidsOn) return null;
  if(!S.raidWarnAt) S.raidWarnAt = S.nextRaidAt - 2*60*1000;   // normalize old saves
  const now = nowMs();
  if(S.shieldUntil && now < S.shieldUntil){
    // Beginner shield: park the raid clock until the shield drops.
    if(S.nextRaidAt && S.nextRaidAt < now) scheduleNextRaid(S.shieldUntil, false);
    return null;
  }
  // Warning phase: ~2 min heads-up in live sessions (offline raids resolve silently).
  if(!silent && !S.raidWarned && now>=S.raidWarnAt && now<S.nextRaidAt){
    S.raidWarned = true; save();
    toast(S.incursionNext
      ? '\u2620 <b>Warlord Incursion!</b> Skaros\u2019s champions march on Troy — they strike in ~2 minutes. Garrison every spear!'
      : '⚠ Warband approaching! Raiders strike Troy in ~2 minutes — keep troops garrisoned!');
    return {warn:true};
  }
  if(now < S.nextRaidAt) return null;
  const def = raidDefenseWithMilitia();
  const realDef = {spearman:troopCount('spearman'), archer:troopCount('archer'), cavalry:troopCount('cavalry')};
  const totalTroops = armyTotal();
  const jitter = silent ? 1 : (0.85+Math.random()*0.3);
  // Warband strength scales with player level + garrison size: beatable if you
  // prepare (troops home, Walls raised), costly if you don't.
  const raidN = Math.max(5, Math.round((2 + S.player.level + totalTroops*0.3) * jitter));
  const isIncursion = !!S.incursionNext;
  const raid = isIncursion
    ? {spearman:raidN, archer:Math.round(raidN*0.6), cavalry:Math.round(raidN*0.3)}
    : {spearman:raidN, archer:0, cavalry:0};
  const defHeroLvl = heroHome() ? heroLevel() : 0;
  const defHero = heroHome() ? S.hero.active : null;
  // Walls blunt the assault: each Walls level = -6% attacker damage.
  // Theron home (Bronze Phalanx) + Helm of the Drowned King blunt it further.
  const wallDmgMult = Math.max(0.4, 1 - 0.06*(S.bld.walls||0));
  const defDmgMult = heroHomeDefMult() * (hasRelic('helm')?0.9:1);
  const r = simBattle(raid, 0, def, defHeroLvl, {atkDmgMult:wallDmgMult, defHero:defHero, defDmgMult:defDmgMult});
  S.incursionNext = false;
  S.stats.battles++;
  // scale militia-inflated losses back to real troops proportionally
  const militia = def.militia||0;
  const realTotal = Math.max(1, armyTotal(realDef));
  const shownTotal = Math.max(1, armyTotal(def));
  for(const t of TROOP_ORDER){
    const scaledLoss = Math.round(r.defLost[t]*(realTotal/shownTotal));
    S.troops[t] = Math.max(0, (S.troops[t]||0)-scaledLoss);
  }
  const raidKills = TROOP_ORDER.reduce((s,t)=>s+r.atkLost[t],0);
  let msg;
  if(r.win==='def'){
    S.stats.wins++; S.stats.raidsRepelled++; recordBattleWin();
    const raidGlory=15+raidKills; addGlory(raidGlory);
    if(isIncursion){
      grantRes({food:250, wood:250, stone:200, gold:300}, true);
      addPlayerXP(XP_BATTLE_WIN);
      chronicle('Warlord Incursion repelled at the walls of Troy!');
      msg={title:'Incursion Repelled!', won:true, report:r, militia:militia, glory:raidGlory,
           text:'Skaros\u2019s champions break against your walls! War chest seized: +250 food, +250 wood, +200 stone, +300 gold. (+'+XP_BATTLE_WIN+' XP)'};
    } else {
      grantRes({gold:50}, true);
      addPlayerXP(XP_BATTLE_WIN);
      chronicle('Raid repelled at the Bronze Gate.');
      msg={title:'Raid Repelled!', won:true, report:r, militia:militia, glory:raidGlory,
           text:'Your walls held and the raiders fled. +50 gold looted from their camp. (+'+XP_BATTLE_WIN+' XP)'};
    }
  } else {
    const loss={};
    for(const k of RES){ loss[k]=Math.floor(S.res[k]*0.08); S.res[k]-=loss[k]; }
    chronicle('Raiders plundered the stores of Troy.');
    msg={title:'Troy Was Raided!', won:false, report:r, militia:militia, loss:loss,
         text:'Raiders broke through and plundered your stores (-8% of each resource). Raise your Walls and keep troops garrisoned!'};
  }
  scheduleNextRaid(nowMs(), false);
  checkQuests(); save();
  return msg;
}

/* ---------------- quests ---------------- */
function questState(q){
  if(S.quests[q.id]) return 'done';
  const idx = QUESTS.indexOf(q);
  if(idx>0 && !S.quests[QUESTS[idx-1].id]) return 'locked';
  return q.check() ? 'claimable' : 'active';
}
function currentQuest(){
  for(const q of QUESTS){ const st=questState(q); if(st==='active'||st==='claimable') return {q:q, st:st}; }
  return null;
}
function checkQuests(){ /* states are derived; nothing to store */ }
function claimQuest(id){
  const q = QUESTS.find(x=>x.id===id);
  if(!q || questState(q)!=='claimable') return;
  S.quests[id]=true;
  chronicle('Quest completed: '+q.name+'.');
  const rw=[];
  if(q.reward) for(const k of Object.keys(q.reward)){
    if(k==='heroxp'){ gainHeroXP(q.reward[k]); rw.push(q.reward[k]+' hero XP'); }
    else { grantRes({[k]:q.reward[k]}, true); rw.push('+'+q.reward[k]+' '+RES_NAME[k]); }
  }
  addPlayerXP(XP_QUEST);
  rw.push('+'+XP_QUEST+' XP');
  addGlory(25); rw.push('+25 ❖ Glory');
  if(id==='q4' && !S.raidsOn){
    S.raidsOn=true; scheduleNextRaid(nowMs(), true);
    S.shieldUntil = nowMs() + 24*60*60*1000;   // beginner shield: 24h of peace (online version: 3 days)
    setTimeout(()=>toast('🛡 Beginner shield: raiders cannot strike for 24 hours. After that, warbands come every 20–40 min — keep troops home and raise your Walls!'), 600);
  }
  if(id==='q8'){ S.victory=true; }
  toast('Quest complete: '+q.name+' — '+rw.join(', '));
  save(); render();
}

/* ---------------- daily login tribute ----------------
   Streak tracked by local calendar-day string (not timestamp). First load of a
   new day grants an escalating 7-day streak reward; missing a day resets to 1. */
const DAILY_TRIBUTE = [
  {food:150, wood:150},
  {food:200, wood:200, stone:100},
  {food:250, wood:250, stone:150, gold:100},
  {food:300, wood:300, stone:200, gold:150, xp:60},
  {food:350, wood:350, stone:250, gold:200, xp:80},
  {food:400, wood:400, stone:300, gold:250, xp:100},
  {food:500, wood:500, stone:400, gold:350, xp:150, heroxp:60}
];
function tributeDesc(rw){
  const p=[];
  for(const k of RES) if(rw[k]) p.push('+'+fmtN(rw[k])+' '+RES_NAME[k]);
  if(rw.xp) p.push('+'+rw.xp+' player XP');
  if(rw.heroxp) p.push('+'+rw.heroxp+' hero XP');
  return p.join(', ');
}
function dayString(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dailyLogin(){
  if(!S.daily) S.daily={lastDay:'', streak:0};
  const now=new Date(), today=dayString(now);
  if(S.daily.lastDay===today) return null;
  const yesterday=dayString(new Date(now.getTime()-86400000));
  S.daily.streak = (S.daily.lastDay===yesterday) ? Math.min(7, S.daily.streak+1) : 1;
  ensureRecords();
  if(S.daily.streak>S.records.bestStreak) S.records.bestStreak=S.daily.streak;
  S.daily.lastDay = today;
  if(!Array.isArray(S.daysSeen)) S.daysSeen=[];
  if(!S.daysSeen.includes(today)) S.daysSeen.push(today);
  const rw = DAILY_TRIBUTE[S.daily.streak-1];
  const res={}; for(const k of RES) if(rw[k]) res[k]=rw[k];
  grantRes(res, true);
  if(rw.xp) addPlayerXP(rw.xp);
  if(rw.heroxp) gainHeroXP(rw.heroxp);
  save();
  return {day:S.daily.streak, desc:tributeDesc(rw)};
}
function dailyTributeModal(d, info){
  let dots='';
  for(let i=1;i<=7;i++) dots+='<span class="sdot'+(i<=d.day?' on':'')+'">'+i+'</span>';
  let html='<div class="winbanner" style="color:var(--gold);text-shadow:0 2px 0 #000">🎁 DAILY TRIBUTE 🎁</div>'+
    '<div class="flavor">The people of Troy lay gifts at your gate.'+(d.day>=7?' The gods themselves smile upon your reign!':'')+'</div>'+
    '<div class="streak">'+dots+'</div>'+
    '<table class="rep"><tr><th>Day '+d.day+' tribute</th><td>'+esc(d.desc)+'</td></tr></table>'+
    '<div class="small center">Return tomorrow to grow the streak — miss a day and it falls back to Day 1.</div>';

    html+='<hr class="bronze"><div class="small"><b>While you were away ('+fmtT(info.elapsed)+'):</b></div>'+
          '<ul class="small">'+info.events.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>';

}

function ensureRecords(){
  if(!S.records||typeof S.records!=='object') S.records={};
  const d={maxPower:0,bestDayWins:0,fastestSkaros:0,bestGather:0,bestStreak:0};
  for(const k of Object.keys(d)) if(typeof S.records[k]!=='number') S.records[k]=d[k];
  if(!S.records.winsToday||typeof S.records.winsToday!=='object') S.records.winsToday={day:'',n:0};
}
function recordBattleWin(){
  ensureRecords();
  const today=dayString(new Date()), wt=S.records.winsToday;
  if(wt.day!==today){ wt.day=today; wt.n=0; }
  wt.n++;
  if(wt.n>S.records.bestDayWins) S.records.bestDayWins=wt.n;
}

  const mix={balanced:[1/3,1/3,1/3],cavalry:[0.2,0.2,0.6],archers:[0.2,0.6,0.2],spearwall:[0.6,0.2,0.2]}[preset]||[1/3,1/3,1/3];

  bronze:{name:'Bronze', desc:'The classic bronze-age look of Troy.'},
  marble:{name:'Marble', desc:'White marble and gold. Earned with the Architect achievement.', need:'architect'},
  warred:{name:'War-Red', desc:'Dark red and black iron. Earned with the Skaros-Bane achievement.', need:'skarosbane'}

function skinUnlocked(id){ const sk=SKINS[id]; return !!(sk && (!sk.need || (S.achv&&S.achv[sk.need]))); }
function applySkin(){ document.body.dataset.skin=(S.skin&&SKINS[S.skin])?S.skin:'bronze'; }
function setSkin(id){

    const sk=SKINS[id], an=ACHIEVEMENTS.find(a=>a.id===sk.need);
    toast('🔒 '+sk.name+' skin is locked — earn the "'+(an?an.name:sk.need)+'" achievement.');
    return;
  }
  S.skin=id; applySkin(); save(); render();
  toast('City skin: <b>'+SKINS[id].name+'</b>');
}
function renderSkinPicker(){

      '<span class="small">'+(un?(active?'Worn':'Wear'):'🔒 '+(sk.need==='architect'?'Architect':'Skaros-Bane'))+'</span></button>';

/* ---------------- offline progress ---------------- */function applyOffline(){
  const elapsed = Math.min(Math.max(0,(nowMs()-S.lastSeen)/1000), 8*3600);
  const events=[];
  if(elapsed>=1){
    produce(elapsed);
    const hrs = (elapsed/3600);
    if(hrs>=0.05) events.push('+'+fmtN(prodRates().food*playerProdMult()*hrs)+' food, +'+fmtN(prodRates().wood*playerProdMult()*hrs)+' wood, +'+fmtN(prodRates().stone*playerProdMult()*hrs)+' stone, +'+fmtN(prodRates().gold*playerProdMult()*hrs)+' gold produced while away ('+fmtT(elapsed)+')');
  }
  // finish elapsed build
  if(S.build && nowMs()>=S.build.doneAt){
    const b=S.build; S.bld[b.key]=b.toLevel; S.build=null;
    addPlayerXP(XP_BUILD,true);
    events.push(BUILDINGS[b.key].name+' finished → Lv '+b.toLevel+' (+'+XP_BUILD+' XP)');
  }
  // finish elapsed training (sequential)
  let trained=0;
  while(S.tqueue.length>0){
    const b=S.tqueue[0];
    if(nowMs()<b.unitDoneAt) break;
    b.left--; b.unitDoneAt+=b.unitTime*1000;
    S.troops[b.type]=(S.troops[b.type]||0)+1; S.stats.trained++; trained++;
    addPlayerXP(XP_TRAIN,true);
    if(b.left<=0) S.tqueue.shift();
  }
  if(trained>0) events.push(trained+' troops finished training (+'+(trained*XP_TRAIN)+' XP)');
  // marches: resolve arrivals/gathers/returns silently, collect summaries
  let guard=0;
  while(guard++<20){
    let progressed=false;
    for(const m of S.marches){
      if(m.hero===true) m.hero='theron';   // normalize ancient saves
      const node=NODE_BY_ID[m.nodeId];
      if(m.phase==='out' && nowMs()>=m.arriveAt){
        if(node.kind==='gather'){ m.phase='gather'; m.gatherAt=m.arriveAt+GATHER_TIME*gatherTimeMult(m.hero)*1000; }
        else { resolveAttackMarch(m,true); events.push((m.result.won?'Victory':'Defeat')+' at '+node.name+' (+'+(m.result.won?XP_BATTLE_WIN:0)+' XP)'+(m.result.relic?' — relic found: '+RELICS[m.result.relic].name:'')+')'); }
        progressed=true;
      } else if(m.phase==='gather' && nowMs()>=m.gatherAt){
        const n=armyTotal(m.troops); m.cargo={}; m.cargo[node.res]=Math.round(n*GATHER_YIELD*gatherSiteMult(node));
        S.stats.gathers++; addPlayerXP(XP_GATHER,true);
        m.phase='back'; m.returnAt=m.gatherAt+m.marchSecs*1000; progressed=true;
      } else if(m.phase==='back' && nowMs()>=m.returnAt){
        const sv=m.survivors||m.troops;
        for(const t of TROOP_ORDER) S.troops[t]=(S.troops[t]||0)+Math.floor(sv[t]||0);
        if(m.cargo){ grantRes(m.cargo,true); events.push('Gatherers returned: +'+fmtN(m.cargo[node.res])+' '+RES_NAME[node.res]); }
        if(m.hero) S.hero.away=false;
        m.done=true; progressed=true;
      }
    }
    S.marches=S.marches.filter(m=>!m.done);
    if(!progressed) break;
  }
  // raids elapsed while away (silent, fixed factor)
  if(S.raidsOn){
    let n=0;
    while(nowMs()>=S.nextRaidAt && n<24){ tickRaid(true); n++; }
    if(n>0) events.push(n+' raid(s) struck Troy while you were away.');
  }
  // scouts that reported while away
  for(const id in S.nodes){
    const r=S.nodes[id];
    if(r && r.scoutDoneAt && !r.scouted && nowMs()>=r.scoutDoneAt){
      r.scouted=true; delete r.scoutDoneAt;
      const nd=NODE_BY_ID[id];
      const gstr=TROOP_ORDER.filter(t=>nd.garrison[t]>0).map(t=>nd.garrison[t]+' '+TROOPS[t].name).join(', ');
      events.push('Scouts reported from '+nd.name+': '+gstr+'.');
    }
  }
  checkQuests(); save();
  return {elapsed:elapsed, events:events};
}

/* ================= Isometric city view (pure visual layer; gameplay untouched) =================
   Drag to pan, pinch/wheel to zoom, tap a building to open its management panel.
   Original Bronze-Age art. Camera state persists across repaints. */
const CITYVIEW={repaint:null};
const ISOCAM={x:-40,y:34,z:0.95};
const ISO_PTR={map:new Map(),moved:false,pinchD:0};
const ISO_HIT=[];
let ISO_W=390, ISO_H=340, ISO_RAF=0;
let ISO_SEL=null, ISO_SIG='';
const ISO_BLD=[
  {key:'palace',  x:0, y:-2, w:3.4, d:2.8},
  {key:'barracks',x:-4, y:0,  w:2.6, d:2.0},
  {key:'farm',    x:4,  y:1,  w:3.0, d:2.4},
  {key:'quarry',  x:-4, y:4,  w:2.6, d:2.2},
  {key:'walls',   x:0,  y:3,  w:2.8, d:1.6},
  {key:'lumber',  x:3,  y:5,  w:2.6, d:2.0}
];
const ISO_ORDER=[...ISO_BLD].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
const ISO_BY_KEY={}; ISO_BLD.forEach(b=>{ISO_BY_KEY[b.key]=b;});

function isoP(x,y){
  const u=34*ISOCAM.z;
  return {x:ISO_W/2+ISOCAM.x+(x-y)*u, y:ISO_H/2+ISOCAM.y+(x+y)*u*0.46};
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,(n>>16)+amt)),
        g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),
        b=Math.max(0,Math.min(255,(n&255)+amt));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function isoPoly(c,pts,fill,stroke){
  c.beginPath();
  c.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y);
  c.closePath();
  c.fillStyle=fill; c.fill();
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=1; c.stroke(); }
}
function isoShadow(c,x,y,rx,ry){
  c.fillStyle='rgba(60,35,10,.18)';
  c.beginPath(); c.ellipse(x,y,rx,ry,0,0,7); c.fill();
}
/* Solid iso box. (cx,cy) = ground center in tile units; w/d in tiles; h/lift in px. */
function isoBox(c,cx,cy,w,d,h,ct,cl,cr,lift,noShadow){
  lift=lift||0;
  const a=isoP(cx-w/2,cy-d/2), b=isoP(cx+w/2,cy-d/2),
        f=isoP(cx+w/2,cy+d/2), l=isoP(cx-w/2,cy+d/2);
  const A={x:a.x,y:a.y-h-lift}, B={x:b.x,y:b.y-h-lift},
        F={x:f.x,y:f.y-h-lift}, L={x:l.x,y:l.y-h-lift};
  const lb={x:l.x,y:l.y-lift}, fb={x:f.x,y:f.y-lift}, bb={x:b.x,y:b.y-lift};
  if(!noShadow) isoShadow(c,f.x,f.y,(w+d)*9*ISOCAM.z+4,7*ISOCAM.z+2);
  isoPoly(c,[lb,fb,F,L],cl);
  isoPoly(c,[bb,fb,F,B],cr);
  isoPoly(c,[A,B,F,L],ct);
  return {A:A,B:B,F:F,L:L,a:a,b:b,f:f,l:l,h:h,lift:lift};
}
/* Pyramid roof over a box top (T = isoBox return). Returns apex screen y. */
function isoRoof(c,T,apexH,col){
  const cx=(T.A.x+T.F.x)/2, cy=(T.A.y+T.F.y)/2;
  const P={x:cx,y:cy-apexH};
  isoPoly(c,[T.A,T.L,P],shade(col,-6));
  isoPoly(c,[T.L,T.F,P],shade(col,-22));
  isoPoly(c,[T.F,T.B,P],shade(col,-38));
  isoPoly(c,[T.B,T.A,P],shade(col,12));
  return P.y;
}
function isoLabel(c,x,y,txt){
  c.textAlign='center';
  c.font='bold '+Math.max(10,Math.round(12*ISOCAM.z))+'px Georgia';
  c.fillStyle='#fff3cc'; c.shadowColor='#000'; c.shadowBlur=6;
  c.fillText(txt,x,y);
  c.shadowBlur=0;
}
function isoPennant(c,x,y,h,s,t,ph,col){
  c.strokeStyle='#4a3018'; c.lineWidth=Math.max(1.5,2*s);
  c.beginPath(); c.moveTo(x,y); c.lineTo(x,y-h); c.stroke();
  c.fillStyle='#c9a227';
  c.beginPath(); c.arc(x,y-h,2*s,0,7); c.fill();
  const w1=Math.sin(t*5+ph)*1.6*s;
  c.fillStyle=col||'#a82323';
  c.beginPath(); c.moveTo(x,y-h); c.lineTo(x+15*s,y-h+3*s+w1); c.lineTo(x,y-h+7*s); c.closePath(); c.fill();
}
function isoHit(key,b,topY){
  const c1=isoP(b.x-b.w/2-0.8,b.y-b.d/2-0.8), c2=isoP(b.x+b.w/2+0.8,b.y-b.d/2-0.8),
        c3=isoP(b.x+b.w/2+0.8,b.y+b.d/2+0.8), c4=isoP(b.x-b.w/2-0.8,b.y+b.d/2+0.8);
  const x0=Math.min(c1.x,c2.x,c3.x,c4.x), x1=Math.max(c1.x,c2.x,c3.x,c4.x);
  const y1=Math.max(c1.y,c2.y,c3.y,c4.y);
  ISO_HIT.push({key:key,x:x0,y:topY-6,w:x1-x0,h:y1-topY+12});
}
/* Empty construction plot for an unbuilt building. */
function isoPlot(c,b){
  const z=ISOCAM.z, p=isoP(b.x,b.y);
  isoShadow(c,p.x,p.y,(b.w+b.d)*9*z,7*z);
  c.strokeStyle='#7a5a2a'; c.lineWidth=2; c.setLineDash([5,4]);
  c.beginPath(); c.ellipse(p.x,p.y,(b.w+b.d)*8*z,(b.w+b.d)*3.6*z,0,0,7); c.stroke();
  c.setLineDash([]);
  c.strokeStyle='#5a3a1a'; c.lineWidth=2.5*z;
  const ox=[-1,-1,1,1], oy=[-1,1,-1,1];
  for(let i=0;i<4;i++){
    const q=isoP(b.x+ox[i]*b.w/2.4,b.y+oy[i]*b.d/2.4);
    c.beginPath(); c.moveTo(q.x,q.y); c.lineTo(q.x,q.y-11*z); c.stroke();
  }
  c.fillStyle='#6b4a26'; c.fillRect(p.x-1.5*z,p.y-16*z,3*z,10*z);
  c.fillStyle='#a8763e'; c.fillRect(p.x-9*z,p.y-24*z,18*z,9*z);
  c.strokeStyle='#5a3a1a'; c.lineWidth=1; c.strokeRect(p.x-9*z,p.y-24*z,18*z,9*z);
  isoLabel(c,p.x,p.y-30*z,BUILDINGS[b.key].name);
  isoHit(b.key,b,p.y-38*z);
}
function isoTree(c,x,y,s){
  const p=isoP(x,y);
  if(p.x<-40||p.x>ISO_W+40||p.y<-70||p.y>ISO_H+40) return;
  isoShadow(c,p.x,p.y,9*s,4*s);
  c.fillStyle='#6b4a26'; c.fillRect(p.x-1.5*s,p.y-9*s,3*s,9*s);
  c.fillStyle='#5f7f52';
  c.beginPath(); c.arc(p.x,p.y-12*s,7*s,0,7); c.fill();
  c.fillStyle='#6f915f';
  c.beginPath(); c.arc(p.x-3*s,p.y-14*s,4.5*s,0,7); c.fill();
  c.fillStyle='rgba(220,235,200,.30)';
  c.beginPath(); c.arc(p.x-2*s,p.y-15*s,2.5*s,0,7); c.fill();
}
function isoPalace(c,b,lvl,t){
  const z=ISOCAM.z;
  isoBox(c,b.x,b.y,b.w+0.7,b.d+0.7,7*z,'#c9b68c',shade('#c9b68c',-26),shade('#c9b68c',-42));
  const colH=(30+lvl*7)*z, n=3+lvl;
  const T=isoBox(c,b.x,b.y,b.w,b.d,colH,'#e8dcc0','#c4ad82','#a8915f',7*z,true);
  /* colonnade on both front faces: dark recess, then pale columns */
  const cw2=4.2*z;
  for(let e=0;e<2;e++){
    const P=e?T.B:T.L, Q=T.F;
    isoPoly(c,[{x:P.x,y:P.y},{x:Q.x,y:Q.y},{x:Q.x,y:Q.y+colH},{x:P.x,y:P.y+colH}],'rgba(74,52,28,.38)');
    for(let i=0;i<n;i++){
      const tt=0.10+0.80*(n===1?0.5:i/(n-1));
      const gx=P.x+(Q.x-P.x)*tt, gy=P.y+(Q.y-P.y)*tt;
      c.fillStyle='#f4ead4';
      c.fillRect(gx-cw2/2,gy,cw2,colH);
      c.fillStyle='rgba(120,100,70,.30)';
      c.fillRect(gx-cw2/2,gy,cw2,1.4*z);
      c.fillRect(gx-cw2/2,gy+colH-1.6*z,cw2,1.6*z);
    }
  }
  /* doorway on the L-F face, over the colonnade */
  {
    const mx=(T.L.x+T.F.x)/2, my=(T.L.y+T.F.y)/2;
    const dw=11*z, dh=Math.min(colH*0.62,26*z);
    c.fillStyle='rgba(50,28,12,.92)';
    c.fillRect(mx-dw/2,my+colH-dh,dw,dh);
    c.fillStyle='rgba(255,200,120,.35)';
    c.fillRect(mx-dw/2,my+colH-dh,dw,2.5*z);
  }
  const E=isoBox(c,b.x,b.y,b.w+0.25,b.d+0.25,6*z,'#d9cba6',shade('#d9cba6',-26),shade('#d9cba6',-42),7*z+colH,true);  const roofCol=lvl>=4?'#c9973f':'#b4552d';
  const apexY=isoRoof(c,E,(24+lvl*4)*z,roofCol);
  const fx=(E.A.x+E.F.x)/2;
  c.fillStyle='#8c5a2b';
  c.beginPath(); c.arc(fx,apexY-2*z,2.6*z,0,7); c.fill();
  let topY=apexY-6*z;
  if(lvl>=3){
    const p1=isoP(b.x-b.w/2-0.9,b.y+b.d/2+0.4), p2=isoP(b.x+b.w/2+0.9,b.y+b.d/2+0.4);
    isoPennant(c,p1.x,p1.y,26*z,z,t,0.6);
    isoPennant(c,p2.x,p2.y,26*z,z,t,2.4);
    topY=Math.min(topY,p1.y-30*z);
  }
  isoLabel(c,(T.A.x+T.F.x)/2,topY-8*z,BUILDINGS.palace.name+(lvl>0?' · Lv '+lvl:''));
  isoHit('palace',b,topY-22*z);
}
function isoBarracks(c,b,lvl,t){
  const z=ISOCAM.z;
  const hgt=(24+lvl*5)*z;
  const T=isoBox(c,b.x,b.y,b.w,b.d,hgt,'#c98f4e','#a06a38','#87572c');
  const P=isoBox(c,b.x,b.y,b.w-0.5,b.d-0.5,5*z,'#8a5a2e',shade('#8a5a2e',-20),shade('#8a5a2e',-34),hgt,true);
  c.fillStyle='#a06a38';
  const faces=[[P.L,P.F],[P.F,P.B]];
  for(const fv of faces){
    const U=fv[0], V=fv[1];
    for(let i=0;i<=6;i++){
      const tt=i/6;
      c.fillRect(U.x+(V.x-U.x)*tt-2*z,U.y+(V.y-U.y)*tt-4*z,4*z,4*z);
    }
  }
  /* spear rack + shield against the front face */
  {
    const mx=(T.L.x+T.F.x)/2, my=(T.L.y+T.F.y)/2+hgt;
    c.strokeStyle='#5a3a1a'; c.lineWidth=2*z;
    for(let i=-1;i<=1;i++){
      const sx=mx+i*7*z;
      c.beginPath(); c.moveTo(sx,my); c.lineTo(sx+3*z,my-20*z); c.stroke();
      c.fillStyle='#c9c9c9';
      c.beginPath(); c.moveTo(sx+3*z,my-20*z); c.lineTo(sx+1*z,my-16*z); c.lineTo(sx+5*z,my-16*z); c.closePath(); c.fill();
    }
    c.fillStyle='#a82323';
    c.beginPath(); c.arc(mx+16*z,my-6*z,6*z,0,7); c.fill();
    c.fillStyle='#c9a227';
    c.beginPath(); c.arc(mx+16*z,my-6*z,2*z,0,7); c.fill();
  }
  let topY=P.A.y-8*z;
  if(lvl>=3){
    const q=isoP(b.x+b.w/2+0.7,b.y-b.d/2-0.2);
    c.fillStyle='#d9cba6';
    c.beginPath(); c.moveTo(q.x-12*z,q.y); c.lineTo(q.x,q.y-16*z); c.lineTo(q.x+12*z,q.y); c.closePath(); c.fill();
    c.fillStyle='#b4552d';
    c.beginPath(); c.moveTo(q.x-12*z,q.y); c.lineTo(q.x,q.y-16*z); c.lineTo(q.x-2*z,q.y); c.closePath(); c.fill();
    topY=Math.min(topY,q.y-20*z);
  }
  isoLabel(c,(T.A.x+T.F.x)/2,topY,BUILDINGS.barracks.name+(lvl>0?' · Lv '+lvl:''));
  isoHit('barracks',b,topY-14*z);
}
function isoFarm(c,b,lvl,t){
  const z=ISOCAM.z;
  const p0=isoP(b.x,b.y);
  isoShadow(c,p0.x,p0.y,(b.w+b.d)*9*z,7*z);
  const nf=Math.min(1+lvl,4);
  for(let i=0;i<nf;i++){
    const fx=b.x-1.15+i*0.78, fy=b.y+0.55;
    isoPoly(c,[isoP(fx-0.34,fy),isoP(fx,fy-0.34),isoP(fx+0.34,fy),isoP(fx,fy+0.34)],'#8a5a2e');
    if(lvl>=2){
      c.fillStyle='#6f915f';
      for(let r2=0;r2<3;r2++) for(let k=0;k<3;k++){
        const s2=isoP(fx-0.18+k*0.18,fy-0.14+r2*0.14);
        c.beginPath(); c.arc(s2.x,s2.y-2*z,1.8*z,0,7); c.fill();
      }
    }
  }
  const H=isoBox(c,b.x+0.9,b.y-0.9,1.1,0.9,14*z,'#e8dcc0','#c4ad82','#a8915f');
  isoRoof(c,H,10*z,'#b4552d');
  const topY=H.A.y-16*z;
  isoLabel(c,(H.A.x+H.F.x)/2,topY,BUILDINGS.farm.name+(lvl>0?' · Lv '+lvl:''));
  isoHit('farm',b,topY-14*z);
}
function isoQuarry(c,b,lvl,t){
  const z=ISOCAM.z;
  const p0=isoP(b.x,b.y);
  isoShadow(c,p0.x,p0.y,(b.w+b.d)*9*z,7*z);
  isoPoly(c,[isoP(b.x-0.9,b.y),isoP(b.x,b.y-0.9),isoP(b.x+0.9,b.y),isoP(b.x,b.y+0.9)],'#4a3a28');
  isoPoly(c,[isoP(b.x-0.65,b.y),isoP(b.x,b.y-0.65),isoP(b.x+0.65,b.y),isoP(b.x,b.y+0.65)],'#5e4a34');
  const nb=1+lvl;
  for(let i=0;i<nb;i++){
    const bx=b.x-0.9+(i%3)*0.75, by=b.y+0.75+Math.floor(i/3)*0.6;
    isoBox(c,bx,by,0.55,0.55,7*z,'#d8cdb2',shade('#d8cdb2',-24),shade('#d8cdb2',-40));
  }
  let topY=p0.y-14*z;
  if(lvl>=3){
    const q=isoP(b.x+1.0,b.y-0.8);
    c.strokeStyle='#5a3a1a'; c.lineWidth=2.5*z;
    c.beginPath(); c.moveTo(q.x-8*z,q.y); c.lineTo(q.x,q.y-26*z); c.stroke();
    c.beginPath(); c.moveTo(q.x+8*z,q.y); c.lineTo(q.x,q.y-26*z); c.stroke();
    c.beginPath(); c.moveTo(q.x,q.y-26*z); c.lineTo(q.x+14*z,q.y-20*z); c.stroke();
    c.strokeStyle='#3a2a18'; c.lineWidth=1.2*z;
    c.beginPath(); c.moveTo(q.x+14*z,q.y-20*z); c.lineTo(q.x+14*z,q.y-8*z); c.stroke();
    c.fillStyle='#d8cdb2'; c.fillRect(q.x+11*z,q.y-8*z,6*z,6*z);
    topY=q.y-30*z;
  }
  isoLabel(c,p0.x,topY,BUILDINGS.quarry.name+(lvl>0?' · Lv '+lvl:''));
  isoHit('quarry',b,topY-14*z);
}
function isoLumber(c,b,lvl,t){
  const z=ISOCAM.z;
  const np=1+lvl;
  let topY=1e9;
  for(let i=0;i<np;i++){
    const lx=b.x-0.9+(i%2)*1.1, ly=b.y+0.5-Math.floor(i/2)*0.55;
    const L=isoBox(c,lx,ly,0.9,0.5,6*z,'#7a5230',shade('#7a5230',-22),shade('#7a5230',-36));
    for(let k=0;k<3;k++){
      const tt=0.25+0.25*k;
      const gx=L.l.x+(L.f.x-L.l.x)*tt, gy=L.l.y+(L.f.y-L.l.y)*tt+3*z;
      c.fillStyle='#c9a06a';
      c.beginPath(); c.arc(gx,gy,2.6*z,0,7); c.fill();
      c.fillStyle='#8a5a2e';
      c.beginPath(); c.arc(gx,gy,1.1*z,0,7); c.fill();
    }
    topY=Math.min(topY,L.A.y);
  }
  const S2=isoBox(c,b.x+0.7,b.y-0.9,1.0,0.8,12*z,'#b08048',shade('#b08048',-24),shade('#b08048',-38));
  isoRoof(c,S2,8*z,'#8a4a24');
  topY=Math.min(topY,S2.A.y-12*z);
  const p0=isoP(b.x,b.y);
  isoLabel(c,p0.x,topY,BUILDINGS.lumber.name+(lvl>0?' · Lv '+lvl:''));

}
function isoWalls(c,b,lvl,t){
  const z=ISOCAM.z;
  const gh=(14+lvl*4)*z;
  const WL=isoBox(c,b.x,b.y,2.0,0.5,gh,'#d9cba6',shade('#d9cba6',-26),shade('#d9cba6',-42));
  /* gate arch on the front face */
  {
    const mx=(WL.L.x+WL.F.x)/2, my=(WL.L.y+WL.F.y)/2;
    const dw=12*z, dh=gh*0.8;
    c.fillStyle='rgba(50,28,12,.92)';
    c.fillRect(mx-dw/2,my+gh-dh,dw,dh);
    c.beginPath(); c.arc(mx,my+gh-dh,dw/2,Math.PI,0); c.fill();
  }
  let topY=WL.A.y;
  for(const sx of [-1.25,1.25]){
    const T=isoBox(c,b.x+sx,b.y,0.62,0.62,(26+lvl*8)*z,'#e2d4b2',shade('#e2d4b2',-26),shade('#e2d4b2',-42));
    c.fillStyle=shade('#e2d4b2',-26);
    const faces=[[T.L,T.F],[T.F,T.B]];
    for(const fv of faces){
      const U=fv[0], V=fv[1];
      for(let i=0;i<=3;i++){
        const tt=i/3;
        c.fillRect(U.x+(V.x-U.x)*tt-1.6*z,U.y+(V.y-U.y)*tt-3.4*z,3.2*z,3.4*z);
      }
    }
    topY=Math.min(topY,T.A.y-6*z);
    if(lvl>=3) isoPennant(c,T.F.x,T.F.y,20*z,z,t,sx>0?1.2:3.0);
  }
  isoLabel(c,isoP(b.x,b.y).x,topY-4*z,BUILDINGS.walls.name+(lvl>0?' · Lv '+lvl:''));
  isoHit('walls',b,topY-18*z);
}
const ISO_PAINT={palace:isoPalace,barracks:isoBarracks,farm:isoFarm,quarry:isoQuarry,lumber:isoLumber,walls:isoWalls};

function drawCityView(){
  const cv=$('#cityview'); if(!cv||typeof S==='undefined'||!S) return;
  const dpr=window.devicePixelRatio||1;
  const cw=cv.clientWidth||390, ch=cv.clientHeight||340;
  ISO_W=cw; ISO_H=ch;
  const bw=Math.max(1,Math.round(cw*dpr)), bh=Math.max(1,Math.round(ch*dpr));
  if(cv.width!==bw||cv.height!==bh){ cv.width=bw; cv.height=bh; }
  const c=cv.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  const t=Date.now()/1000;
  const lvl=k=>(S.bld&&S.bld[k])||0;
  ISO_HIT.length=0;
  /* warm Aegean sky */
  let g=c.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#ffedc2'); g.addColorStop(0.55,'#f6d9a2'); g.addColorStop(1,'#e7c184');
  c.fillStyle=g; c.fillRect(0,0,cw,ch);
  const sg=c.createRadialGradient(cw*0.82,ch*0.12,4,cw*0.82,ch*0.12,90);
  sg.addColorStop(0,'rgba(255,250,220,.9)'); sg.addColorStop(1,'rgba(255,240,200,0)');
  c.fillStyle=sg; c.fillRect(0,0,cw,ch);
  /* ground tiles */
  const R=13;
  const greens=['#5d7f4b','#638551','#678a55','#5a7a48','#6a8d58'];
  for(let x=-R;x<=R;x++) for(let y=-R;y<=R;y++){
    const p0=isoP(x,y);
    if(p0.x<-90||p0.x>cw+90||p0.y<-70||p0.y>ch+70) continue;
    const path=(Math.abs(x)<1||Math.abs(y)<1||(x+y===6));
    const vi=((x*17+y*31+400)%5+5)%5;
    c.fillStyle=path?'#c7a76f':greens[vi];
    const p1=isoP(x+1,y), p2=isoP(x+1,y+1), p3=isoP(x,y+1);
    c.beginPath();
    c.moveTo(p0.x,p0.y); c.lineTo(p1.x,p1.y); c.lineTo(p2.x,p2.y); c.lineTo(p3.x,p3.y);
    c.closePath(); c.fill();
  }
  /* olive groves beyond the building plots */
  for(let i=0;i<42;i++){
    const x=Math.sin(i*47.3)*12.5, y=Math.cos(i*29.7)*11.5;
    if(Math.abs(x)<7&&Math.abs(y)<8) continue;
    isoTree(c,x,y,(0.8+(i%4)*0.15)*ISOCAM.z);
  }
  /* buildings, back to front */
  for(const b of ISO_ORDER){
    const L=lvl(b.key);
    if(L<=0){ isoPlot(c,b); continue; }
    ISO_PAINT[b.key](c,b,L,t);
  }
  /* war banners flanking the palace approach */
  if(lvl('palace')>0){
    const pb=ISO_BY_KEY.palace, z=ISOCAM.z;
    const q1=isoP(pb.x-2.9,pb.y+2.6), q2=isoP(pb.x+2.9,pb.y+2.6);
    isoPennant(c,q1.x,q1.y,26*z,z,t,0.6);
    isoPennant(c,q2.x,q2.y,26*z,z,t,2.4);
  }
  /* ---- city life: walkers on the roads ---- */
  for(let i=0;i<6;i++){
    const wp=(t*0.11+i/6)%1, horiz=i%2===0;
    const wx=horiz?-10+wp*20:(i%4<2?-0.55:0.55);
    const wy=horiz?(i%4<2?-0.55:0.55):-9+wp*18;
    const p=isoP(wx,wy), s=ISOCAM.z;
    if(p.x<-20||p.x>cw+20||p.y<-20||p.y>ch+20) continue;
    const bob2=Math.abs(Math.sin(wp*40+i))*1.4*s;
    c.fillStyle='rgba(60,35,10,.18)'; c.beginPath(); c.ellipse(p.x,p.y,3*s,1.4*s,0,0,7); c.fill();
    c.fillStyle=['#7a5a3a','#5a4a6a','#6a3a2a','#4a5a3a'][i%4];
    c.beginPath(); c.moveTo(p.x-2.4*s,p.y); c.lineTo(p.x,p.y-7*s-bob2); c.lineTo(p.x+2.4*s,p.y); c.closePath(); c.fill();
    c.fillStyle='#e8c896'; c.beginPath(); c.arc(p.x,p.y-8.4*s-bob2,1.7*s,0,7); c.fill();
  }
  /* braziers flanking the palace approach: fire glow, rising smoke */
  if(lvl('palace')>0){
    const pb=ISO_BY_KEY.palace, z=ISOCAM.z;
    for(const sx of [-1,1]){
      const bp=isoP(pb.x+sx*3.4,pb.y+3.2);
      c.fillStyle='#4a3018'; c.fillRect(bp.x-1.5*z,bp.y-8*z,3*z,8*z);
      c.fillStyle='#6b4a26'; c.beginPath(); c.ellipse(bp.x,bp.y-9*z,6*z,3*z,0,0,7); c.fill();
      const fl=0.7+0.3*Math.sin(t*11+sx*2);
      c.save(); c.globalCompositeOperation='lighter';
      const fg=c.createRadialGradient(bp.x,bp.y-12*z,1,bp.x,bp.y-12*z,14*z*fl);
      fg.addColorStop(0,'rgba(255,190,90,.85)'); fg.addColorStop(1,'rgba(255,120,40,0)');
      c.fillStyle=fg; c.beginPath(); c.arc(bp.x,bp.y-12*z,14*z*fl,0,7); c.fill();
      c.restore();
      for(let k=0;k<3;k++){
        const sp=((t*0.35+k/3)%1);
        c.fillStyle='rgba(120,110,100,'+(0.28*(1-sp))+')';
        c.beginPath(); c.arc(bp.x+Math.sin(t*2+k*2)*4*z*sp, bp.y-(14+sp*30)*z, (2.5+sp*4)*z,0,7); c.fill();
      }
    }
  }
  /* drifting glow motes (additive light, no dynamic shadows) */
  c.save(); c.globalCompositeOperation='lighter';
  for(let i=0;i<10;i++){
    const mx=(Math.sin(t*0.4+i*2.4)*0.5+0.5)*cw, my=(Math.cos(t*0.3+i*1.7)*0.5+0.5)*ch;
    const tw=0.25+0.2*Math.sin(t*3+i*1.3);
    c.fillStyle='rgba(255,220,140,'+Math.max(0,tw)+')';
    c.beginPath(); c.arc(mx,my,1.6,0,7); c.fill();
  }
  c.restore();
  /* waving pennants on barracks and walls */
  for(const k of ['barracks','walls']){
    if(lvl(k)>0){
      const b=ISO_BY_KEY[k], z=ISOCAM.z, pp=isoP(b.x-b.w/2+0.4,b.y-b.d/2+0.4);
      isoPennant(c,pp.x,pp.y-14*z,20*z,z,t,k==='barracks'?1.1:2.9);
    }
  }
  /* construction: full art stays, progress bar + hammer + countdown beneath */
  if(S.build&&ISO_BY_KEY[S.build.key]){
    const b=ISO_BY_KEY[S.build.key], z=ISOCAM.z;
    const fp=isoP(b.x,b.y+b.d/2+1.1);
    const left=Math.max(0,(S.build.doneAt-Date.now())/1000), total=S.build.dur||1;
    const pct=Math.min(100,Math.max(0,100*(1-left/total)));
    // hammer icon
    c.save(); c.translate(fp.x-52*z,fp.y-8*z); c.rotate(-0.5+Math.sin(t*6)*0.12);
    c.fillStyle='#6b4a26'; c.fillRect(-1.5,-2,3,16);
    c.fillStyle='#8a8f96'; c.fillRect(-7,-8,14,7);
    c.restore();
    const bw2=104*z, bx2=fp.x-bw2/2+8*z;
    c.fillStyle='rgba(20,12,6,.8)'; c.fillRect(bx2-3,fp.y-13*z,bw2+6,16*z);
    c.fillStyle='#cbbd97'; c.fillRect(bx2,fp.y-10*z,bw2,10*z);
    const pg=c.createLinearGradient(bx2,0,bx2+bw2,0);
    pg.addColorStop(0,'#b08d57'); pg.addColorStop(1,'#e8c86a');
    c.fillStyle=pg; c.fillRect(bx2,fp.y-10*z,bw2*pct/100,10*z);
    c.fillStyle='#fff3cc'; c.font='bold '+Math.max(10,Math.round(11*z))+'px Arial'; c.textAlign='center';
    c.fillText('Lv '+S.build.toLevel+' · '+fmtT(left),fp.x+8*z,fp.y+16*z);
  }
  /* vignette */
  const vg=c.createRadialGradient(cw/2,ch/2,ch*0.32,cw/2,ch/2,ch*0.85);
  vg.addColorStop(0,'rgba(60,30,10,0)'); vg.addColorStop(1,'rgba(60,30,10,.18)');
  c.fillStyle=vg; c.fillRect(0,0,cw,ch);
}

/* ---------- interaction: drag pan, pinch/wheel zoom, tap building ---------- */
function isoDrawSoon(){
  if(ISO_RAF) return;
  ISO_RAF=requestAnimationFrame(()=>{ ISO_RAF=0; drawCityView(); });
}
function isoPointerInit(cv){
  cv.addEventListener('pointerdown',e=>{
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    ISO_PTR.map.set(e.pointerId,{x:e.clientX,y:e.clientY});
    ISO_PTR.moved=false;
    if(ISO_PTR.map.size===2){
      const p=[...ISO_PTR.map.values()];
      ISO_PTR.pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1;
    }
  });
  cv.addEventListener('pointermove',e=>{
    const pt=ISO_PTR.map.get(e.pointerId); if(!pt) return;
    const dx=e.clientX-pt.x, dy=e.clientY-pt.y;
    pt.x=e.clientX; pt.y=e.clientY;
    if(Math.abs(dx)+Math.abs(dy)>2) ISO_PTR.moved=true;
    if(ISO_PTR.map.size===2){
      const p=[...ISO_PTR.map.values()];
      const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1;
      if(ISO_PTR.pinchD>0) ISOCAM.z=Math.max(0.55,Math.min(2.4,ISOCAM.z*d/ISO_PTR.pinchD));
      ISO_PTR.pinchD=d;
      ISOCAM.x+=dx/2; ISOCAM.y+=dy/2;
    }else{
      ISOCAM.x+=dx; ISOCAM.y+=dy;
    }
    isoDrawSoon();
  });
  const up=e=>{
    const wasTap=!ISO_PTR.moved&&ISO_PTR.map.size===1;
    ISO_PTR.map.delete(e.pointerId);
    if(ISO_PTR.map.size<2) ISO_PTR.pinchD=0;
    if(wasTap) isoTap(e);
    if(ISO_PTR.map.size===0) ISO_PTR.moved=false;
  };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    ISOCAM.z=Math.max(0.55,Math.min(2.4,ISOCAM.z*(e.deltaY>0?0.9:1.1)));
    isoDrawSoon();
  },{passive:false});
}
function isoTap(e){
  const cv=$('#cityview'); if(!cv) return;
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  for(let i=ISO_HIT.length-1;i>=0;i--){
    const z=ISO_HIT[i];
    if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h){ openIsoPanel(z.key); return; }
  }
  closeIsoPanel();
}

/* ---------- building management panel ---------- */
function openIsoPanel(key){
  ISO_SEL=key; ISO_SIG='';
  const ip=$('#iso-panel'); if(!ip) return;
  ip.innerHTML=isoPanelHTML(key);
  ip.style.display='block';
  const lvl=(S.bld&&S.bld[key])||0;
  if(lvl>0&&lvl<5&&!(S.build&&S.build.key===key)) drawIsoPreview(key,lvl+1);
}
function closeIsoPanel(){
  ISO_SEL=null;
  const ip=$('#iso-panel'); if(ip) ip.style.display='none';
}
function refreshIsoPanel(){
  const ip=$('#iso-panel'); if(!ip) return;
  if(ISO_SEL){
    ISO_SIG=''; ip.innerHTML=isoPanelHTML(ISO_SEL); ip.style.display='block';
    const lvl=(S.bld&&S.bld[ISO_SEL])||0;
    if(lvl>0&&lvl<5&&!(S.build&&S.build.key===ISO_SEL)) drawIsoPreview(ISO_SEL,lvl+1);
  }
  else ip.style.display='none';
}
function isoBuildSig(){
  return (S.build?S.build.key+':'+S.build.toLevel:'-')+'|'+BUILD_ORDER.map(k=>(S.bld&&S.bld[k])||0).join(',');
}
function tickIsoPanel(){
  if(!ISO_SEL) return;
  const ip=$('#iso-panel'); if(!ip||ip.style.display!=='block') return;
  const sig=isoBuildSig();
  if(sig!==ISO_SIG){ ISO_SIG=sig; ip.innerHTML=isoPanelHTML(ISO_SEL); return; }
  const b=S.build;
  if(b&&b.key===ISO_SEL){
    const left=Math.max(0,(b.doneAt-nowMs())/1000), total=b.dur||1;
    const el=document.getElementById('iso-buildprog');
    if(el) el.style.width=Math.min(100,Math.max(0,100*(1-left/total)))+'%';
    const tx=document.getElementById('iso-buildtxt');
    if(tx) tx.textContent='Building → Lv '+b.toLevel+' — '+fmtT(left);
  }
  // animate the upgrade preview ring cheaply (2 fps) while the panel is open
  if(document.getElementById('iso-preview')){
    const lvl=(S.bld&&S.bld[ISO_SEL])||0;
    if(lvl>0&&lvl<5&&!(b&&b.key===ISO_SEL)) drawIsoPreview(ISO_SEL,lvl+1);
  }
}
/* Next-level upgrade preview: re-renders the building's real iso art at the new level
   into a small canvas, auto-fitted, with a rotating gold ring. Stashes and restores
   the city render globals so the main view is untouched. */
let ISO_PV_DOC=null;
function drawIsoPreview(key,toLevel){
  const cv=$('#iso-preview'); if(!cv) return;
  const W=cv.width, H=cv.height;
  if(!ISO_PV_DOC) ISO_PV_DOC=document.createElement('canvas');
  ISO_PV_DOC.width=W; ISO_PV_DOC.height=H;
  const t=performance.now()/1000;
  const oW=ISO_W, oH=ISO_H, oCam={x:ISOCAM.x,y:ISOCAM.y,z:ISOCAM.z}, oHit=ISO_HIT.length;
  function pvRender(z,offY,target){
    ISO_W=W; ISO_H=H; ISOCAM.x=0; ISOCAM.y=offY; ISOCAM.z=z;
    const c=target.getContext('2d');
    c.clearRect(0,0,W,H);
    const g=c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2e2314'); g.addColorStop(1,'#1a1208');
    c.fillStyle=g; c.fillRect(0,0,W,H);
    ISO_HIT.length=0;
    ISO_PAINT[key](c,{x:0,y:0,w:ISO_BY_KEY[key].w,d:ISO_BY_KEY[key].d},toLevel,t);
    const r=ISO_HIT[ISO_HIT.length-1];
    ISO_HIT.length=oHit;
    return r;
  }
  const r1=pvRender(0.4,-8,ISO_PV_DOC);
  let z2=0.4, offY2=-8;
  if(r1&&r1.w>1&&r1.h>1){
    const fit=Math.max(0.2,Math.min(132/r1.w,92/r1.h,1.5));
    z2=0.4*fit;
    const cx1=r1.x+r1.w/2, cy1=r1.y+r1.h/2;
    offY2=2-(cy1-H/2-(-8))*fit;
  }
  const r2=pvRender(z2,offY2,cv);
  // rotating dashed gold ring + sparkles around the finished render
  if(r2&&r2.w>1){
    const c=cv.getContext('2d');
    const cx=r2.x+r2.w/2, cy=r2.y+r2.h/2;
    c.save();
    c.setLineDash([7,6]); c.lineDashOffset=-t*26;
    c.strokeStyle='#e8c86a'; c.lineWidth=2;
    c.beginPath(); c.ellipse(cx,cy,r2.w/2+10,Math.max(10,r2.h*0.24),0,0,7); c.stroke();
    c.restore();
    c.save(); c.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){
      const a=t*1.2+i*Math.PI/3;
      const sx=cx+Math.cos(a)*(r2.w/2+10), sy=cy+Math.sin(a)*Math.max(10,r2.h*0.24);
      c.fillStyle='rgba(255,225,140,'+(0.5+0.4*Math.sin(t*4+i))+')';
      c.beginPath(); c.arc(sx,sy,1.8,0,7); c.fill();
    }
    c.restore();
  }
  ISO_W=oW; ISO_H=oH; ISOCAM.x=oCam.x; ISOCAM.y=oCam.y; ISOCAM.z=oCam.z;
}
