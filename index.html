/* ---- animated battle scene: floating combat text + layered skill VFX ----
   Technique from the RoK study, original Bronze Age art: two war-bands clash on a
   canvas field; every round spawns big bold outlined numerals (red = damage dealt,
   pale = damage taken, green = warded/blocked); decisive rounds fire layered skill
   VFX — ground decal + mid-air element + particles + gold numbers. Strict color
   code: crimson = danger, bronze/olive = friendly, radiant gold = hero moments. */
const WB={floaters:[],parts:[],rings:[],appar:null,raf:0,clashT:0};
function wrSceneReset(){ WB.floaters.length=0; WB.parts.length=0; WB.rings.length=0; WB.appar=null; WB.clashT=0; }
function wrFloater(x,y,txt,color,size){
  WB.floaters.push({x:x+(Math.random()*16-8),y:y,txt:txt,color:color,size:size||15,t0:performance.now()});
  if(WB.floaters.length>24) WB.floaters.shift();
}
function wrBurst(x,y,color,n){
  for(let i=0;i<(n||10);i++){
    const a=Math.random()*Math.PI*2, sp=30+Math.random()*80;
    WB.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50,color:color,t0:performance.now(),life:500+Math.random()*500});
  }
  if(WB.parts.length>160) WB.parts.splice(0,WB.parts.length-160);
}
function wrRing(x,y,r,g,b,maxR){ WB.rings.push({x:x,y:y,r:r,g:g,b:b,t0:performance.now(),maxR:maxR||60}); }
function drawMiniBand(c,x,y,flip,scheme,now){
  const P=scheme==='our'
    ? {tunic:'#b08d4f',shield:'#7a1f1f',crest:'#a32e2e',skin:'#e8c896'}
    : {tunic:'#5a3a4a',shield:'#33232a',crest:'#1d1d24',skin:'#c8a878'};
  c.save(); c.translate(x,y); if(flip) c.scale(-1,1);
  c.fillStyle='rgba(0,0,0,0.25)'; c.beginPath(); c.ellipse(0,3,17,5,0,0,7); c.fill();
  const bob=Math.sin(now/170)*1.2;
  const men=[[-9,-3],[-9,5],[-1,-6],[-1,6],[7,0]];
  for(let i=0;i<men.length;i++){
    const mx=men[i][0], my=men[i][1]+((i%2)?bob:-bob)*0.5;
    c.fillStyle=P.tunic; c.beginPath(); c.arc(mx,my,3.4,0,7); c.fill();
    c.fillStyle=P.skin; c.beginPath(); c.arc(mx,my-4.6,2.4,0,7); c.fill();
    c.fillStyle=P.crest; c.fillRect(mx-1,my-9.6,2,3.6);
    c.strokeStyle='#8a6a3a'; c.lineWidth=1.4;
    c.beginPath(); c.moveTo(mx+2,my-8); c.lineTo(mx+7,my+3); c.stroke();
    c.fillStyle=P.shield; c.beginPath(); c.arc(mx-3.4,my+1,2.6,0,7); c.fill();
  }
  c.strokeStyle='#5e3a1a'; c.lineWidth=2;
  c.beginPath(); c.moveTo(-13,2); c.lineTo(-13,-20); c.stroke();
  const wv=Math.sin(now/260)*2;
  c.fillStyle=scheme==='our'?'#7a1f1f':'#2a2a3a';
  c.beginPath(); c.moveTo(-13,-20); c.lineTo(-4,-18+wv); c.lineTo(-13,-15); c.closePath(); c.fill();
  c.restore();
}
function wrSkillFX(side){
  // layered skill VFX: ground decal + burst + numbers (apparition added for hero moments)
  if(side==='a'){
    wrRing(118,140,176,141,87,58);   // bronze ground decal (friendly)
    wrRing(118,140,128,138,85,44);   // olive second ring
    wrBurst(150,92,'#e8c86a',14);
    if(WATCH.pack&&WATCH.pack.res&&WATCH.pack.res.heroName) WB.appar={t0:performance.now()};
  } else {
    wrRing(242,140,200,40,40,64);    // crimson ground decal (danger)
    wrBurst(210,92,'#d9534f',14);
  }
}
function wrSpawnRound(prev,cur){
  const dealt=Math.max(0,Math.round(prev.hpD-cur.hpD));
  const taken=Math.max(0,Math.round(prev.hpA-cur.hpA));
  if(dealt>0) wrFloater(252,72,'-'+fmtN(dealt),'#d63d2f',16);   // red: damage dealt
  if(taken>0){
    wrFloater(108,72,'-'+fmtN(taken),'#e8e0cc',14);              // pale: damage taken
    const dr=(WATCH.pack&&WATCH.pack.res&&WATCH.pack.res.dmgRed)||1;
    if(dr<1) wrFloater(108,52,'+'+fmtN(Math.round(taken*(1/dr-1)))+' warded','#7fd47f',12); // green: blocked
  }
  WB.clashT=performance.now();
  wrBurst(180,108,'#c9a86a',6);
  const r=WATCH.pack.res.report, di=decisiveRound(r);
  if(WATCH.i===di){  // the turning-point round: hero skill beat
    wrSkillFX(dealt>=taken?'a':'d');
    if(dealt>0) wrFloater(252,46,'-'+fmtN(dealt),'#ffd75e',19);  // radiant gold: hero numbers
  }
}
function wrDrawScene(){
  const cv=$('#wr-battle');
  if(!cv||!WATCH.active){ WB.raf=0; return; }
  const c=cv.getContext('2d'), now=performance.now(), W=cv.width, H=cv.height;
  // field: dusk sky + trampled ground
  let g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3a4a58'); g.addColorStop(0.55,'#4a5a44'); g.addColorStop(1,'#3d3325');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  c.fillStyle='rgba(0,0,0,0.18)';
  for(let i=0;i<9;i++){ const gx=(i*47+13)%W; c.fillRect(gx,118+(i%3)*8,10,3); }
  const frames=(WATCH.pack&&WATCH.pack.res&&WATCH.pack.res.report.replay)||[];
  const adv=frames.length>1?WATCH.i/(frames.length-1):0;
  const ax=66+adv*58, dx=294-adv*58;
  // hero apparition rises behind our lines (translucent bronze ghost)
  if(WB.appar){
    const e=(now-WB.appar.t0)/1700;
    if(e>=1) WB.appar=null;
    else{
      const al=0.32*(e<0.2?e/0.2:1-(e-0.2)/0.8);
      c.save(); c.globalAlpha=Math.max(0,al);
      const bx=112, by=158-e*46;
      c.fillStyle='#e8c86a';
      c.beginPath(); c.arc(bx,by-72,36,Math.PI,0); c.fill();
      c.fillRect(bx-36,by-74,72,28);
      c.fillStyle='#ffd75e'; c.fillRect(bx-4,by-112,8,36);
      c.beginPath(); c.ellipse(bx,by-32,54,27,0,Math.PI,0); c.fill();
      c.strokeStyle='#e8c86a'; c.lineWidth=7;
      c.beginPath(); c.moveTo(bx+46,by-12); c.lineTo(bx+62,by-124); c.stroke();
      c.restore();
    }
  }
  drawMiniBand(c,ax,122,false,'our',now);
  drawMiniBand(c,dx,122,true,'foe',now);
  // clash flash at the meeting point
  const ce=(now-WB.clashT)/450;
  if(ce<1){
    c.save(); c.globalAlpha=1-ce;
    const fg=c.createRadialGradient(180,108,2,180,108,44);
    fg.addColorStop(0,'rgba(255,240,200,.95)'); fg.addColorStop(1,'rgba(255,240,200,0)');
    c.fillStyle=fg; c.beginPath(); c.arc(180,108,44,0,7); c.fill(); c.restore();
  }
  // expanding ground decals
  for(let i=WB.rings.length-1;i>=0;i--){
    const r=WB.rings[i], e=(now-r.t0)/800;
    if(e>=1){ WB.rings.splice(i,1); continue; }
    c.strokeStyle='rgba('+r.r+','+r.g+','+r.b+','+(0.85*(1-e))+')';
    c.lineWidth=4*(1-e)+1;
    c.beginPath(); c.ellipse(r.x,r.y,r.maxR*e,r.maxR*e*0.42,0,0,7); c.stroke();
  }
  // particles (additive)
  c.save(); c.globalCompositeOperation='lighter';
  for(let i=WB.parts.length-1;i>=0;i--){
    const p=WB.parts[i], e=(now-p.t0)/p.life;
    if(e>=1){ WB.parts.splice(i,1); continue; }
    const dt=(now-p.t0)/1000;
    c.globalAlpha=1-e; c.fillStyle=p.color;
    c.fillRect(p.x+p.vx*dt, p.y+p.vy*dt+60*dt*dt, 3, 3);
  }
  c.restore(); c.globalAlpha=1;
  // floating combat text: big bold outlined numerals rising ~1s
  c.textAlign='center';
  for(let i=WB.floaters.length-1;i>=0;i--){
    const f=WB.floaters[i], e=(now-f.t0)/1100;
    if(e>=1){ WB.floaters.splice(i,1); continue; }
    const fy=f.y-e*44;
    c.globalAlpha=e<0.7?1:1-(e-0.7)/0.3;
    c.font='bold '+f.size+'px Arial';
    c.lineWidth=3.5; c.strokeStyle='rgba(10,5,2,0.9)';
    c.strokeText(f.txt,f.x,fy);
    c.fillStyle=f.color; c.fillText(f.txt,f.x,fy);
  }
  c.globalAlpha=1;
  WB.raf=requestAnimationFrame(wrDrawScene);
}
function watchBattleModal(pack){
  const r=pack.res.report;
  const frames=(r&&r.replay)||[];
  stopWatch();
  WATCH.active=true; WATCH.pack=pack; WATCH.i=0; WATCH.speed=1;
  if(!frames.length){
    openModal('<div class="winbanner" style="color:var(--red-d)">⚔ BATTLE REPLAY ⚔</div>'+
      '<div class="small center">No replay was recorded for this battle.</div><br>'+
      '<div class="center"><button class="btn" onclick="Game.backToReport()">Back to Report</button></div>');
    return;
  }
  const rowsA=TROOP_ORDER.map(t=>wrRow('a',t)).join('');
  const rowsD=TROOP_ORDER.map(t=>wrRow('d',t)).join('');
  openModal('<div class="winbanner" style="color:var(--red-d)">⚔ BATTLE REPLAY ⚔</div>'+
    '<div class="small center">Round <b id="wr-round">0</b> / '+r.rounds+'</div>'+
    '<canvas id="wr-battle" width="360" height="180"></canvas>'+
    '<div class="wr-field">'+
      '<div class="wr-side atk" id="wr-side-a"><div class="wr-name">'+esc(pack.atkLabel)+'</div>'+rowsA+'</div>'+
      '<div class="wr-mid"><div id="wr-clash">⚔️</div></div>'+
      '<div class="wr-side def" id="wr-side-d"><div class="wr-name">'+esc(pack.defLabel)+'</div>'+rowsD+'</div>'+
    '</div>'+
    '<div class="wr-controls">'+
      '<button class="btn" id="wr-play" onclick="Game.watchToggle()">▶ Play</button>'+
      '<button class="btn" id="wr-speed" onclick="Game.watchSpeed()">1×</button>'+
      '<button class="btn" onclick="Game.watchSkip()">⏩ Result</button>'+
    '</div>'+
    '<div id="wr-result"></div>'+
    '<div class="center"><button class="btn" onclick="Game.backToReport()">Back to Report</button></div>');
  paintWatchFrame(frames[0], frames[0]);
  wrSceneReset();
  if(WB.raf) cancelAnimationFrame(WB.raf);
  WB.raf=requestAnimationFrame(wrDrawScene);
}
function watchAdvance(){
  const frames=WATCH.pack.res.report.replay;
  if(WATCH.i>=frames.length-1){ watchFinish(); return; }
  const prev=frames[WATCH.i];
  WATCH.i++;
  const cur=frames[WATCH.i];
  paintWatchFrame(cur, frames[0]);
  wrSpawnRound(prev,cur);
  watchClash(['#wr-clash']);
  if(cur.hpA<prev.hpA-1e-9) watchClash(['#wr-side-a']);
  if(cur.hpD<prev.hpD-1e-9) watchClash(['#wr-side-d']);
}
function watchFinish(){
  const frames=WATCH.pack.res.report.replay;
  WATCH.i=frames.length-1;
  paintWatchFrame(frames[WATCH.i], frames[0]);
  stopWatch();
  const pb=$('#wr-play'); if(pb) pb.textContent='▶ Play';
  const won=WATCH.pack.res.won;
  if(won){
    wrFloater(180,60,'+'+fmtN(XP_BATTLE_WIN)+' RENOWN','#7fd47f',17);
    wrBurst(180,90,'#ffd75e',18); wrRing(180,140,216,183,106,70);
  }
  const rr=$('#wr-result');
  if(rr) rr.innerHTML='<div style="color:'+(won?'#4a6a28':'var(--red)')+';font-size:17px;letter-spacing:1px">'+(won?'⚔ VICTORY ⚔':'☠ DEFEAT ☠')+'</div>'+
    '<div class="small">Final losses match the battle report exactly.</div>';
}
function watchToggle(){
  const frames=WATCH.pack.res.report.replay;
  const pb=$('#wr-play');
  if(WATCH.playing){ stopWatch(); if(pb) pb.textContent='▶ Play'; return; }
  if(WATCH.i>=frames.length-1){ WATCH.i=0; paintWatchFrame(frames[0],frames[0]); const rr=$('#wr-result'); if(rr) rr.innerHTML=''; }
  WATCH.playing=true; if(pb) pb.textContent='⏸ Pause';
  WATCH.timer=setInterval(watchAdvance, watchSpeedMs());
}
function watchSpeedCycle(){
  WATCH.speed = WATCH.speed===1?2 : WATCH.speed===2?4 : 1;
  const sb=$('#wr-speed'); if(sb) sb.textContent=WATCH.speed+'×';
  if(WATCH.playing){ clearInterval(WATCH.timer); WATCH.timer=setInterval(watchAdvance, watchSpeedMs()); }
}
function backToReport(){
  stopWatch(); WATCH.active=false;
  const p=LASTW; if(!p){ closeModal(); return; }
  if(p.kind==='raid') raidModal(p.res); else if(p.kind==='practice') practiceReportModal(p.res); else battleReportModal(p.res);
}
function welcomeModal(){
  openModal('<div class="winbanner" style="color:var(--red-d)">TROY</div>'+
    '<div class="flavor">The old city is dust and song. The gods have gone quiet. But on a hill above the wine-dark sea, one commander still believes a city can rise again — yours.</div>'+
    '<div class="small">You are <b>Theron, Warden of the Bronze Gate</b>, and the scattered people look to you. Build Troy. Raise an army. Break Warlord Skaros.<br><br>Follow the quests at the top of the city view — they will teach you building, gathering, training, and war.</div><br>'+
    '<div class="center"><button class="btn" onclick="Game.closeModal()">⚔ Raise the Banner</button></div>');
}
function victoryModal(){
  const days=((nowMs()-S.createdAt)/86400000);
  openModal('<div class="winbanner" style="color:var(--gold);text-shadow:0 2px 0 #000">🏛 TRIUMPH 🏛</div>'+
    '<div class="flavor">Skaros the Render lies broken before the Bronze Gate. From the hills to the sea, every banner now bows toward one city — <b>Troy</b>. The bards will sing of Theron for a thousand years, and the wine will flow tonight.</div>'+
    '<table class="rep"><tr><th>Days ruled</th><td>'+days.toFixed(1)+'</td></tr>'+
    '<tr><th>Player level</th><td>Lv '+S.player.level+'</td></tr>'+
    '<tr><th>Troops trained</th><td>'+fmtN(S.stats.trained)+'</td></tr>'+
    '<tr><th>Battles won</th><td>'+S.stats.wins+' of '+S.stats.battles+'</td></tr>'+
    '<tr><th>Raids repelled</th><td>'+S.stats.raidsRepelled+'</td></tr></table>'+
    '<div class="center"><button class="btn" onclick="Game.closeModal()">Rule On (sandbox)</button></div>');
}
function awayModal(info){
  openModal('<h3>While you were away…</h3><div class="small">Gone '+fmtT(info.elapsed)+' — your city kept working (up to 8h).</div><hr class="bronze">'+
    (info.events.length?'<ul class="small">'+info.events.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>':'<div class="small">All quiet on the walls.</div>')+
    '<br><div class="center"><button class="btn" onclick="Game.closeModal()">Continue</button></div>');
}

/* ---------------- public API (inline onclick handlers) ---------------- */
const Game={
  tab(t){ UI.tab=t; render(); },
  build(key){ startBuild(key); },
  trainAdj(t,d){ UI.trainDraft=UI.trainDraft||{spearman:10,archer:10,cavalry:10};
    UI.trainDraft[t]=Math.max(5,Math.min(50,(UI.trainDraft[t]||10)+d)); render(); },
  train(t){ const n=(UI.trainDraft&&UI.trainDraft[t])||10; queueTrain(t,n); },
  practiceAdj(t,d){ UI.practice=UI.practice||{troops:{spearman:5,archer:5,cavalry:5},preset:'mirror'};
    UI.practice.troops[t]=Math.max(0,Math.min(troopCount(t),(UI.practice.troops[t]||0)+d)); render(); },
  practiceMax(t){ if(UI.practice){ UI.practice.troops[t]=troopCount(t); render(); } },
  practicePreset(id){ if(UI.practice && PRACTICE_PRESETS.some(p=>p.id===id)){ UI.practice.preset=id; render(); } },
  runPractice(){ runPractice(); },
  openNode(id){ openNode(id); },
  openComposer(id){ openComposer(id); },
  selectHero(id){ selectHero(id); },
  sendScout(id){ sendScout(id); },
  draftAdj(t,d){ const dr=UI.draft; if(!dr) return;
    dr.troops[t]=Math.max(0,Math.min(troopCount(t),dr.troops[t]+d)); renderComposer(); },
  draftMax(t){ if(UI.draft){ UI.draft.troops[t]=troopCount(t); renderComposer(); } },
  draftHero(){ if(UI.draft&&(heroHome()||UI.draft.hero)){ UI.draft.hero=UI.draft.hero?null:activeHero(); renderComposer(); } },
  sendDraft(){ const d=UI.draft; if(d) sendMarch(d.nodeId,d.troops,d.hero); },
  claim(id){ claimQuest(id); },
  watchBattle(){ if(LASTW) watchBattleModal(LASTW); },
  watchToggle(){ watchToggle(); },
  watchSpeed(){ watchSpeedCycle(); },
  watchSkip(){ watchSkip(); },
  backToReport(){ backToReport(); },
  closeModal(){ closeModal(); },
  enterTitle(){ const t=$('#titlescreen'); if(t) t.style.display='none'; if(S&&!S.seenPrologue) startPrologue(); },
  wmZoom(f){ if(WMAP){ WMAP.cam.z*=f; clampCam(); drawWorld(); } },
  wmCenter(){ if(WMAP){ WMAP.cam.x=WORLD_CX; WMAP.cam.y=WORLD_CY; WMAP.cam.z=0.35; drawWorld(); } },
  wmSaveName(){ const el=$('#wm-kname'); if(el&&S){ S.kingdomName=el.value.trim().slice(0,24)||'Troy'; el.value=S.kingdomName; save(); drawWorld(); toast('Kingdom renamed to '+esc(S.kingdomName)+'.'); } },
  wmCloseSheet(){ selectWorldEntity(null); },
  wmSelect(id){ selectWorldEntity(id); },
  wmOutpost(){ wmOutpostToggle(); },
  plantOutpost(){ plantOutpost(); },
  removeOutpost(id){ removeOutpost(id); },
  plantRally(id){ plantRally(id); },
  cancelRally(id){ cancelRally(id); },
  prolStep(n){ prolShow(n); },
  prolPatron(p){ prolPatron(p); },
  prolFight(){ prolFight(); },
  prolFinish(){ prolFinish(); },
  setSkin(id){ setSkin(id); },
  setTitle(id){ setTitle(id); },
  equipTitle(id){ setTitle(id); closeModal(); }
};
window.Game=Game;

/* ---------------- main loop & init ---------------- */
let saveCounter=0;
function tick(){
  if(!S) return;
  produce(1);
  if(S.build && nowMs()>=S.build.doneAt) completeBuild();
  tickTraining();
  tickEvents();
  tickScouts();
  tickWorld();
  tickRallies();
  checkHeroUnlocks();
  const reports=tickMarches(false);
  if(reports.length){
    for(let i=0;i<reports.length-1;i++) toast((reports[i].won?'Victory':'Defeat')+' at '+reports[i].nodeName);
    battleReportModal(reports[reports.length-1]);
  }
  const raidMsg=tickRaid(false);
  if(raidMsg && !raidMsg.warn) raidModal(raidMsg);
  if(S.victory && !S.victoryShown){ S.victoryShown=true; victoryModal(); save(); }
  checkAchv();
  drainAchvModals();
  updatePowerRecord();
  if(++saveCounter>=5){ saveCounter=0; save(); }
  render();
}
function init(){
  const loaded=load();
  S = loaded || defaultState();
  ensureWorld();
  UI.trainDraft={spearman:10,archer:10,cavalry:10};
  UI.practice={troops:{spearman:5,archer:5,cavalry:5},preset:'mirror'};
  if(!loaded){
    const d0=dailyLogin();           // Day-1 tribute for a new reign
    chronicle('Troy founded on the hill above the wine-dark sea.', S.createdAt);
    save(); render();
    S.seenWelcome=true; save();
    // the welcome modal fires after the prologue cinematic (prolFinish)
    if(d0) setTimeout(()=>toast('🎁 Daily Tribute (Day 1) claimed: '+esc(d0.desc)), 900);
  } else {
    const info=applyOffline();
    if(!S.chronicle.length) chronicle('The chronicles of Troy begin.', S.createdAt);
    render();
    const d=dailyLogin();
    if(d) dailyTributeModal(d, info);
    else if(info.events.length>0) awayModal(info);
  }
  setInterval(tick,1000);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });
  $('#modal-root').addEventListener('click', e=>{ if(e.target.id==='modal-root'){ if(WATCH.active) backToReport(); else closeModal(); } });
}
document.addEventListener('DOMContentLoaded', init);
</script>
