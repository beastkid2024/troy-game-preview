<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TROY — Rise of the Bronze City</title>
<style>
/* ============ TROY v1 — bronze / marble / deep-red theme ============ */
:root{
  --bronze:#b08d57; --bronze-d:#8a6d3f; --bronze-l:#d9bd85;
  --marble:#f6f1e3; --marble-d:#e9dfc6; --marble-dd:#d9cba6;
  --red:#7a1f1f; --red-d:#571111; --red-l:#a83a3a;
  --ink:#2c2317; --ink-l:#5a4a33; --gold:#d9a441;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#14100a;font-family:Georgia,'Times New Roman',serif;color:var(--ink);
  display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:520px;min-height:100vh;background:var(--marble);
  background-image:repeating-linear-gradient(45deg,rgba(176,141,87,.04) 0 2px,transparent 2px 6px);
  display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px #000}
/* ---------- header resource bar ---------- */
#resbar{background:linear-gradient(180deg,#3a2a18,#241a0e);color:var(--marble);
  padding:8px 6px 6px;border-bottom:3px solid var(--bronze);position:sticky;top:0;z-index:30}
#resbar .title{text-align:center;font-size:15px;letter-spacing:4px;color:var(--bronze-l);
  font-weight:bold;margin-bottom:6px;text-shadow:0 1px 0 #000}
#resgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.res-chip{background:rgba(246,241,227,.08);border:1px solid var(--bronze-d);border-radius:8px;
  padding:4px 6px;text-align:center;min-width:0}
.res-chip .r-top{display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:14px;font-weight:bold;color:#fff;white-space:nowrap}
.res-chip .r-rate{font-size:10px;color:var(--bronze-l);font-family:Arial,sans-serif}
.ic{display:inline-flex;vertical-align:middle}
.ic svg{width:1.15em;height:1.15em;vertical-align:-0.2em}
/* ---------- hint bar ---------- */
#hintbar{background:linear-gradient(90deg,var(--red),var(--red-d));color:#ffe9c9;
  font-size:13px;padding:7px 12px;display:flex;gap:8px;align-items:center;z-index:29}
#hintbar .pulse{animation:pulse 1.6s infinite;font-size:15px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* ---------- views ---------- */
#views{flex:1;min-height:0;padding:10px 10px 86px;overflow-y:auto;box-sizing:border-box}
.view{display:none}
.view.active{display:block;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:16px;letter-spacing:2px;color:var(--red-d);border-bottom:2px solid var(--bronze);
  padding-bottom:4px;margin:12px 2px 8px;text-transform:uppercase}
/* ---------- cards & buttons ---------- */
.card{background:linear-gradient(180deg,#fffdf6,var(--marble-d));border:2px solid var(--bronze);
  border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 2px 6px rgba(60,40,10,.25)}
.card.flash{animation:cardflash 1.3s ease}
@keyframes cardflash{0%,100%{box-shadow:0 2px 6px rgba(60,40,10,.25)}30%{box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold)}}
/* ---------- canvas city panorama ---------- */
#cityview-wrap{margin:10px 10px 4px;border:2px solid var(--bronze);border-radius:10px;overflow:hidden;position:relative;background:#f3dfae;box-shadow:0 2px 6px rgba(60,40,10,.25)}
#cityview{display:block;width:100%;height:340px;cursor:grab;touch-action:none}
#cityview:active{cursor:grabbing}
#iso-panel{position:absolute;left:10px;right:10px;bottom:10px;display:none;background:#1c150df2;border:1px solid var(--bronze);border-radius:12px;padding:12px 14px;color:#fff2cb;box-shadow:0 8px 24px #000a;max-height:74%;overflow-y:auto;z-index:5}
.iso-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.iso-panel-head .btn{flex-shrink:0}
.cityview-hint{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff8e8;background:rgba(40,26,12,.55);padding:2px 8px;border-radius:8px;font-family:Arial,sans-serif;pointer-events:none}
.btn{display:inline-block;background:linear-gradient(180deg,var(--bronze-l),var(--bronze));
  border:2px solid var(--bronze-d);border-radius:8px;color:#2c1f0e;font-weight:bold;
  font-family:Georgia,serif;font-size:14px;padding:10px 16px;cursor:pointer;min-height:44px;
  text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.red{background:linear-gradient(180deg,var(--red-l),var(--red));border-color:var(--red-d);color:#ffe9c9;text-shadow:0 1px 0 #000}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{font-size:12px;padding:6px 10px;min-height:36px}
.lvl-pips{letter-spacing:2px;font-size:13px;color:var(--bronze-d)}
.lvl-pips .on{color:var(--gold);text-shadow:0 0 2px var(--bronze-d)}
.costline{font-size:12px;color:var(--ink-l);font-family:Arial,sans-serif;margin:4px 0}
.prog{height:10px;background:#cbbd97;border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--bronze-d)}
.prog > div{height:100%;background:linear-gradient(90deg,var(--bronze),var(--gold));width:0%}
.prog.red > div{background:linear-gradient(90deg,var(--red-l),var(--red))}
.bld-head{display:flex;align-items:center;gap:10px}
.bld-icon{width:46px;height:46px;flex:0 0 46px;background:radial-gradient(circle at 35% 30%,#fff8e6,var(--marble-d));
  border:2px solid var(--bronze);border-radius:10px;display:flex;align-items:center;justify-content:center}
.bld-icon .ic svg{width:28px;height:28px}
.bld-name{font-size:16px;font-weight:bold;color:var(--red-d)}
.bld-desc{font-size:12px;color:var(--ink-l);font-style:italic}
/* ---------- tab bar ---------- */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#3a2a18,#1d1409);
  border-top:3px solid var(--bronze);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.tabbtn{background:none;border:none;color:#cbbd97;font-family:Georgia,serif;font-size:11px;
  padding:8px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}
.tabbtn .ic svg{width:24px;height:24px}
.tabbtn.active{color:var(--gold)}
.tabbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--red-l);display:none}
.tabbtn .dot.show{display:block}
/* ---------- map ---------- */
#mapwrap{position:relative;width:100%;height:480px;border:3px solid var(--bronze-d);border-radius:12px;
  overflow:hidden;background:#e6d9b8;box-shadow:inset 0 0 40px rgba(122,31,31,.15)}
#mapbg{position:absolute;inset:0;width:100%;height:100%}
.mnode{position:absolute;transform:translate(-50%,-50%);width:64px;display:flex;flex-direction:column;
  align-items:center;cursor:pointer;background:none;border:none;font-family:Georgia,serif;padding:0}
.mnode .mn-ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:3px solid var(--bronze-d);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.mnode .mn-ic .ic svg{width:24px;height:24px}
.mnode .mn-lb{font-size:9.5px;color:#fff;background:rgba(20,12,6,.78);border-radius:6px;
  padding:2px 5px;margin-top:3px;text-align:center;line-height:1.15;max-width:76px}
.mnode .mn-tier{position:absolute;top:-4px;right:6px;background:var(--red);color:#ffe9c9;font-size:10px;
  font-weight:bold;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  border:1px solid #ffe9c9;font-family:Arial,sans-serif}
.mnode.gather .mn-ic{background:radial-gradient(circle at 35% 30%,#fdf6df,#c9a86a)}
.mnode.camp .mn-ic{background:radial-gradient(circle at 35% 30%,#e8a0a0,#7a1f1f)}
.mnode.camp .mn-ic .ic{color:#ffe9c9}
.mnode.city .mn-ic{background:radial-gradient(circle at 35% 30%,#c9b586,#6b5326);border-color:#3a2c12}
.mnode.city .mn-ic .ic{color:#ffe9c9}
.mnode.boss .mn-ic{background:radial-gradient(circle at 35% 30%,#5c1414,#1d0808);border-color:var(--gold);animation:pulse 2s infinite}
.mnode.boss .mn-ic .ic{color:var(--gold)}
.mnode.ruin .mn-ic{background:radial-gradient(circle at 35% 30%,#d8cfae,#8a7a55)}
.mnode.done{opacity:.45;filter:grayscale(.8)}
.mnode.done .mn-tier{display:none}
#home-marker{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#home-marker .troy{font-size:13px;font-weight:bold;letter-spacing:3px;color:var(--red-d);
  text-shadow:0 1px 0 #fff,0 0 6px #fff}
.marchbar{background:#2c1f0e;border:1px solid var(--bronze);border-radius:8px;color:#ffe9c9;
  font-size:12px;font-family:Arial,sans-serif;padding:8px 10px;margin-bottom:8px}
/* ---------- world map (canvas) ---------- */
body.on-map #resbar{display:none} /* map tab has its own slim resource bar */
body.on-map #app{height:100vh;height:100dvh} /* definite height so the map flex column can't stretch the page */
#wm-head{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#wm-kname{flex:1;min-width:0;background:#2c1f0e;border:1px solid var(--bronze);border-radius:8px;
  color:#ffe9c9;font-family:Georgia,serif;font-size:14px;padding:7px 10px}
#wm-zoomrow{display:flex;gap:6px}
.wm-zbtn{width:38px;height:38px;border-radius:10px;border:2px solid var(--bronze-d);background:#3a2a12;
  color:#ffe9c9;font-size:18px;font-weight:bold;cursor:pointer;flex:none}
.wm-zbtn:active{background:#5a421e}
#view-map.active{display:flex;flex-direction:column;height:100%}
#worldmap{width:100%;flex:1 1 auto;min-height:300px;height:auto;display:block;border:3px solid var(--bronze-d);border-radius:12px;
  background:#274a28;touch-action:none;cursor:grab;box-sizing:border-box}
#worldmap:active{cursor:grabbing}
#wm-feed{margin-top:6px;background:#241a0c;border:1px solid var(--bronze-d);border-radius:10px;
  padding:7px 10px;font-family:Arial,sans-serif;font-size:11.5px;color:#d8c491;min-height:104px}
#wm-feed .wf-row{line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wm-resbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;background:rgba(20,12,6,.88);
  border:1px solid var(--gold);border-radius:10px;padding:5px 10px;font-family:Arial,sans-serif;
  font-size:11.5px;color:#ffe9c9}
#wm-resbar .wm-res{display:flex;align-items:center;gap:3px}
#wm-resbar .wm-res b{font-size:11.5px}
#wm-resbar .wm-ric{width:20px;height:20px}
#wm-resbar .wm-pow{margin-left:auto;color:#f0d98a;font-weight:bold;white-space:nowrap}
#wm-resbar .wm-coords{color:#b39a63;white-space:nowrap;border-left:1px solid rgba(201,162,39,.45);
  padding-left:8px;margin-left:2px}
#wm-feed .wf-row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
#wm-feed .wf-row:first-child{color:#ffe9c9}
#wm-sheet{margin-top:6px;background:#2c1f0e;border:2px solid var(--bronze);border-radius:12px;
  padding:10px 12px;color:#ffe9c9;display:none}
#wm-sheet.open{display:block;animation:fadein .2s}
#wm-sheet h3{margin:0 0 2px;font-size:16px}
#wm-sheet .small{color:#d8c491}
#wm-sheet .wm-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
/* ---------- RoK-quality layer: march queue, node card, banners, trophy, battle scene ---------- */
#view-map{position:relative}
#march-queue{position:absolute;right:8px;top:118px;z-index:6;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.mq-row{display:flex;align-items:center;gap:7px;background:rgba(20,12,6,.88);border:1px solid var(--gold);
  border-radius:10px;padding:5px 9px 5px 5px;color:#ffe9c9;font-family:Arial,sans-serif;font-size:11px;
  box-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:auto;cursor:pointer;max-width:178px}
.mq-medal{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8c86a,#8a6d3f);
  border:2px solid #5e3a1a;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;
  font-weight:bold;font-size:13px;color:#3a2410}
.mq-info{min-width:0}
.mq-name{font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.mq-sub{font-size:10px;color:#d8c491}
.mq-sub b{color:#ffe9c9}
/* three-stat node card */
.nodecard{border:2px solid var(--gold);border-radius:12px;overflow:hidden;background:#2c1f0e}
.nodecard-head{background:linear-gradient(180deg,#7a1f1f,#571111);color:#ffe9c9;padding:8px 12px;
  border-bottom:2px solid var(--gold);font-size:16px;letter-spacing:1px}
.nodecard-head .lvl{color:var(--gold);font-size:12px;letter-spacing:2px;display:block}
.nstat{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid rgba(201,162,39,.25);
  font-family:Arial,sans-serif;font-size:12.5px;color:#d8c491}
.nstat b{color:#ffe9c9;font-size:13px}
.btn.big-gather{display:block;width:100%;margin:10px 0 4px;font-size:17px;letter-spacing:3px;padding:13px;min-height:52px}
/* broadcast war banner */
#war-banner{position:fixed;top:0;left:50%;transform:translate(-50%,-110%);width:100%;max-width:520px;z-index:120;
  background:linear-gradient(180deg,#7a1f1f 0%,#4a1212 70%,#3a0e0e 100%);border-bottom:3px solid var(--gold);
  color:#ffe9c9;text-align:center;padding:10px 12px 12px;box-shadow:0 6px 24px rgba(0,0,0,.6);
  transition:transform .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#war-banner.show{transform:translate(-50%,0)}
#war-banner .wb-title{font-size:17px;letter-spacing:3px;color:var(--gold);text-shadow:0 2px 0 #000}
#war-banner .wb-sub{font-size:12px;color:#ffe9c9;font-family:Arial,sans-serif;margin-top:2px}
#war-banner .wb-knot{color:var(--gold);letter-spacing:6px;font-size:11px}
/* victory ceremony overlay */
#victory-overlay{position:fixed;inset:0;z-index:130;display:none;align-items:center;justify-content:center;
  background:rgba(8,5,2,.0);transition:background .5s}
#victory-overlay.show{display:flex;background:rgba(8,5,2,.72)}
#victory-overlay .vo-ribbon{background:linear-gradient(180deg,#e8c86a,#b08d57 60%,#8a6d3f);
  border-top:3px solid #fff2cb;border-bottom:3px solid #5e3a1a;color:#3a2410;font-size:26px;letter-spacing:8px;
  padding:14px 40px;font-weight:bold;box-shadow:0 8px 30px rgba(0,0,0,.7);opacity:0;transform:scaleX(.2)}
#victory-overlay.show .vo-ribbon{animation:voSlam .5s .3s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes voSlam{to{opacity:1;transform:scaleX(1)}}
#victory-overlay .vo-spoils{margin-top:14px;color:#ffe9c9;font-family:Arial,sans-serif;font-size:14px;text-align:center;opacity:0}
#victory-overlay.show .vo-spoils{animation:voFade .5s 1.1s forwards}
@keyframes voFade{to{opacity:1}}
#victory-overlay .vo-go{margin-top:16px;opacity:0;pointer-events:none}
#victory-overlay.show .vo-go{animation:voFade .4s 1.7s forwards;pointer-events:auto}
/* trophy battle report */
.trophy{border:3px solid var(--bronze);border-radius:12px;background:linear-gradient(180deg,#fbf6e8,#e9dfc6);
  padding:14px;position:relative;overflow:hidden}
.trophy .t-duel{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.trophy .t-side{flex:1;text-align:center}
.trophy .t-side .t-name{font-size:14px;font-weight:bold;color:var(--red-d)}
.trophy .t-side .t-pow{font-size:11px;color:var(--ink-l);font-family:Arial,sans-serif}
.trophy .t-vs{font-size:20px;color:var(--bronze-d);font-weight:bold}
.trophy .t-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.trophy .t-cell{background:rgba(176,141,87,.12);border:1px solid var(--bronze-d);border-radius:8px;padding:6px 4px;text-align:center}
.trophy .t-cell .v{font-size:17px;font-weight:bold;color:var(--ink)}
.trophy .t-cell .k{font-size:10px;color:var(--ink-l);font-family:Arial,sans-serif;letter-spacing:1px}
.trophy .t-renown{text-align:center;font-size:15px;color:#4a6a28;font-weight:bold;margin:6px 0}
.trophy .t-stamp{position:absolute;top:14px;right:10px;transform:rotate(12deg);border:3px solid;border-radius:6px;
  padding:4px 10px;font-size:15px;letter-spacing:3px;font-weight:bold;opacity:.92}
.trophy .t-stamp.win{color:#4a6a28;border-color:#4a6a28}
.trophy .t-stamp.lose{color:var(--red);border-color:var(--red)}
.trophy .t-spoils{font-size:12.5px;font-family:Arial,sans-serif;text-align:center;color:var(--ink-l);margin-top:6px}
/* battle replay scene */
#wr-battle{display:block;width:100%;height:170px;border:2px solid var(--bronze-d);border-radius:10px;
  background:#2a3a24;margin:8px 0}
.wr-field{position:relative}
/* upgrade panel deltas + preview */
.delta-pos{color:#3f7a2e;font-weight:bold;font-family:Arial,sans-serif;font-size:12.5px}
#iso-preview{display:block;width:150px;height:104px;margin:6px auto;border:2px solid var(--gold);border-radius:10px;background:#241a0c}
/* ---------- modal ---------- */
#modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;
  background:rgba(10,6,3,.72);padding:18px}
#modal-root.open{display:flex}
#modal{background:linear-gradient(180deg,#fffdf6,var(--marble-d));border:3px solid var(--bronze);
  border-radius:14px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;padding:18px;
  box-shadow:0 8px 40px #000;animation:fadein .25s}
#modal h3{margin:0 0 8px;color:var(--red-d);letter-spacing:1px;font-size:18px}
#modal .flavor{font-style:italic;color:var(--ink-l);font-size:13px;margin-bottom:10px}
/* ---------- title screen ---------- */
#titlescreen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#160d06;overflow:hidden}
#titlescreen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
#titlescreen .ts-scrim{position:absolute;top:0;left:0;right:0;height:40%;z-index:2;display:none;
  background:linear-gradient(180deg,rgba(12,7,3,.92) 0%,rgba(12,7,3,.55) 45%,rgba(12,7,3,0) 100%)}
#titlescreen .ts-fallback{position:absolute;top:max(9%,env(safe-area-inset-top));width:100%;text-align:center;font-family:Georgia,serif;
  font-size:clamp(44px,17vw,84px);letter-spacing:.12em;color:#c9973f;text-shadow:0 3px 0 #5b3a12,0 6px 18px #000;
  z-index:3;display:none}
/* portrait phones crop the cover's baked title at the sides: show a crisp HTML title instead,
   and frame the art on the burning city + horse below it */
@media (max-aspect-ratio:3/4){
  #titlescreen .ts-fallback{display:block}
  #titlescreen .ts-scrim{display:block}
  #titlescreen img{object-position:center 62%}
}
#titlescreen .ts-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(12,6,2,.88) 0%,rgba(12,6,2,0) 50%)}
#titlescreen .ts-content{position:absolute;bottom:7%;left:0;right:0;text-align:center}
#titlescreen .ts-sub{color:#e8d9b8;font-family:Georgia,serif;font-style:italic;font-size:15px;margin-bottom:14px;text-shadow:0 2px 6px #000}
.ts-enter{font-size:20px;padding:14px 46px;box-shadow:0 4px 18px rgba(0,0,0,.6)}
/* ---------- toast ---------- */
#toast-root{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:100%;max-width:500px;
  z-index:120;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 14px}
.toast{background:#241a0e;color:#ffe9c9;border:2px solid var(--bronze);border-radius:10px;
  padding:9px 14px;font-size:13px;font-family:Arial,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.5);
  animation:fadein .25s;text-align:center;max-width:100%}
/* ---------- misc ---------- */
.stepper{display:flex;align-items:center;gap:10px;margin:8px 0}
.stepper button{width:44px;height:44px;font-size:20px;border-radius:10px;border:2px solid var(--bronze-d);
  background:linear-gradient(180deg,var(--bronze-l),var(--bronze));font-weight:bold;cursor:pointer;color:#2c1f0e}
.stepper .val{font-size:18px;font-weight:bold;min-width:52px;text-align:center;font-family:Arial,sans-serif}
.qrow{display:flex;gap:10px;align-items:flex-start}
.qnum{flex:0 0 30px;height:30px;border-radius:50%;background:var(--bronze);color:#fff;font-weight:bold;
  display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;border:2px solid var(--bronze-d)}
.qrow.done .qnum{background:#6a8f3c;border-color:#4a6a28}

.xpbar{height:12px;background:#cbbd97;border:1px solid var(--bronze-d);border-radius:7px;overflow:hidden;margin:6px 0}
.xpbar > div{height:100%;background:linear-gradient(90deg,#6a8f3c,#9dc65c)}
.ability{border-left:4px solid var(--marble-dd);padding:6px 10px;margin:6px 0;background:rgba(255,255,255,.4);border-radius:0 8px 8px 0}
.ability.unlocked{border-left-color:var(--gold)}
.ability .an{font-weight:bold;color:var(--red-d)}
.ability .lock{color:var(--ink-l);font-size:12px;font-style:italic}
table.rep{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px;margin:8px 0}
table.rep td,table.rep th{border:1px solid var(--bronze-d);padding:6px 8px;text-align:left}
table.rep th{background:var(--bronze);color:#2c1f0e}
.winbanner{text-align:center;font-size:22px;font-weight:bold;letter-spacing:2px;margin:6px 0}
.streak{display:flex;justify-content:center;gap:6px;margin:8px 0}
/* ---------- battle replay viewer ---------- */
.wr-field{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;align-items:stretch;margin:8px 0}
.wr-side{background:rgba(44,31,14,.06);border:2px solid var(--bronze-d);border-radius:10px;padding:8px 6px}
.wr-side.atk{border-color:var(--gold)}
.wr-name{font-size:12px;font-weight:bold;text-align:center;color:var(--red-d);margin-bottom:6px;
  font-family:Arial,sans-serif;min-height:30px;display:flex;align-items:center;justify-content:center}
.wr-row{display:flex;align-items:center;gap:6px;margin:6px 0;font-family:Arial,sans-serif}
.wr-row .ic svg{width:22px;height:22px;flex:0 0 22px}
.wr-count{font-weight:bold;font-size:14px;min-width:32px;text-align:right}
.wr-hp{flex:1;height:10px;background:#cbbd97;border:1px solid var(--bronze-d);border-radius:6px;overflow:hidden}
.wr-hp>div{height:100%;width:100%;background:linear-gradient(90deg,#a83a3a,#e07a5f);transition:width .3s}
.wr-side.def .wr-hp>div{background:linear-gradient(90deg,#b8860b,#e8c35a)}
.wr-mid{display:flex;align-items:center;justify-content:center}
#wr-clash{font-size:30px;line-height:1}
#wr-clash.hit{animation:wrclash .45s}
@keyframes wrclash{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.6) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
.wr-side.flash{animation:wrflash .5s}
@keyframes wrflash{0%{background:rgba(168,58,58,.55)}100%{background:rgba(44,31,14,.06)}}
.wr-controls{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.wr-controls .btn{min-width:70px}
#wr-result{text-align:center;margin:8px 0;font-family:Arial,sans-serif}
.sdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--bronze-d);display:flex;
  align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:12px;
  font-weight:bold;color:var(--ink-l);background:var(--marble-d)}
.sdot.on{background:radial-gradient(circle at 35% 30%,var(--gold),var(--bronze-d));color:#2c1f0e}
.hero-portrait{width:84px;height:84px;border-radius:50%;border:3px solid var(--gold);
  background:radial-gradient(circle at 35% 30%,#a83a3a,#571111);display:flex;align-items:center;
  justify-content:center;margin:0 auto 8px}
.hero-portrait .ic svg{width:48px;height:48px;color:var(--gold)}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e0d0a8}
.hrow:last-child{border-bottom:none}
.hport{width:44px;height:44px;border-radius:50%;border:2px solid var(--bronze);flex:none;
  background:radial-gradient(circle at 35% 30%,#8a6a3a,#3a2a12);display:flex;align-items:center;justify-content:center}
.hport .ic svg{width:26px;height:26px;color:var(--gold)}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0}
.relic{text-align:center;opacity:.55}
.relic.got{opacity:1}
.relic-ic{width:40px;height:40px;margin:0 auto 2px;border-radius:10px;border:2px solid var(--marble-dd);
  background:linear-gradient(180deg,#fffdf6,var(--marble-d));display:flex;align-items:center;justify-content:center;color:var(--bronze-d)}
.relic.got .relic-ic{border-color:var(--gold);color:#8a5a1a;box-shadow:0 0 8px rgba(201,151,63,.5)}
.relic-ic .ic svg{width:24px;height:24px}
.relic-nm{font-size:9px;color:var(--ink-l);font-family:Arial,sans-serif;line-height:1.2}
.center{text-align:center}
.small{font-size:12px;color:var(--ink-l);font-family:Arial,sans-serif}
#saveind{font-size:11px;color:var(--bronze);font-family:Arial,sans-serif;white-space:nowrap;align-self:center}
hr.bronze{border:none;border-top:2px solid var(--bronze);margin:10px 0}
/* ---------- achievements / chronicle / city skins ---------- */
.ch-tl{max-height:360px;overflow-y:auto}
.ch-day{font-size:12px;font-weight:bold;color:var(--red-d);letter-spacing:1px;margin:10px 0 4px;font-family:Arial,sans-serif}
.ch-day:first-child{margin-top:0}
.ch-row{display:flex;gap:8px;font-size:12px;font-family:Arial,sans-serif;color:var(--ink);padding:3px 0;border-bottom:1px dotted var(--marble-dd)}
.ch-time{flex:0 0 62px;color:var(--ink-l)}
.skinrow{display:flex;gap:8px}
.skinbtn{flex:1;background:linear-gradient(180deg,#fffdf6,var(--marble-d));border:2px solid var(--bronze-d);

  gap:6px;font-family:Georgia,serif;min-height:44px}
.skinbtn.active{border-color:var(--gold);box-shadow:0 0 10px rgba(201,151,63,.5)}
.skinbtn:disabled{opacity:.55;cursor:default}
.skinsw{width:44px;height:44px;border-radius:50%;border:2px solid var(--bronze-d)}
.skinsw[data-sk="bronze"]{background:radial-gradient(circle at 35% 30%,#d9bd85,#8a6d3f)}
.skinsw[data-sk="marble"]{background:radial-gradient(circle at 35% 30%,#ffffff,#c9b98f);border-color:#c9a227}
.skinsw[data-sk="warred"]{background:radial-gradient(circle at 35% 30%,#a83a3a,#1d0808);border-color:#a83a3a}
.skinnm{font-weight:bold;font-size:13px;color:var(--red-d)}

const WORLD=12000, WORLD_CX=6000, WORLD_CY=6000, WORLD_SEED=20260927;
const AK_TAGS=['VKN','TRJ','ATH','SPR','MYC'];
const TAG_COLORS={VKN:'#8fc3f0',TRJ:'#f08f8f',ATH:'#a8e6a3',SPR:'#f0d98a',MYC:'#d8a8f0'};

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function akGarrison(lvl){
  return {spearman:Math.round(lvl*2.2), archer:Math.round(lvl*1.8), cavalry:Math.round(lvl*1.2)};
}
function akLoot(lvl){
  const m=lvl*22;
  return {food:Math.round(m*1.2), wood:Math.round(m), stone:Math.round(m*0.8), gold:Math.round(m*0.9)};
}
function akNodeFor(k){
  const dist=Math.hypot(k.wx-WORLD_CX, k.wy-WORLD_CY);
  const g=akGarrison(k.lvl);
  return {id:k.id, kind:'ak', name:'['+k.tag+'] '+k.name, tag:k.tag, lvl:k.lvl,
    wx:k.wx, wy:k.wy, x:k.wx/WORLD*100, y:k.wy/WORLD*100,
    march:Math.round(30+dist/WORLD*150), garrison:g, loot:akLoot(k.lvl),
    tier:Math.min(5,Math.ceil(k.lvl/5)), wallMult:1+k.lvl*0.008,
    flavor:'A rival kingdom of the bronze-age world. Its banners fly high — for now.'};
}
function genWorld(){
  const rnd=mulberry32(WORLD_SEED);
  const kingdoms=[]; const used={};
  const spots=[]; // {x,y} occupied, for min-distance checks
  function clearOf(x,y,min){
    for(const s of spots){ const dx=s.x-x, dy=s.y-y; if(dx*dx+dy*dy<min*min) return false; }
    return true;
  }
  function place(minDist, fromCenter, margin, tries){
    margin=margin||400; tries=tries||900;
    for(let a=0;a<tries;a++){
      const x=margin+rnd()*(WORLD-margin*2), y=margin+rnd()*(WORLD-margin*2);
      if(Math.hypot(x-WORLD_CX,y-WORLD_CY)<fromCenter) continue;
      if(!clearOf(x,y,minDist)) continue;
      spots.push({x:x,y:y}); return {x:x,y:y};
    }
    return null;
  }
  spots.push({x:WORLD_CX,y:WORLD_CY});
  // hand-authored NODES keep their relative spots; reserve them
  for(const n of NODES){ const wx=n.x/100*WORLD, wy=n.y/100*WORLD; spots.push({x:wx,y:wy}); }
  /* Clustered jittered-grid placement: each alliance holds a home region so the
     glowing territory borders have real blobs to wrap around. Grid cells are
     760px with ±30px jitter -> ~700px minimum separation, guaranteed. */
  const ANCHORS={VKN:[2500,2500],TRJ:[9500,2500],ATH:[2500,9500],SPR:[9500,9500],MYC:[6000,1600]};
  const CELL=760, GRIDN=15, G0=(WORLD-GRIDN*CELL)/2;
  // near neighbors on the player's frontier (visible the moment the map opens)
  const NBPTS=[[1,1],[1,-1],[-1,1],[-1,-1]].map(([a,b])=>({x:WORLD_CX+a*380,y:WORLD_CY+b*380}));
  const slots=[];
  for(let gy=0;gy<GRIDN;gy++) for(let gx=0;gx<GRIDN;gx++){
    const sx=G0+CELL*(gx+0.5), sy=G0+CELL*(gy+0.5);
    if(Math.hypot(sx-WORLD_CX,sy-WORLD_CY)<760) continue; // keep the player's vale clear
    let near=false;
    for(const q of NBPTS){ if(Math.hypot(sx-q.x,sy-q.y)<700){ near=true; break; } }
    if(near) continue; // leave room for the near neighbors
    slots.push({x:sx,y:sy,used:false});
  }
  function akName(){
    let nm=AK_NAMES[Math.floor(rnd()*AK_NAMES.length)];
    if(used[nm]) nm+=' '+(100+Math.floor(rnd()*900)); // collision: "Paris 456"
    else if(rnd()<0.55) nm+=String(Math.floor(rnd()*900+100)).padStart(3,'0'); // "Achilles760"
    used[nm]=true;
    return nm;
  }
  let ni=0;
  for(let i=0;i<200;i++){
    const tag=AK_TAGS[i%AK_TAGS.length]; // round-robin: even alliance populations
    const an=ANCHORS[tag];
    let best=null, bestScore=1e18;
    for(const s of slots){
      if(s.used) continue;
      const score=Math.hypot(s.x-an[0],s.y-an[1])+rnd()*900; // nearest to anchor, organic edges
      if(score<bestScore){ bestScore=score; best=s; }
    }
    if(!best) break;
    best.used=true;
    const px=Math.round(best.x+(rnd()-0.5)*60), py=Math.round(best.y+(rnd()-0.5)*60);
    spots.push({x:px,y:py});
    const nm=akName();
    const lvl=1+Math.floor(Math.pow(rnd(),2.1)*24);
    kingdoms.push({id:'ak'+(ni++), tag:tag, name:nm, lvl:lvl,
      power:lvl*1200+Math.floor(rnd()*900), wx:px, wy:py});
  }
  // four small frontier neighbors close to the player, mixed alliances
  const NBT={ '1,1':'TRJ', '1,-1':'ATH', '-1,1':'VKN', '-1,-1':'SPR' };
  for(const q of NBPTS){
    const tag=NBT[[Math.sign(q.x-WORLD_CX),Math.sign(q.y-WORLD_CY)].join(',')];
    const lvl=1+Math.floor(rnd()*4);
    const nm=akName();
    kingdoms.push({id:'ak'+(ni++), tag:tag, name:nm, lvl:lvl,
      power:lvl*1200+Math.floor(rnd()*900), wx:Math.round(q.x), wy:Math.round(q.y)});
    spots.push({x:q.x,y:q.y});
  }
  // extra resource nodes, ruin camps, barbarian camps (seeded, stable)
  const extra=[];
  const RES4=['food','wood','stone','gold'];
  const rflav={food:'Wild grain ripe for the taking.',wood:'Tall cedars, free for the cutting.',
    stone:'Pale stone jutting from the earth.',gold:'A glint of sun-gold in the rock.'};
  for(let i=0;i<12;i++){
    const p=place(380, 500); if(!p) break;
    const res=RES4[i%4];
    extra.push({id:'x'+res+(i+1), kind:'gather', res:res, name:{food:'Wild Wheat',wood:'Cedar Stand',stone:'Stone Outcrop',gold:'Gold Seam'}[res],
      wx:Math.round(p.x), wy:Math.round(p.y), march:Math.round(30+Math.hypot(p.x-WORLD_CX,p.y-WORLD_CY)/WORLD*150),
      flavor:rflav[res]});
  }
  const cnames=['Jackal Den','Red Dunes','Ashen Hollow','Boar Thicket','Serpent Nest','Crow Perch','Wolf Warren',
    'Scorpion Pit','Hyena Laugh','Vulture Roost','Blood Mesa','Dust Hollow','Thorn Brake','Gravel Pit',
    'Ember Field','Howling Steppe','Cinder Wash','Salt Flat','Iron Gully','Broken Spear'];
  for(let i=0;i<16;i++){
    const p=place(380, 600); if(!p) break;
    const d=Math.hypot(p.x-WORLD_CX,p.y-WORLD_CY)/WORLD; // 0..~0.7
    const tier=1+Math.min(4,Math.floor(d*7));
    const m=4+tier*7;
    extra.push({id:'xcamp'+(i+1), kind:'camp', tier:tier, name:cnames[i%cnames.length],
      wx:Math.round(p.x), wy:Math.round(p.y), march:Math.round(30+d*150),
      garrison:{spearman:Math.round(m*1.1), archer:Math.round(m*0.8), cavalry:Math.round(m*0.4)},
      loot:{food:m*22, wood:m*18, stone:m*10, gold:m*14},
      flavor:'Barbarians squat on this land. Drive them off.'});
  }
  const rnames=['Toppled Shrine','Sunken Vault','Broken Colossus','Ashen Chapel','Flooded Crypt','Windworn Altar',
    'Shattered Obelisk','Drowned Archive','Crumbling Bastion','Silent Forum','Weeping Statue','Hollow Ziggurat',
    'Riven Temple','Forsaken Mint','Collapsed Aqueduct','Gloomy Necropolis'];
  for(let i=0;i<12;i++){
    const p=place(380, 600); if(!p) break;
    const d=Math.hypot(p.x-WORLD_CX,p.y-WORLD_CY)/WORLD;
    const m=Math.round(6+d*22);
    extra.push({id:'xruin'+(i+1), kind:'ruin', name:rnames[i%rnames.length],
      wx:Math.round(p.x), wy:Math.round(p.y), march:Math.round(30+d*150),
      garrison:{spearman:Math.round(m*1.1), archer:Math.round(m*0.9), cavalry:Math.round(m*0.4)},
      loot:{gold:m*22, stone:m*16, wood:m*12},
      flavor:'Old stones, older squatters, oldest gold.'});
  }
  const feed=[];
  const evk=kingdoms.slice(0,6);
  for(const k of evk) feed.push({t:Date.now(), txt:worldEventText(k)});
  // ambient AI armies marching between kingdoms (purely visual; makes the world feel alive)
  const aiMarches=[];
  for(let i=0;i<9 && kingdoms.length>1;i++){
    const a=Math.floor(rnd()*kingdoms.length);
    let b=Math.floor(rnd()*kingdoms.length);
    if(b===a) b=(b+1)%kingdoms.length;
    aiMarches.push({a:kingdoms[a].id, b:kingdoms[b].id, t:rnd(), sp:0.008+rnd()*0.02});
  }
  return {kingdoms:kingdoms, extra:extra, tick:0, feed:feed, aiMarches:aiMarches};
}
let WORLD_REG=false;
function ensureWorld(){
  if(!S) return;
  if(!S.world){ S.world=genWorld(); save(); }
  const W=S.world;
  if(!W.aiMarches){ // backfill for worlds generated before ambient marches
    const rnd=mulberry32(WORLD_SEED+31); W.aiMarches=[];
    for(let i=0;i<9 && W.kingdoms.length>1;i++){
      const a=Math.floor(rnd()*W.kingdoms.length);
      let b=Math.floor(rnd()*W.kingdoms.length);
      if(b===a) b=(b+1)%W.kingdoms.length;
      W.aiMarches.push({a:W.kingdoms[a].id, b:W.kingdoms[b].id, t:rnd(), sp:0.008+rnd()*0.02});
    }
  }
  // backfill for the territory/rallies/sieges feature set
  if(!W.territory) seedTerritory(W);
  if(!W.rallies) W.rallies=[];
  if(!W.sieges) W.sieges={};
  if(!W.intentions) W.intentions=[];
  if(!W.pulses) W.pulses=[];
  // world coords for hand-authored nodes
  for(const n of NODES){ if(n.wx===undefined){ n.wx=n.x/100*WORLD; n.wy=n.y/100*WORLD; } }
  // register AI kingdoms + seeded extra nodes exactly once per page load
  if(!WORLD_REG){
    WORLD_REG=true;
    for(const k of W.kingdoms){
      if(!NODE_BY_ID[k.id]){ const n=akNodeFor(k); NODES.push(n); NODE_BY_ID[k.id]=n; }
    }
    for(const n of (W.extra||[])){
      if(!NODE_BY_ID[n.id]){ n.x=n.wx/WORLD*100; n.y=n.wy/WORLD*100; NODES.push(n); NODE_BY_ID[n.id]=n; }
    }
  } else {
    // refresh live stats (levels grow over time)
    for(const k of W.kingdoms){ const n=NODE_BY_ID[k.id]; if(n&&n.kind==='ak'){ const f=akNodeFor(k); n.garrison=f.garrison; n.loot=f.loot; n.lvl=f.lvl; n.name=f.name; n.tier=f.tier; n.wallMult=f.wallMult; } }
  }
}
function pushFeed(txt){
  const W=S.world; if(!W) return;
  W.feed.unshift({t:Date.now(), txt:txt});
  if(W.feed.length>14) W.feed.length=14;
}
/* Living-world ticker text: varied templates with real numbers, no obvious repeats. */
let _lastEvtIdx=-1;
function worldEventText(k){
  const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  const templates=[
    ()=>`raided a Lv ${ri(2,9)} farm and seized ${fmtN(ri(8,60)*100)} gold`,
    ()=>`drilled ${fmtN(ri(1,9)*100)} fresh spearmen at the barracks`,
    ()=>`hauled ${fmtN(ri(5,40)*100)} stone from the quarries`,
    ()=>`completed a granary expansion`,
    ()=>`raised their banner to level ${k.lvl}`,
    ()=>`cleared a Tier ${ri(2,8)} barbarian camp`,
    ()=>`scouted an unguarded ruin beyond the hills`,
    ()=>`founded a new outpost on the frontier`,
    ()=>`signed a trade pact with a neighboring kingdom`,
    ()=>`offered sacrifice to Ares before a raid`,
    ()=>`their hero ${AK_NAMES[ri(0,AK_NAMES.length-1)]} slew a rival champion in single combat`,
    ()=>`rebuilt ${ri(2,9)} war galleys at the docks`,
  ];
  let i=Math.floor(R()*templates.length);
  if(i===_lastEvtIdx) i=(i+1)%templates.length; // avoid obvious repetition
  _lastEvtIdx=i;
  return '['+k.tag+'] '+k.name+' '+templates[i]();
}
function tickWorld(){
  ensureWorld();
  const W=S.world; if(!W) return;
  W.tick++;
  if(W.aiMarches) for(const am of W.aiMarches){ am.t+=am.sp*10; if(am.t>1) am.t-=1; }
  if(W.tick%10!==0) return; // living-world beat every ~10s
  for(const k of W.kingdoms){
    const rec=S.nodes[k.id];
    if(rec&&rec.cleared) continue; // conquered kingdoms wait to rebuild
    k.power+=Math.round(20+Math.random()*60);
    const nl=Math.min(25, 1+Math.floor(k.power/1500));
    if(nl>k.lvl){
      k.lvl=nl;
      const n=NODE_BY_ID[k.id]; if(n){ const f=akNodeFor(k); n.garrison=f.garrison; n.loot=f.loot; n.lvl=f.lvl; n.tier=f.tier; n.wallMult=f.wallMult; }
      const blv=['raised their banner to level ','fortified their banner to level ','their banner now flies at level '];
      pushFeed('['+k.tag+'] '+k.name+' '+blv[Math.floor(Math.random()*blv.length)]+nl);
    }
  }
  // ambient events
  if(Math.random()<0.4){
    const k=W.kingdoms[Math.floor(Math.random()*W.kingdoms.length)];
    if(k) pushFeed(worldEventText(k));
  }
  if(Math.random()<0.12 && W.kingdoms.length>1){
    const a=W.kingdoms[Math.floor(Math.random()*W.kingdoms.length)];
    let b=W.kingdoms[Math.floor(Math.random()*W.kingdoms.length)];
    if(b!==a) pushFeed('['+a.tag+'] '+a.name+' clashed with ['+b.tag+'] '+b.name+' on the border');
  }
  // conquered kingdoms rebuild after ~6h
  const now=nowMs();
  for(const k of W.kingdoms){
    const rec=S.nodes[k.id];
    if(rec&&rec.cleared&&rec.clearedAt&&now-rec.clearedAt>6*3600*1000){
      delete S.nodes[k.id];
      const n=NODE_BY_ID[k.id]; if(n){ const f=akNodeFor(k); n.garrison=f.garrison; n.loot=f.loot; n.lvl=f.lvl; n.tier=f.tier; }
      pushFeed('['+k.tag+'] '+k.name+' rebuilt their stronghold');
    }
  }
  // living world: territory, rallies, movement intentions, sieges
  tickTerritory(); tickAIRallies(); tickIntentions(); tickSieges();
}

/* ---------------- world-map terrain (pre-rendered once) ---------------- */
let WM_TERRAIN=null;
let WM_GRAIN=null; // small noise tile for a crisp screen-space grain overlay
function buildTerrain(){
  const T=2560, c=document.createElement('canvas'); c.width=T; c.height=T;
  const g=c.getContext('2d'), rnd=mulberry32(WORLD_SEED+7);
  const w2t=T/WORLD;
  // base: teal-green grass (RoK-like)
  g.fillStyle='#2e6b4e'; g.fillRect(0,0,T,T);
  // soft-edged terrain mottling: many small varied patches (no giant lily pads)
  // radii are in terrain-canvas px; ~12-48px canvas reads as ~15-45px on a phone
  function softPatch(x,y,r,col,alpha){
    const sy=0.55+rnd()*0.6, rot=rnd()*Math.PI;
    g.save(); g.translate(x,y); g.rotate(rot); g.scale(1,sy);
    const gr2=g.createRadialGradient(0,0,0,0,0,r);
    gr2.addColorStop(0,col); gr2.addColorStop(0.72,col); gr2.addColorStop(1,'rgba(46,107,78,0)');
    g.globalAlpha=alpha; g.fillStyle=gr2;
    g.beginPath(); g.arc(0,0,r,0,7); g.fill();
    g.restore();
  }
  // mid-tone green variation
  const greens=['#357a58','#2a6146','#3d8560','#316b4c','#458a63','#5f7a48','#4a7a5e','#3f7a66'];
  for(let i=0;i<380;i++){
    softPatch(rnd()*T,rnd()*T,12+rnd()*36,greens[Math.floor(rnd()*greens.length)],0.26+rnd()*0.12);
  }
  // lighter grass clearings
  const lights=['#5a9a72','#6a8a60','#64a078'];
  for(let i=0;i<140;i++){
    softPatch(rnd()*T,rnd()*T,10+rnd()*26,lights[Math.floor(rnd()*lights.length)],0.22+rnd()*0.10);
  }
  // darker soil / shadow patches
  const darks=['#24523c','#1f4a34','#2a5540'];
  for(let i=0;i<120;i++){
    softPatch(rnd()*T,rnd()*T,10+rnd()*28,darks[Math.floor(rnd()*darks.length)],0.22+rnd()*0.10);
  }
  g.globalAlpha=1;
  // dry-grass / scrub / sand patches for tonal variety
  const scrubCols=['#7a8a4a','#8a7a3f','#6b7a3f','#9a8a55','#a08a5a','#7f8a52','#b09a68'];
  for(let i=0;i<170;i++){
    softPatch(rnd()*T,rnd()*T,8+rnd()*22,scrubCols[Math.floor(rnd()*scrubCols.length)],0.30+rnd()*0.12);
  }
  g.globalAlpha=1;
  // fine noise
  g.globalAlpha=0.16;
  for(let i=0;i<14000;i++){
    g.fillStyle=rnd()<0.5?'#1f4a34':'#6aa884';
    g.fillRect(rnd()*T,rnd()*T,2+rnd()*3,2+rnd()*3);
  }
  g.globalAlpha=1;
  // soft dark vignette at the world edge (the known world ends here)
  const vg=g.createRadialGradient(T/2,T/2,T*0.35,T/2,T/2,T*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(10,20,14,0.55)');
  g.fillStyle=vg; g.fillRect(0,0,T,T);
  // a river winding through the west, with sandy banks
  g.lineCap='round';
  g.beginPath(); g.moveTo(0.16*T,0);
  g.bezierCurveTo(0.20*T,0.3*T, 0.10*T,0.55*T, 0.17*T,0.8*T);
  g.strokeStyle='#9a8a5e'; g.lineWidth=44*w2t*10; g.stroke();
  g.strokeStyle='#7a6a45'; g.lineWidth=34*w2t*10; g.stroke();
  g.strokeStyle='#2b5f8a'; g.lineWidth=26*w2t*10; g.stroke();
  g.strokeStyle='#3f88b8'; g.lineWidth=14*w2t*10; g.stroke();
  g.strokeStyle='rgba(255,255,255,0.35)'; g.lineWidth=3*w2t*10; g.stroke();
  // sparkling lake in the east, with a sandy rim
  const lx=0.80*T, ly=0.30*T;
  g.fillStyle='#9a8a5e';
  g.beginPath(); g.ellipse(lx,ly,0.062*T,0.047*T,0.4,0,7); g.fill();
  g.fillStyle='#2b5f8a';
  g.beginPath(); g.ellipse(lx,ly,0.055*T,0.04*T,0.4,0,7); g.fill();
  g.fillStyle='#3f88b8';
  g.beginPath(); g.ellipse(lx,ly,0.042*T,0.03*T,0.4,0,7); g.fill();
  g.strokeStyle='rgba(255,255,255,0.65)'; g.lineWidth=2;
  for(let i=0;i<7;i++){ // highlight ripples
    const rx=lx+(rnd()-0.5)*0.06*T, ry=ly+(rnd()-0.5)*0.045*T, rw=6+rnd()*14;
    g.beginPath(); g.ellipse(rx,ry,rw,rw*0.32,0,0.2,Math.PI-0.2); g.stroke();
  }
  /* ---- realism pass: regional tone, dirt roads, mountain ranges, forest regions ----
     All static: drawn once into WM_TERRAIN, never per frame. */
  function makeValueNoise(cells){
    const gx=cells+1, grid=[];
    for(let i=0;i<gx*gx;i++) grid.push(rnd());
    const sm=t=>t*t*(3-2*t);
    return (x,y)=>{
      const fx=x*cells, fy=y*cells;
      const ix=Math.max(0,Math.min(cells-1,Math.floor(fx))), iy=Math.max(0,Math.min(cells-1,Math.floor(fy)));
      const tx=sm(Math.min(1,Math.max(0,fx-ix))), ty=sm(Math.min(1,Math.max(0,fy-iy)));
      const a=grid[iy*gx+ix], b=grid[iy*gx+ix+1], q=grid[(iy+1)*gx+ix], d=grid[(iy+1)*gx+ix+1];
      return a+(b-a)*tx+(q-a)*ty+(a-b-q+d)*tx*ty;
    };
  }
  const vnA=makeValueNoise(6), vnB=makeValueNoise(13);
  const fbm=(x,y)=>0.7*vnA(x,y)+0.3*vnB(x,y);
  // regional tone: dry olive uplands vs lush lowlands
  for(let i=0;i<120;i++){
    const px=rnd()*T, py=rnd()*T, f=fbm(px/T,py/T);
    const col=f>0.55?'#8a7a42':(f<0.38?'#27573d':'#3f7355');
    softPatch(px,py,60+rnd()*120,col,0.16+rnd()*0.10);
  }
  g.globalAlpha=1;
  // dirt roads linking each kingdom to its nearest neighbor, plus Troy's spokes
  (function roads(){
    const Wd=S&&S.world; if(!Wd||!Wd.kingdoms||!Wd.kingdoms.length) return;
    const pts=Wd.kingdoms.map(k=>({x:k.wx*w2t, y:k.wy*w2t}));
    pts.push({x:WORLD_CX*w2t, y:WORLD_CY*w2t});
    const drawn={};
    function road(a,b){
      const mx=(a.x+b.x)/2+(rnd()-0.5)*60, my=(a.y+b.y)/2+(rnd()-0.5)*60;
      g.lineCap='round';
      g.globalAlpha=0.55; g.strokeStyle='#7d6742'; g.lineWidth=9;
      g.beginPath(); g.moveTo(a.x,a.y); g.quadraticCurveTo(mx,my,b.x,b.y); g.stroke();
      g.globalAlpha=0.5; g.strokeStyle='#a68d5f'; g.lineWidth=5; g.stroke();
      g.globalAlpha=1;
    }
    for(let i=0;i<pts.length;i++){
      let best=-1, bd=1e18;
      for(let j=0;j<pts.length;j++){ if(i===j) continue;
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=dx*dx+dy*dy;
        if(d<bd){bd=d;best=j;} }
      const key=Math.min(i,best)+'-'+Math.max(i,best);
      if(best>=0&&!drawn[key]){ drawn[key]=1; road(pts[i],pts[best]); }
    }
  })();
  // mountain ranges: barren apron + layered sunlit/shadow facets + pale caps
  function mountainRange(x0,y0,x1,y1,peaks,base){
    for(let i=0;i<=peaks;i++){
      const px=x0+(x1-x0)*i/peaks, py=y0+(y1-y0)*i/peaks;
      softPatch(px,py,base*2.2,'#5c5c54',0.5);
    }
    g.globalAlpha=1;
    for(let i=0;i<peaks;i++){
      const tm=(i+0.5)/peaks;
      const ax=x0+(x1-x0)*i/peaks, ay=y0+(y1-y0)*i/peaks;
      const bx=x0+(x1-x0)*(i+1)/peaks, by=y0+(y1-y0)*(i+1)/peaks;
      const mx=x0+(x1-x0)*tm, my=y0+(y1-y0)*tm;
      const h=base*(1.5+rnd()*1.1);
      g.fillStyle='#33373d'; // shadow (right) facet
      g.beginPath(); g.moveTo(ax,ay+base*0.4); g.lineTo(mx,my-h); g.lineTo(bx,by+base*0.4); g.closePath(); g.fill();
      g.fillStyle='#6e747b'; // sunlit (left) facet
      g.beginPath(); g.moveTo(ax,ay+base*0.4); g.lineTo(mx,my-h); g.lineTo(mx,my+base*0.4); g.closePath(); g.fill();
      const ch=h*0.38; // pale rocky cap
      g.fillStyle='#cfc9b8';
      g.beginPath(); g.moveTo(mx-ch*0.55,my-h+ch); g.lineTo(mx,my-h); g.lineTo(mx+ch*0.55,my-h+ch);
      g.lineTo(mx+ch*0.2,my-h+ch*1.25); g.lineTo(mx-ch*0.28,my-h+ch*1.1); g.closePath(); g.fill();
      g.fillStyle='rgba(255,255,255,0.5)'; // snow glint
      g.beginPath(); g.moveTo(mx-ch*0.3,my-h+ch*0.55); g.lineTo(mx,my-h+ch*0.15); g.lineTo(mx-ch*0.05,my-h+ch*0.6); g.closePath(); g.fill();
    }
  }
  mountainRange(0.30*T,0.14*T, 0.70*T,0.08*T, 9, 85);   // northern range
  mountainRange(0.64*T,0.78*T, 0.96*T,0.94*T, 7, 80);   // south-east range
  // forest regions: dark understory + individually shaded trees
  const MTNZ=[{x0:0.28*T,y0:0.02*T,x1:0.72*T,y1:0.24*T},{x0:0.58*T,y0:0.68*T,x1:0.98*T,y1:0.98*T}];
  function inMtn(x,y){
    for(const m of MTNZ){ if(x>m.x0-40&&x<m.x1+40&&y>m.y0-40&&y<m.y1+40) return true; }
    return false;
  }
  let fPlaced=0, fGuard=0;
  while(fPlaced<14&&fGuard++<200){
    const fx=rnd()*T, fy=rnd()*T;
    if(fx>0.05*T&&fx<0.25*T) continue;                  // river band
    if(Math.hypot(fx-0.80*T,fy-0.30*T)<0.15*T) continue; // lake
    if(inMtn(fx,fy)) continue;                          // mountains
    if(Math.hypot(fx-T/2,fy-T/2)<0.10*T) continue;      // keep Troy's vale clear
    fPlaced++;
    const fr=90+rnd()*130;
    g.globalAlpha=0.5; g.fillStyle='#1e4a33';
    g.beginPath(); g.ellipse(fx,fy,fr,fr*0.8,rnd()*3,0,7); g.fill();
    g.globalAlpha=1;
    const ntr=60+Math.floor(rnd()*70);
    const tcols=['#1c5c40','#237052','#2a805f'];
    for(let j=0;j<ntr;j++){
      const a=rnd()*Math.PI*2, rad=Math.sqrt(rnd())*fr;
      const x=fx+Math.cos(a)*rad, y=fy+Math.sin(a)*rad*0.8;
      const r=4.5+rnd()*6;
      g.fillStyle='rgba(0,0,0,0.22)';
      g.beginPath(); g.ellipse(x+r*0.2,y+r*0.75,r*0.95,r*0.4,0,0,7); g.fill();
      g.fillStyle='#3d2b1c'; g.fillRect(x-1.3,y+r*0.25,2.6,r*0.75); // trunk
      for(let b=0;b<3;b++){
        const bx=x+(rnd()-0.5)*r, by=y+(rnd()-0.5)*r*0.8, br=r*(0.55+rnd()*0.3);
        g.fillStyle=tcols[(fPlaced+j+b)%3];
        g.beginPath(); g.arc(bx,by,br,0,7); g.fill();
      }
      g.fillStyle='rgba(200,240,210,0.45)'; // sunlit crown
      g.beginPath(); g.arc(x-r*0.25,y-r*0.32,r*0.34,0,7); g.fill();
      g.strokeStyle='rgba(10,40,25,0.55)'; g.lineWidth=1.2;
      g.beginPath(); g.arc(x,y,r*0.95,0,7); g.stroke();
    }
  }
  // purple wildflower patches
  for(let i=0;i<26;i++){
    const cx=rnd()*T, cy=rnd()*T, cr=(20+rnd()*45)*w2t*10;
    for(let j=0;j<26;j++){
      const a=rnd()*Math.PI*2, rr2=Math.sqrt(rnd())*cr;
      g.fillStyle=['#b48ad8','#9a6fc0','#c9a8e8'][Math.floor(rnd()*3)];
      g.beginPath(); g.arc(cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2,1.6+rnd()*1.8,0,7); g.fill();
    }
  }
  // (scattered lollipop tree grid removed — forests now live only in the dedicated
  // forest zones above, so the open land reads as open pasture instead of a grid)
  g.globalAlpha=1;
  // gray rock clusters with dark base outline + pale top facet
  for(let i=0;i<150;i++){
    const x=rnd()*T, y=rnd()*T, nr=2+Math.floor(rnd()*3);
    for(let j=0;j<nr;j++){
      const rx=x+(rnd()-0.5)*16, ry=y+(rnd()-0.5)*12, rs=3+rnd()*4.5;
      g.fillStyle='#4c4f52';
      g.beginPath();
      g.moveTo(rx-rs*1.1,ry+rs*0.7); g.lineTo(rx-rs*0.3,ry-rs*0.9);
      g.lineTo(rx+rs*0.8,ry-rs*0.45); g.lineTo(rx+rs*1.1,ry+rs*0.7);
      g.closePath(); g.fill();
      g.fillStyle=['#8a8d90','#6f7276','#a3a6a9'][Math.floor(rnd()*3)];
      g.beginPath();
      g.moveTo(rx-rs,ry+rs*0.6); g.lineTo(rx-rs*0.3,ry-rs*0.8);
      g.lineTo(rx+rs*0.7,ry-rs*0.4); g.lineTo(rx+rs,ry+rs*0.6);
      g.closePath(); g.fill();
      g.fillStyle='rgba(255,255,255,0.32)';
      g.beginPath(); g.moveTo(rx-rs*0.3,ry-rs*0.8); g.lineTo(rx+rs*0.1,ry-rs*0.5); g.lineTo(rx-rs*0.1,ry-rs*0.2); g.closePath(); g.fill();
    }
  }
  // stamp grass clearings under every entity so nothing sits on water
  function clearing(wx,wy,r){
    const x=wx*w2t, y=wy*w2t, rr2=r*w2t;
    g.globalAlpha=0.5;
    g.fillStyle='#3d8560';
    g.beginPath(); g.ellipse(x,y,rr2*1.25,rr2,0,0,7); g.fill();
    g.globalAlpha=0.55;
    g.beginPath(); g.ellipse(x,y,rr2,rr2*0.8,0,0,7); g.fill();
    g.globalAlpha=1;
  }
  clearing(WORLD_CX,WORLD_CY,300);
  const W=S&&S.world;
  if(W){ for(const k of W.kingdoms) clearing(k.wx,k.wy,210); }
  for(const n of NODES){ if(n.wx!==undefined) clearing(n.wx,n.wy,n.kind==='gather'?120:150); }
  // fine grain tile for a crisp screen-space overlay (built once)
  if(!WM_GRAIN){
    const gt=document.createElement('canvas'); gt.width=gt.height=128;
    const gg=gt.getContext('2d'), gr=mulberry32(1234567);
    const id=gg.createImageData(128,128);
    for(let i=0;i<id.data.length;i+=4){
      const v=gr()<0.5?0:255;
      id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v; id.data[i+3]=Math.floor(gr()*26);
    }
    gg.putImageData(id,0,0);
    WM_GRAIN=gt;
  }
  WM_TERRAIN=c;
}

/* ---------------- world-map canvas art (no emoji) ----------------
   All markers drawn with paths in the bronze-age palette. */
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
/* Walled town with stone coursing, shaded towers, terracotta roofs, columned keep
   and alliance pennants. s = half-size in px.
   o: {dark, ruined, tag (alliance tag -> roof tint), lvl, roof (override color)} */
function drawCityIcon(c,x,y,s,o){
  o=o||{};
  const roof=o.roof||(o.tag&&TAG_COLORS[o.tag])||BRONZE;
  const wall=o.dark?'#2b2013':'#6b5136', trim=o.dark?'#4a3320':BRONZE_D;
  const terra=o.dark?'#5e3a24':'#a85f33'; // terracotta roof tiles
  const big=(o.lvl||1)>=15;
  // layered ground shadow
  c.fillStyle='rgba(0,0,0,0.16)';
  c.beginPath(); c.ellipse(x,y+s*1.02,s*1.25,s*0.42,0,0,7); c.fill();
  c.fillStyle='rgba(0,0,0,0.22)';
  c.beginPath(); c.ellipse(x,y+s*0.95,s*1.05,s*0.34,0,0,7); c.fill();
  // outer wall ring with stone coursing
  c.fillStyle=wall;
  rr(c,x-s,y-s*0.85,s*2,s*1.7,s*0.28); c.fill();
  c.strokeStyle='rgba(0,0,0,0.35)'; c.lineWidth=1;
  for(let bi=1;bi<=3;bi++){
    const by=y-s*0.85+(s*1.7)*bi/4;
    c.beginPath(); c.moveTo(x-s*0.92,by); c.lineTo(x+s*0.92,by); c.stroke();
  }
  c.strokeStyle='rgba(255,235,200,0.25)'; c.lineWidth=Math.max(1,s*0.05);
  rr(c,x-s+2,y-s*0.85+2,s*2-4,s*0.5,s*0.2); c.stroke(); // sunlit top edge
  c.lineWidth=Math.max(1.5,s*0.09); c.strokeStyle=trim;
  rr(c,x-s,y-s*0.85,s*2,s*1.7,s*0.28); c.stroke();
  // crenellations along the wall top
  c.fillStyle=trim;
  const n=7, cw=(s*2)/n;
  for(let i=0;i<n;i++) c.fillRect(x-s+i*cw+cw*0.22, y-s*0.85-s*0.24, cw*0.56, s*0.24);
  // corner towers: shaded drums, cap bands, terracotta cones, finials, arrow slits
  for(const sx of [-s*0.92,s*0.92]) for(const sy of [-s*0.78,s*0.78]){
    c.fillStyle=wall; c.fillRect(x+sx-s*0.16,y+sy-s*0.3,s*0.32,s*0.6);
    c.fillStyle='rgba(0,0,0,0.25)'; c.fillRect(x+sx+s*0.04,y+sy-s*0.3,s*0.12,s*0.6);
    c.fillStyle=trim; c.fillRect(x+sx-s*0.16,y+sy-s*0.38,s*0.32,s*0.1);
    c.fillStyle=terra;
    c.beginPath(); c.moveTo(x+sx-s*0.22,y+sy-s*0.36);
    c.lineTo(x+sx,y+sy-s*0.72); c.lineTo(x+sx+s*0.22,y+sy-s*0.36);
    c.closePath(); c.fill();
    c.strokeStyle='rgba(0,0,0,0.3)'; c.lineWidth=1; c.stroke();
    c.fillStyle=GOLD_L; c.beginPath(); c.arc(x+sx,y+sy-s*0.76,s*0.05,0,7); c.fill();
    c.fillStyle='#120c06'; c.fillRect(x+sx-s*0.05,y+sy-s*0.12,s*0.1,s*0.16);
  }
  // inner houses with varied pitched roofs
  function house(hx,hy,hs,roofC){
    c.fillStyle=o.dark?'#241a0e':'#6e5132';
    c.fillRect(x+hx-hs*0.5,y+hy-hs*0.35,hs,hs*0.7);
    c.fillStyle='rgba(0,0,0,0.2)'; c.fillRect(x+hx+hs*0.2,y+hy-hs*0.35,hs*0.3,hs*0.7);
    c.fillStyle=roofC;
    c.beginPath(); c.moveTo(x+hx-hs*0.62,y+hy-hs*0.35);
    c.lineTo(x+hx,y+hy-hs*0.95); c.lineTo(x+hx+hs*0.62,y+hy-hs*0.35);
    c.closePath(); c.fill();

  }
  house(-s*0.42,s*0.28,s*0.62,terra);

  for(let ci=-1;ci<=1;ci++) c.fillRect(x+ci*s*0.14-s*0.03,y-s*0.7,s*0.06,s*1.0);
  c.fillStyle=roof;
  c.beginPath(); c.moveTo(x-s*0.34,y-s*0.75);
  c.lineTo(x,y-s*1.25); c.lineTo(x+s*0.34,y-s*0.75);
  c.closePath(); c.fill();
  c.strokeStyle='rgba(0,0,0,0.3)'; c.lineWidth=1; c.stroke();
  c.strokeStyle='#2a1c10'; c.lineWidth=Math.max(1.5,s*0.07);
  c.beginPath(); c.moveTo(x,y-s*1.25); c.lineTo(x,y-s*1.62); c.stroke();
  c.fillStyle=roof; // swallowtail banner in alliance color
  c.beginPath(); c.moveTo(x,y-s*1.62);

  c.closePath(); c.fill();
  const tx2=x+s*0.92; // small terracotta pennant on a corner tower
  c.strokeStyle='#2a1c10'; c.lineWidth=Math.max(1,s*0.05);
  c.beginPath(); c.moveTo(tx2,y-s*1.5); c.lineTo(tx2,y-s*1.78); c.stroke();
  c.fillStyle=terra;
  c.beginPath(); c.moveTo(tx2,y-s*1.78); c.lineTo(tx2+s*0.3,y-s*1.72); c.lineTo(tx2,y-s*1.64); c.closePath(); c.fill();
  // gate: arch + portcullis
  c.fillStyle='#120c06';

/* Resource node sprites: tilled farm field / pine copse + stump / rock pile / mine entrance */

/* Drifting cloud shadows, water shimmer, faint edge mist — dynamic atmosphere layer.
   Cheap per-frame draws only; all heavy terrain stays in the cached static layer. */
function drawAtmosphere(c,W,H,t,now){
  if(!W||!H) return;
  // drifting cloud shadows
  c.fillStyle='rgba(15,25,20,0.08)';
  for(let i=0;i<4;i++){
    const cw2=W*(0.30+0.05*((i*37)%10)/10);
    const cx=((t*0.9+i*W*0.41)%(W+cw2*2))-cw2;
    const cy=H*(0.18+0.21*i)+Math.sin(t/90+i*2)*14;
    c.beginPath(); c.ellipse(cx,cy,cw2,cw2*0.32,0.15*Math.sin(i),0,7); c.fill();
  }
  // water shimmer on the river + lake (river bezier matches the static layer)
  function shimmer(wx,wy,ph){
    const p=w2s(wx,wy);
    if(p.x<-20||p.x>W+20||p.y<-20||p.y>H+20) return;
    c.strokeStyle='rgba(255,255,255,'+(0.22+0.18*Math.sin(now/600+ph)).toFixed(3)+')';
    c.lineWidth=2;
    c.beginPath(); c.ellipse(p.x,p.y,7+3*Math.sin(now/700+ph),2.4,0,0.15,Math.PI-0.15); c.stroke();
  }
  const bp=[[0.16,0],[0.20,0.30],[0.10,0.55],[0.17,0.80]], T=2560, w2t=T/WORLD;
  for(let i=0;i<6;i++){
    const u=0.12+i*0.14, iu=1-u;
    const bx=iu*iu*iu*bp[0][0]+3*iu*iu*u*bp[1][0]+3*iu*u*u*bp[2][0]+u*u*u*bp[3][0];
    const by=iu*iu*iu*bp[0][1]+3*iu*iu*u*bp[1][1]+3*iu*u*u*bp[2][1]+u*u*u*bp[3][1];
    shimmer(bx*T/w2t, by*T/w2t, i*1.3);
  }
  shimmer(0.80*WORLD, 0.30*WORLD, 2.1);
  shimmer(0.815*WORLD, 0.315*WORLD, 4.4);
  // faint mist at the map edges
  const mg=c.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,Math.max(W,H)*0.75);
  mg.addColorStop(0,'rgba(220,230,225,0)');
  mg.addColorStop(1,'rgba(220,230,225,'+(0.05+0.02*Math.sin(now/3000)).toFixed(3)+')');
  c.fillStyle=mg; c.fillRect(0,0,W,H);
}

/* ---------------- world-map camera, input & renderer ---------------- */
let WMAP=null;
function w2s(wx,wy){ // world -> screen
  const m=WMAP, r=m.canvas.getBoundingClientRect();
  return {x:(wx-m.cam.x)*m.cam.z+r.width/2, y:(wy-m.cam.y)*m.cam.z+r.height/2};
}
function s2w(sx,sy){ // screen -> world
  const m=WMAP, r=m.canvas.getBoundingClientRect();
  return {x:(sx-r.width/2)/m.cam.z+m.cam.x, y:(sy-r.height/2)/m.cam.z+m.cam.y};
}

  if(WMAP.sel && $('#wm-sheet') && $('#wm-sheet').classList.contains('open')){
    const sh=sheetHTML(WMAP.sel);
    if(sh) $('#wm-sheet').innerHTML=sh; else $('#wm-sheet').classList.remove('open');
  }
  drawWorld();
}
function initWorldMap(){
  const cv=$('#worldmap');
  WMAP={canvas:cv, ctx:cv.getContext('2d'), cam:{x:WORLD_CX,y:WORLD_CY,z:0.35},
        pointers:{}, pinchD:0, downAt:0, downXY:null, moved:false, drawn:[], sel:null, t:0, placing:null};
  if(!WMAP.repaint) WMAP.repaint=setInterval(()=>{ if(UI.tab==='map'&&!document.hidden) drawWorld(); },900);
  if(!WM_TERRAIN) buildTerrain();
  sizeWorldCanvas();
  // paint custom mini resource icons into the top bar (drawn, not emoji)
  document.querySelectorAll('#wm-resbar .wm-ric').forEach(cv=>{
    const g=cv.getContext('2d');
    g.clearRect(0,0,20,20);
    drawResIcon(g, cv.getAttribute('data-res'), 10, 11, 5.5);
  });
  window.addEventListener('resize', sizeWorldCanvas);
  cv.addEventListener('pointerdown', e=>{
    try{ cv.setPointerCapture(e.pointerId); }catch(_){/* synthetic/no-pointer edge */}
    WMAP.pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    WMAP.downAt=Date.now(); WMAP.downXY={x:e.clientX,y:e.clientY}; WMAP.moved=false;
    const ks=Object.keys(WMAP.pointers);
    if(ks.length===2){
      const a=WMAP.pointers[ks[0]], b=WMAP.pointers[ks[1]];
      WMAP.pinchD=Math.hypot(a.x-b.x,a.y-b.y);
    }
  });
  cv.addEventListener('pointermove', e=>{
    const p=WMAP.pointers[e.pointerId]; if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    p.x=e.clientX; p.y=e.clientY;
    const ks=Object.keys(WMAP.pointers);
    if(ks.length===2){
      const a=WMAP.pointers[ks[0]], b=WMAP.pointers[ks[1]];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(WMAP.pinchD>0){
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        zoomAt(mx,my,d/WMAP.pinchD);
      }
      WMAP.pinchD=d; WMAP.moved=true;
    } else if(ks.length===1){
      if(Math.abs(e.clientX-WMAP.downXY.x)+Math.abs(e.clientY-WMAP.downXY.y)>8) WMAP.moved=true;
      WMAP.cam.x-=dx/WMAP.cam.z; WMAP.cam.y-=dy/WMAP.cam.z;
      clampCam();
    }
    drawWorld();
  });
  function endPointer(e){
    const wasTap=!WMAP.moved && (Date.now()-WMAP.downAt)<400;
    delete WMAP.pointers[e.pointerId];
    if(Object.keys(WMAP.pointers).length<2) WMAP.pinchD=0;
    if(wasTap && e.type==='pointerup'){
      const r=cv.getBoundingClientRect();
      worldTap(e.clientX-r.left, e.clientY-r.top);
    }
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('wheel', e=>{
    e.preventDefault();
    const r=cv.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.15:0.87);
    drawWorld();
  }, {passive:false});
}
function sizeWorldCanvas(){
  if(!WMAP) return;
  const cv=WMAP.canvas, r=cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(50,r.width*dpr); cv.height=Math.max(50,r.height*dpr);
  drawWorld();
}
function clampCam(){
  const m=WMAP.cam;
  m.z=Math.max(0.10,Math.min(3,m.z));
  m.x=Math.max(-600,Math.min(WORLD+600,m.x));
  m.y=Math.max(-600,Math.min(WORLD+600,m.y));
}
function zoomAt(sx,sy,f){
  const m=WMAP, before=s2w(sx,sy);
  m.cam.z*=f; clampCam();
  const after=s2w(sx,sy);
  m.cam.x+=before.x-after.x; m.cam.y+=before.y-after.y;
  clampCam();
}
function worldTap(sx,sy){
  if(WMAP.placing==='outpost'){
    const w=s2w(sx,sy); WMAP.placing=null;
    confirmOutpost(Math.max(200,Math.min(WORLD-200,Math.round(w.x))), Math.max(200,Math.min(WORLD-200,Math.round(w.y))));
    drawWorld(); return;
  }
  let best=null, bd=40;
  for(const e of WMAP.drawn){
    const d=Math.hypot(e.sx-sx,e.sy-sy);
    if(d<bd){ bd=d; best=e; }
  }
  selectWorldEntity(best?best.id:null);
}
/* Ambient AI armies: tiny war-bands drifting between kingdoms on dotted paths */
function drawAIMarches(c){
  const W=S.world; if(!W||!W.aiMarches) return;
  const kb={}; for(const k of W.kingdoms) kb[k.id]=k;
  for(const am of W.aiMarches){
    const a=kb[am.a], b=kb[am.b]; if(!a||!b) continue;
    const pa=w2s(a.wx,a.wy), pb=w2s(b.wx,b.wy);
    const r=WMAP.canvas.getBoundingClientRect();
    if((pa.x<-80&&pb.x<-80)||(pa.x>r.width+80&&pb.x>r.width+80)||
       (pa.y<-80&&pb.y<-80)||(pa.y>r.height+80&&pb.y>r.height+80)) continue;
    c.strokeStyle='rgba(200,170,120,0.30)'; c.lineWidth=1.5; c.setLineDash([4,7]);
    c.beginPath(); c.moveTo(pa.x,pa.y); c.lineTo(pb.x,pb.y); c.stroke(); c.setLineDash([]);
    const x=pa.x+(pb.x-pa.x)*am.t, y=pa.y+(pb.y-pa.y)*am.t;
    // tiny troop cluster: three bronze helmets
    for(let i=0;i<3;i++){
      const ox=(i-1)*5, oy=(i%2)*4;
      c.fillStyle='#6e4a22'; c.beginPath(); c.arc(x+ox,y+oy,3.4,0,7); c.fill();
      c.fillStyle=GOLD; c.beginPath(); c.arc(x+ox,y+oy,1.4,0,7); c.fill();
    }
  }
}
/* Player march lines + marching war-band / gather camp (RoK-style gathering visuals) */
function drawWarBand(c,x,y,ang,cargo,now){
  c.save(); c.translate(x,y); c.rotate(ang);
  c.fillStyle='rgba(0,0,0,0.25)'; c.beginPath(); c.ellipse(0,2.5,10,3.6,0,0,7); c.fill();

  c.strokeStyle='#5e3a1a'; c.lineWidth=2;
  c.beginPath(); c.moveTo(-7,-2); c.lineTo(-7,-17); c.stroke();

  c.fillStyle='#7a1f1f';
  c.beginPath(); c.moveTo(-7,-17); c.lineTo(2,-15.5+wv); c.lineTo(-1,-13.6+wv*0.5);
  c.lineTo(2,-11.8); c.lineTo(-7,-10.2); c.closePath(); c.fill();
  c.fillStyle='#e8c86a'; c.fillRect(-7,-17,1.6,1.6);

    c.fillStyle='#d8d8d8'; c.beginPath(); c.arc(mx+1.7,my-7.6,1.1,0,7); c.fill();

    // helmet with red crest
    c.fillStyle='#8a6a2a'; c.beginPath(); c.arc(mx,my-1.2,2.2,Math.PI,0); c.fill();

    // round shield
    c.fillStyle='#7a1f1f'; c.beginPath(); c.arc(mx-2.6,my+0.8,2.1,0,7); c.fill();

  }
  if(cargo){

    c.strokeStyle='#7a5a22'; c.lineWidth=1; c.beginPath(); c.ellipse(6.5,-2,3.2,3.8,0.35,0,7); c.stroke();
    c.strokeStyle='#7a5a22'; c.beginPath(); c.moveTo(4,-4.4); c.lineTo(9,-0.6); c.stroke();
  }
  c.restore();
}
/* Gather camp deployed at the node while troops work it: tent, banner, barrels,

function drawMarches(c,now){
  for(const m of S.marches){
    const n=NODE_BY_ID[m.nodeId]; if(!n||n.wx===undefined) continue;
    const a=w2s(WORLD_CX,WORLD_CY), b=w2s(n.wx,n.wy);
    // glowing objective ring at the target (all phases)
    const pr=13+Math.sin(now/300)*3;
    c.strokeStyle='rgba(232,200,106,0.9)'; c.lineWidth=3;
    c.beginPath(); c.arc(b.x,b.y,pr,0,7); c.stroke();
    c.strokeStyle='rgba(232,200,106,0.35)'; c.lineWidth=7;
    c.beginPath(); c.arc(b.x,b.y,pr,0,7); c.stroke();
    const km=Math.max(1,Math.round(Math.hypot(n.wx-WORLD_CX,n.wy-WORLD_CY)/600));
    if(m.phase==='gather'){
      // troops are on site: draw the camp with live progress, no march line
      const total=GATHER_TIME*gatherTimeMult(m.hero)*1000;
      const left=Math.max(0,m.gatherAt-now);
      drawGatherCamp(c,b.x,b.y-6,1-left/total,left/1000,now);
      drawGatherWorkers(c,b.x,b.y-6,now,left/1000,m.hero);
      continue;
    }
    let t=0.5, ang=0;
    if(m.phase==='out'){ t=1-Math.max(0,(m.arriveAt-now)/(m.marchSecs*1000)); ang=Math.atan2(b.y-a.y,b.x-a.x); }
    else if(m.phase==='back'){ t=Math.max(0,(m.returnAt-now)/(m.marchSecs*1000)); ang=Math.atan2(a.y-b.y,a.x-b.x); }
    t=Math.max(0,Math.min(1,t));
    c.strokeStyle='rgba(232,200,106,0.55)'; c.lineWidth=2; c.setLineDash([7,6]);
    c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); c.setLineDash([]);
    // distance label at the path midpoint, RoK-style
    drawPlaque(c,(a.x+b.x)/2,(a.y+b.y)/2-16,km+' KM',{fs:10});
    const x=a.x+(b.x-a.x)*t, y=a.y+(b.y-a.y)*t;
    drawWarBand(c,x,y,ang,m.phase==='back',now);
    drawMarchMedallion(c,x,y-32,m);
  }
}
/* Edge-docked march queue: medallion chips + live MM:SS countdowns + phase.
   Gathering becomes a monitored background process — refreshed every map repaint. */
function updateMarchQueue(){
  const q=$('#march-queue'); if(!q) return;
  if(UI.tab!=='map'||!S.marches.length){ q.innerHTML=''; q.style.display='none'; return; }
  q.style.display='flex';
  const now=nowMs();
  q.innerHTML=S.marches.map(m=>{
    const n=NODE_BY_ID[m.nodeId]; if(!n) return '';
    let left=0, phase='';
    if(m.phase==='out'){ left=Math.max(0,(m.arriveAt-now)/1000); phase='Marching'; }
    else if(m.phase==='gather'){ left=Math.max(0,(m.gatherAt-now)/1000); phase='Gathering'; }
    else { left=Math.max(0,(m.returnAt-now)/1000); phase='Returning'; }
    const hero=m.hero&&HEROES[m.hero]?HEROES[m.hero].name[0]:'⚔';
    const load=m.cargo?(' +'+fmtN(Object.values(m.cargo)[0]||0)):('');
    return '<div class="mq-row" onclick="Game.wmSelect(\''+m.nodeId+'\')">'+
      '<div class="mq-medal">'+esc(hero)+'</div>'+
      '<div class="mq-info"><div class="mq-name">'+esc(n.name)+'</div>'+
      '<div class="mq-sub">'+phase+' · <b>'+fmtT(left)+'</b>'+load+'</div></div></div>';
  }).join('');
}
/* Bronze hero medallion floating over our marching armies: Theron's crested helm
   + depleting HP ring. Readable at any zoom — the army's identity anchor. */
function drawMarchMedallion(c,x,y,m){
  let frac=1;
  if(m.phase==='back'&&m.survivors){
    const hp0=TROOP_ORDER.reduce((s,t)=>s+Math.floor(m.troops[t]||0)*TROOPS[t].hp,0);
    const hp1=TROOP_ORDER.reduce((s,t)=>s+Math.floor(m.survivors[t]||0)*TROOPS[t].hp,0);
    frac=hp0>0?Math.max(0,Math.min(1,hp1/hp0)):1;
  }
  c.save();
  c.fillStyle='rgba(0,0,0,0.3)'; c.beginPath(); c.arc(x,y+1.5,11,0,7); c.fill();
  // bronze medallion
  const g=c.createRadialGradient(x-3,y-4,2,x,y,11);
  g.addColorStop(0,'#e8c86a'); g.addColorStop(1,'#8a6d3f');
  c.fillStyle=g; c.beginPath(); c.arc(x,y,10,0,7); c.fill();
  c.strokeStyle='#5e3a1a'; c.lineWidth=2; c.beginPath(); c.arc(x,y,10,0,7); c.stroke();
  // Theron's crested helm glyph
  c.fillStyle='#5e3a1a';
  c.beginPath(); c.arc(x,y+1,4.6,Math.PI,0); c.fill();
  c.fillRect(x-4.6,y+0.4,9.2,2.4);
  c.fillStyle='#7a1f1f'; c.fillRect(x-1.2,y-6.4,2.4,5.4);
  // depleting HP ring
  const ringC=frac>0.5?'#7fd47f':(frac>0.25?'#e8c86a':'#d9534f');
  c.strokeStyle='rgba(0,0,0,0.45)'; c.lineWidth=3;
  c.beginPath(); c.arc(x,y,12.5,0,7); c.stroke();
  c.strokeStyle=ringC; c.lineWidth=3; c.lineCap='round';
  c.beginPath(); c.arc(x,y,12.5,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); c.stroke();
  c.lineCap='butt';
  c.restore();
}
/* Living diorama at a gather site: pulsing work-radius ring, worker sprites with
   baskets walking short loops, floating countdown chip above the camp. */
function drawGatherWorkers(c,bx,by,now,secsLeft,heroId){

  c.setLineDash([6,7]); c.lineDashOffset=-now/40;
  c.beginPath(); c.arc(bx,by+4,48,0,7); c.stroke(); c.setLineDash([]);

    c.fillStyle='rgba(0,0,0,0.22)'; c.beginPath(); c.ellipse(wx,wy+5,4,1.8,0,0,7); c.fill();
    c.fillStyle='#a8843e'; c.beginPath(); c.arc(wx,wy-bob,3.4,0,7); c.fill();       // tunic
    c.fillStyle='#e8c896'; c.beginPath(); c.arc(wx,wy-5.4-bob,2.2,0,7); c.fill();   // head
    c.fillStyle='#7a5a22'; c.fillRect(wx-3.4,wy-7.6-bob,6.8,1.6);                     // headband
    c.fillStyle='#c9a86a';                                                          // basket
    c.beginPath(); c.moveTo(wx+2,wy-2-bob); c.lineTo(wx+7.5,wy-2-bob);
    c.lineTo(wx+6.4,wy+3.4-bob); c.lineTo(wx+3.1,wy+3.4-bob); c.closePath(); c.fill();
    c.strokeStyle='#7a5a22'; c.lineWidth=0.8; c.stroke();

}
function drawWorld(){
  if(!WMAP||!$('#worldmap')) return;
  const m=WMAP, cv=m.canvas, c=m.ctx, now=nowMs();
  m.t++;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  // keep the backing store in sync with the CSS size (flex layout can resize it)
  const br=cv.getBoundingClientRect();
  if(Math.abs(cv.width-br.width*dpr)>4||Math.abs(cv.height-br.height*dpr)>4) sizeWorldCanvas();
  const W=cv.width/dpr, H=cv.height/dpr;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,W,H);
  // terrain: blit visible world rect from pre-rendered canvas
  const T=WM_TERRAIN, tw=T.width, w2t=tw/WORLD;
  const vx0=m.cam.x-W/2/m.cam.z, vy0=m.cam.y-H/2/m.cam.z;
  const vx1=m.cam.x+W/2/m.cam.z, vy1=m.cam.y+H/2/m.cam.z;
  c.imageSmoothingEnabled=true;
  c.drawImage(T, Math.max(0,vx0)*w2t, Math.max(0,vy0)*w2t,
    (Math.min(WORLD,vx1)-Math.max(0,vx0))*w2t, (Math.min(WORLD,vy1)-Math.max(0,vy0))*w2t,
    (Math.max(0,vx0)-vx0)*m.cam.z, (Math.max(0,vy0)-vy0)*m.cam.z,
    (Math.min(WORLD,vx1)-Math.max(0,vx0))*m.cam.z, (Math.min(WORLD,vy1)-Math.max(0,vy0))*m.cam.z);
  // crisp screen-space grain over the terrain (kills the blurry-gradient look)
  if(WM_GRAIN){
    c.save(); c.globalAlpha=0.5;
    c.fillStyle=c.createPattern(WM_GRAIN,'repeat');
    c.fillRect(0,0,W,H);
    c.restore();
  }
  m.drawn=[];
  const vis=(wx,wy,pad)=> wx>vx0-pad&&wx<vx1+pad&&wy>vy0-pad&&wy<vy1+pad;
  const z=m.cam.z, lbl=z>0.16;
  // living territory under everything; movement intentions above it
  drawTerritory(c);
  drawIntentions(c,now);
  const kfs=Math.max(8,Math.min(13,30*z)); // kingdom banner font: always readable, never hidden
  // resource / camp / ruin / city nodes
  for(const n of NODES){
    if(n.wx===undefined||n.kind==='ak') continue;
    if(!vis(n.wx,n.wy,120)) continue;
    const p=w2s(n.wx,n.wy), s=Math.max(7,Math.min(22,13*z+4));
    const cleared=S.nodes[n.id]&&S.nodes[n.id].cleared;
    c.globalAlpha=cleared?0.45:1;
    if(n.kind==='gather') drawResIcon(c,n.res,p.x,p.y,s);
    else if(n.kind==='camp') drawCampIcon(c,p.x,p.y,s,{});
    else if(n.kind==='ruin') drawRuinIcon(c,p.x,p.y,s,{});
    else if(n.kind==='boss'){ drawCityIcon(c,p.x,p.y,s*1.15,{dark:true}); }
    else drawCityIcon(c,p.x,p.y,s,{});
    c.globalAlpha=1;
    if(lbl){
      const ty=p.y-s*2.1;
      const nfs=Math.max(9,Math.min(12,10*z+3));
      const nplq=drawPlaque(c,p.x,ty,n.name,{fs:nfs});
      if(n.tier){
        const bw2=Math.max(7,Math.min(11,8*z+2)); // badge hangs below the plaque with a real gap
        drawLevelBadge(c,p.x,ty+nplq.h/2+bw2*1.12+6,n.tier,bw2);
      }
    }
    // battle scars on attacked (not yet cleared) nodes: smoke -> fire -> burning
    const nrec=S.nodes[n.id];
    if(nrec&&nrec.dmg&&!cleared&&n.kind!=='gather') drawSiegeFire(c,p.x,p.y,s,Math.min(3,nrec.dmg),now);
    m.drawn.push({id:n.id,sx:p.x,sy:p.y});
  }
  // AI kingdoms — banners ALWAYS visible, the single most important RoK cue.
  // Far zoom-out: small keep icon + compact rectangular pill, no level shield.
  // Closer zoom: full walled compound + plaque + level badge below it.
  const far=z<0.18;
  for(const k of S.world.kingdoms){
    if(!vis(k.wx,k.wy,200)) continue;
    const p=w2s(k.wx,k.wy);
    const cleared=S.nodes[k.id]&&S.nodes[k.id].cleared;
    if(far){
      const s=Math.max(8,Math.min(14,(10+k.lvl*0.5)*z+5));
      drawKeepMini(c,p.x,p.y,s,TAG_COLORS[k.tag]||BRONZE,!!cleared);
      let label='['+k.tag+'] '+k.name;
      if(label.length>18) label=label.slice(0,17);
      const fs=Math.max(7,Math.min(10,22*z));
      const tagTxt='['+k.tag+'] ';
      c.font='bold '+fs+'px Georgia,serif';
      const pw=c.measureText(label).width+10, ph=fs+7;
      let bx=p.x; if(W) bx=Math.max(pw/2+2,Math.min(W-pw/2-2,bx));
      const by=p.y-s*1.9-ph/2;
      c.fillStyle='rgba(12,9,5,0.88)';
      rr(c,bx-pw/2,by-ph/2,pw,ph,3); c.fill();
      c.strokeStyle='rgba(201,162,39,0.65)'; c.lineWidth=1;
      rr(c,bx-pw/2+1,by-ph/2+1,pw-2,ph-2,2); c.stroke();
      c.textAlign='left'; c.textBaseline='middle';
      let tx=bx-pw/2+5;
      c.fillStyle=TAG_COLORS[k.tag]||'#f0d98a';
      c.fillText(tagTxt,tx,by+1); tx+=c.measureText(tagTxt).width;
      c.fillStyle='#f5eedd';
      c.fillText(label.slice(tagTxt.length),tx,by+1);
      c.textAlign='center';
    } else {
      const s=Math.max(14,Math.min(40,(20+k.lvl*1.2)*z+8));
      drawCityIcon(c,p.x,p.y,s,{ruined:!!cleared, tag:k.tag, lvl:k.lvl});
      if(cleared){ // smoke wisp on conquered keeps
        c.strokeStyle='rgba(200,200,200,0.5)'; c.lineWidth=2;
        c.beginPath(); c.moveTo(p.x,p.y-s*1.8);
        c.quadraticCurveTo(p.x+4,p.y-s*2.4+((m.t*2)%10),p.x-3,p.y-s*3); c.stroke();
      }
      const plq=drawPlaque(c,p.x,p.y+s*2.15,'['+k.tag+'] '+k.name,{fs:kfs,color:TAG_COLORS[k.tag]||'#f0d98a',clampW:W});
      const bw=Math.max(7,kfs*0.9); // clear gap: badge top starts below the plaque bottom
      drawLevelBadge(c,p.x,p.y+s*2.15+plq.h/2+bw*1.12+7,k.lvl,bw);
    }
    { // sieges + battle scars: smoke -> fire -> burning
      const siege=S.world.sieges&&S.world.sieges[k.id];
      const fs2=far?9:20;
      if(siege&&now<siege.until){
        const pr=(now-siege.t0)/120000;
        drawSiegeFire(c,p.x,p.y,fs2,pr<0.33?1:pr<0.66?2:3,now);
      } else {
        const krec=S.nodes[k.id];
        if(krec&&krec.dmg&&!cleared) drawSiegeFire(c,p.x,p.y,fs2,Math.min(3,krec.dmg),now);
      }
    }
    m.drawn.push({id:k.id,sx:p.x,sy:p.y});
  }
  // player city at world center
  {
    const p=w2s(WORLD_CX,WORLD_CY);
    if(far){
      const s=11, pr=s*2.3;
      c.strokeStyle='rgba(232,200,106,0.65)'; c.lineWidth=2;
      c.beginPath(); c.arc(p.x,p.y,pr,0,7); c.stroke();
      drawKeepMini(c,p.x,p.y,s,GOLD_L,false);
      const label=(S.kingdomName||'Troy'), fs=8;
      c.font='bold '+fs+'px Georgia,serif';
      const pw=c.measureText(label).width+10, ph=fs+7;
      let bx=p.x; if(W) bx=Math.max(pw/2+2,Math.min(W-pw/2-2,bx));
      const by=p.y-s*1.9-ph/2;
      c.fillStyle='rgba(12,9,5,0.88)';
      rr(c,bx-pw/2,by-ph/2,pw,ph,3); c.fill();
      c.strokeStyle='rgba(201,162,39,0.65)'; c.lineWidth=1;
      rr(c,bx-pw/2+1,by-ph/2+1,pw-2,ph-2,2); c.stroke();
      c.fillStyle='#f0d98a'; c.textAlign='center'; c.textBaseline='middle';
      c.fillText(label,bx,by+1);
    } else {
    const s=Math.max(18,Math.min(38,24*z+10));
    // golden ring highlight (gentle pulse)
    const pr=s*2.3+Math.sin(m.t/14)*3;
    c.strokeStyle='rgba(232,200,106,'+(0.65+0.25*Math.sin(m.t/14))+')';
    c.lineWidth=3; c.beginPath(); c.arc(p.x,p.y,pr,0,7); c.stroke();
    c.strokeStyle='rgba(94,58,26,0.8)'; c.lineWidth=1.5;
    c.beginPath(); c.arc(p.x,p.y,pr+4,0,7); c.stroke();
    drawCityIcon(c,p.x,p.y,s,{roof:GOLD_L,lvl:25});
    const pfs=Math.min(14,kfs+1.5);
    drawPlaque(c,p.x,p.y-s*2.3,(S.kingdomName||'Troy'),{fs:pfs,clampW:W});
    }
    m.drawn.push({id:'player',sx:p.x,sy:p.y});
    // raid warning: smoke rises over Troy while the warband approaches
    if(S.raidsOn&&S.raidWarnAt&&now>=S.raidWarnAt&&now<S.nextRaidAt) drawSiegeFire(c,p.x,p.y,20,1,now);
  }
  drawMarches(c,now);
  drawAIMarches(c);
  drawOutposts(c);
  drawRallies(c,now);
  drawPulses(c,now);
  drawAtmosphere(c,W,H,m.t,now);
  updateMarchQueue();
  // live coordinates readout in the top bar
  const co=$('#wm-coords');
  if(co) co.textContent='X:'+Math.round(m.cam.x)+' Y:'+Math.round(m.cam.y);
  // selection ring
  if(m.sel){
    const e=m.drawn.find(e=>e.id===m.sel);
    if(e){
      c.strokeStyle='#e8c86a'; c.lineWidth=2.5; c.setLineDash([6,4]);
      c.beginPath(); c.arc(e.sx,e.sy,30,0,7); c.stroke(); c.setLineDash([]);
    }
  }
}

  el.innerHTML=S.world.feed.slice(0,5).map(f=>'<div class="wf-row">'+esc(f.txt)+'</div>').join('')||
    '<div class="wf-row">The world stirs…</div>';
  const set=(id,v)=>{ const e=$(id); if(e) e.textContent=v; };
